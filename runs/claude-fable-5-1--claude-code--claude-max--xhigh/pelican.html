<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>鹈鹕骑自行车</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            background: radial-gradient(1200px 700px at 50% 25%, #1d2c48, #0b111d);
            color: #dfe7f3;
            font: 14px/1.4 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(96vw, 1120px, calc((100vh - 90px) * 16 / 9));
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 18px;
            background: #a6dcf0;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
            cursor: pointer;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
            justify-content: center;
            margin-top: 14px;
        }

        .bar button {
            min-width: 76px;
            padding: 7px 16px;
            border: 1px solid #40506e;
            border-radius: 999px;
            background: #1b2740;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .bar button:hover {
            background: #25345a;
        }

        .bar label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bar input {
            accent-color: #e4463a;
        }

        .bar output {
            min-width: 3.2em;
            font-variant-numeric: tabular-nums;
        }

        .bar small {
            opacity: .6;
        }

        /* 描边与部件 */
        .ol {
            stroke: #2a2438;
            stroke-width: 3;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .tube-o,
        .tube,
        .leg-o,
        .leg {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tube-o {
            stroke: #2a2438;
            stroke-width: 11;
        }

        .tube {
            stroke: #e4463a;
            stroke-width: 6;
        }

        .leg-o {
            stroke: #2a2438;
            stroke-width: 14;
        }

        .leg {
            stroke: #f39a2b;
            stroke-width: 9;
        }

        .foot {
            fill: #f39a2b;
        }

        .far .leg {
            stroke: #c4761f;
        }

        .far .foot {
            fill: #c4761f;
        }

        .crank {
            stroke: #2a2438;
            stroke-width: 7;
            stroke-linecap: round;
        }

        .pedal {
            fill: #2a2438;
        }

        .scarf-o,
        .scarf {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .scarf-o {
            stroke: #2a2438;
            stroke-width: 13;
        }

        .scarf {
            stroke: #e4463a;
            stroke-width: 8;
        }

        /* 环境小动画 */
        .sparkle {
            animation: twinkle 2.4s ease-in-out infinite;
        }

        .sparkle.b {
            animation-delay: -1.2s;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .12;
            }

            50% {
                opacity: .7;
            }
        }

        .bob {
            animation: bob 3.2s ease-in-out infinite;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0) rotate(-2.5deg);
            }

            50% {
                transform: translateY(2px) rotate(2.5deg);
            }
        }

        .glow {
            animation: pulse 5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .75;
            }

            50% {
                opacity: 1;
            }
        }

        .paused .sparkle,
        .paused .bob,
        .paused .glow {
            animation-play-state: paused;
        }
    </style>
</head>

                        </g>
                        <path class="ol" fill="url(#bill)"
                            d="M17-15C60-12 110 2 156 18Q167 23 163 34Q157 30 151 28L21 6Z" />
                        <path d="M44-6L128 13" fill="none" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"
                            opacity=".6" />
                    </g>
                </g>

                <!-- 近侧的腿 -->
                <g id="legNear">
                    <line id="crankNear" class="crank" x1="442" y1="390" x2="472" y2="390" />
                    <circle class="ol" style="stroke-width:2" cx="442" cy="390" r="4.5" fill="#c3ccd6" />
                    <path id="legNearO" class="leg-o" />
                    <path id="legNearF" class="leg" />
                    <g id="footNear">
                        <rect class="pedal" x="-13" y="-3" width="26" height="6" rx="2.5" />
                        <path class="foot ol" d="M-16-17C-9-19-3-15 1-11L27-7Q33-5 30-3H-13C-18-5-19-12-16-17Z" />
                    </g>
                    <g id="thigh">
                        <path d="M-18-14C4-22 30-16 44-6L36-1L46 5L35 8L40 15C16 22-8 20-20 12Z" fill="#fff" />
                        <path class="ol" d="M10-19C26-17 38-11 44-6L36-1L46 5L35 8L40 15C28 19 16 20 6 19"
                            fill="none" />
                    </g>
                </g>

                <!-- 近侧翅膀 -->
                <g id="wingNear">
                    <use href="#wingGeo" fill="#f9fbfe" />
                </g>
            </g>

            <!-- 前景草丛 -->
            <rect y="526" width="960" height="14" fill="#5a9a55" />
            <g id="L-grass">
                <g id="T-grass" fill="#3f7d4a">
                    <use href="#blades" transform="translate(70 544) scale(1.3)" />
                    <use href="#blades" transform="translate(230 546) scale(1.7)" />
                    <use href="#blades" transform="translate(380 544) scale(-1.2 1.2)" />
                    <use href="#blades" transform="translate(540 546) scale(1.5)" />
                    <use href="#blades" transform="translate(700 544) scale(-1.6 1.6)" />
                    <use href="#blades" transform="translate(850 546) scale(1.25)" />
                </g>
                <use href="#T-grass" x="960" />
                <use href="#T-grass" x="-960" />
            </g>
        </svg>

        <div class="bar">
            <button id="toggle" type="button">暂停</button>
            <label>速度
                <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1">
                <output id="speedOut">1.0×</output>
            </label>
            <small>点击画面或按空格键 暂停 / 继续</small>
        </div>
    </main>

    <script>
        (() => {
            'use strict';
            const $ = id => document.getElementById(id);
            const SVGNS = 'http://www.w3.org/2000/svg';
            const DEG = 180 / Math.PI;
            const f = n => n.toFixed(2);

            // 几何参数（SVG 用户单位）
            const BB = { x: 442, y: 390 };          // 中轴
            const CRANK = 30, WHEEL_R = 62, GEAR = 2, RING_R = 18;
            const SEAT = { x: 404, y: 262 };
            const HIP = { x: 416, y: 250 };
            const SHOULDER = { x: 420, y: 196 };
            const GRIP = { x: 564, y: 234 };
            const HEAD = { x: 486, y: 94 };
            const THIGH = 84, SHIN = 84;
            const ANKLE = { x: -10, y: -12 };       // 脚踝相对脚踏中心
            const CADENCE = Math.PI * 2 / 1.5;      // 1× 速度下的踏频 (rad/s)

            const svg = $('scene');
            const make = (tag, attrs, parent) => {
                const n = document.createElementNS(SVGNS, tag);
                for (const k in attrs) n.setAttribute(k, attrs[k]);
                parent.appendChild(n);
                return n;
            };

            // 视差图层：[id, 视差系数, 平铺宽度, 静止时的漂移 px/s]
            const layers = [
                ['L-clouds', 0.02, 960, 5],
                ['L-far', 0.04, 960, 0],
                ['L-boat', 0.07, 1400, 0],
                ['L-spark', 0.1, 960, 0],
                ['L-dunes', 0.3, 960, 0],
                ['L-fence', 0.75, 960, 0],
                ['L-specks', 1, 960, 0],
                ['L-lane', 1.15, 960, 0],
                ['L-grass', 1.6, 960, 0],
            ].map(([id, factor, width, drift]) => ({ node: $(id), factor, width, drift }));

            const dust = Array.from({ length: 7 }, () => make('circle', { r: 0 }, $('dust')));
            const streaks = [
                { y: 70, len: 90, factor: 1.9, off: 0 },
                { y: 152, len: 60, factor: 1.6, off: 520 },
                { y: 238, len: 120, factor: 2.1, off: 930 },
                { y: 332, len: 70, factor: 1.7, off: 300 },
            ].map(s => ({ ...s, node: make('line', { y1: s.y, y2: s.y }, $('streaks')) }));

            const legs = [
                {
                    phase: 0, dx: 0, dy: 0, crank: $('crankNear'), foot: $('footNear'),
                    paths: [$('legNearO'), $('legNearF')], thigh: $('thigh')
                },
                {
                    phase: Math.PI, dx: 8, dy: -3, crank: $('crankFar'), foot: $('footFar'),
                    paths: [$('legFarO'), $('legFarF')], thigh: null
                },
            ];

            let crank = 0;      // 曲柄角 (rad)，顺时针为正
            let dist = 0;       // 行驶距离 (px)
            let time = 0;       // 动画时钟 (s)
            let wind = 0;       // 风的相位，随车速变快
            let speed = 1;
            let running = true;
            let last = performance.now();

            // 身体的轻微起伏：先绕车座旋转，再上下平移
            function sway(p, bob, rock) {
                const r = rock / DEG, c = Math.cos(r), s = Math.sin(r);
                const x = p.x - SEAT.x, y = p.y - SEAT.y;
                return { x: SEAT.x + x * c - y * s, y: SEAT.y + x * s + y * c + bob };
            }

            // 两段式反向运动学，膝盖朝前
            function knee(hx, hy, ax, ay) {
                const dx = ax - hx, dy = ay - hy;
                const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
                const cos = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
                const a = Math.acos(Math.max(-1, Math.min(1, cos)));
                const base = Math.atan2(dy, dx);
                const k1 = { x: hx + THIGH * Math.cos(base - a), y: hy + THIGH * Math.sin(base - a) };
                const k2 = { x: hx + THIGH * Math.cos(base + a), y: hy + THIGH * Math.sin(base + a) };
                return k1.x > k2.x ? k1 : k2;
            }

            // 迎风飘动的围巾
            function ribbon(x0, y0, len, amp, rise, phase) {
                const N = 9, pts = [];
                for (let i = 0; i <= N; i++) {
                    const u = i / N;
                    pts.push([x0 - u * len, y0 + rise * u + amp * u * Math.sin(u * 6.5 - wind * 12 + phase)]);
                }
                let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
                for (let i = 1; i < N; i++) {
                    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
                    d += `Q${f(pts[i][0])} ${f(pts[i][1])} ${f(mx)} ${f(my)}`;
                }
                return d + `L${f(pts[N][0])} ${f(pts[N][1])}`;
            }

            function render() {
                // 车轮、牙盘、链条
                const wheelDeg = (crank * GEAR * DEG) % 360;
                $('spinR').setAttribute('transform', `rotate(${f(wheelDeg)})`);
                $('spinF').setAttribute('transform', `rotate(${f(wheelDeg)})`);
                $('ring').setAttribute('transform', `rotate(${f((crank * DEG) % 360)} ${BB.x} ${BB.y})`);
                $('chain').setAttribute('stroke-dashoffset', f(-((crank * RING_R) % 7)));

                // 背景视差滚动
                for (const L of layers) {
                    const x = -((dist * L.factor + time * L.drift) % L.width);
                    L.node.setAttribute('transform', `translate(${f(x)} 0)`);
                }
                for (const s of streaks) {
                    const span = 1160 + s.len;
                    const x = 960 - ((dist * s.factor + s.off) % span);
                    s.node.setAttribute('x1', f(x));
                    s.node.setAttribute('x2', f(x + s.len));
                }

                // 身体起伏
                const bob = 1.6 * Math.sin(2 * crank + 0.6);
                const rock = 0.9 * Math.sin(crank + 0.4);
                $('upper').setAttribute('transform',
                    `translate(0 ${f(bob)}) rotate(${f(rock)} ${SEAT.x} ${SEAT.y})`);

                // 翅膀：手固定在车把上，肩膀跟着身体动
                const sh = sway(SHOULDER, bob, rock);
                const wingRot = (Math.atan2(sh.y - GRIP.y, sh.x - GRIP.x)
                    - Math.atan2(SHOULDER.y - GRIP.y, SHOULDER.x - GRIP.x)) * DEG;
                const wingT = `rotate(${f(wingRot)} ${GRIP.x} ${GRIP.y})`;
                $('wingNear').setAttribute('transform', wingT);
                $('wingFar').setAttribute('transform', wingT);

                // 头与脖子
                const hx = HEAD.x + 3.5 * Math.sin(crank + 1.2);
                const hy = HEAD.y + 1.8 * Math.sin(2 * crank + 2.2);
                const hr = 2.2 * Math.sin(crank + 0.2);
                const headT = `translate(${f(hx)} ${f(hy)}) rotate(${f(hr)})`;
                $('headBase').setAttribute('transform', headT);
                $('headFace').setAttribute('transform', headT);

                const p0 = [448, 196], p1 = [520, 175];
                const p2 = [430 + (hx - HEAD.x) * 0.7, 135 + (hy - HEAD.y) * 0.7];
                const p3 = [hx - 8, hy + 10];
                const neck = `M${p0[0]} ${p0[1]}C${p1[0]} ${p1[1]} ${f(p2[0])} ${f(p2[1])} ${f(p3[0])} ${f(p3[1])}`;
                $('neckO').setAttribute('d', neck);
                $('neckF').setAttribute('d', neck);

                // 围巾：沿脖子曲线取一点，朝后打结
                const t = 0.38, u = 1 - t;
                const bez = i => u * u * u * p0[i] + 3 * u * u * t * p1[i] + 3 * u * t * t * p2[i] + t * t * t * p3[i];
                const tan = i => 3 * u * u * (p1[i] - p0[i]) + 6 * u * t * (p2[i] - p1[i]) + 3 * t * t * (p3[i] - p2[i]);
                const bx = bez(0), by = bez(1);
                const ang = Math.atan2(tan(1), tan(0));
                let nx = -Math.sin(ang), ny = Math.cos(ang);
                if (nx > 0) { nx = -nx; ny = -ny; }
                const kx = bx + nx * 15, ky = by + ny * 15;
                $('band').setAttribute('transform', `translate(${f(bx)} ${f(by)}) rotate(${f(ang * DEG + 90)})`);
                $('knot').setAttribute('cx', f(kx));
                $('knot').setAttribute('cy', f(ky));
                const ra = ribbon(kx, ky, 116, 12, -34, 0);
                const rb = ribbon(kx, ky, 88, 9, -10, 1.7);
                $('scarfAO').setAttribute('d', ra);
                $('scarfA').setAttribute('d', ra);
                $('scarfBO').setAttribute('d', rb);
                $('scarfB').setAttribute('d', rb);

                // 冠羽、尾羽、鱼
                $('crest').setAttribute('transform', `rotate(${f(4 + 7 * Math.sin(wind * 11))} -18 -10)`);
                $('tail').setAttribute('transform', `rotate(${f(3 * Math.sin(wind * 9 + 1))} 320 238)`);
                $('fishA').setAttribute('transform', `translate(611 256) rotate(${f(-10 + 5 * Math.sin(wind * 7))})`);
                $('fishB').setAttribute('transform', `translate(632 256) rotate(${f(14 + 5 * Math.sin(wind * 7 + 2))})`);

                // 喉囊晃动、偶尔张嘴、眨眼
                const w1 = 3 * Math.sin(2 * crank + 1.5), w2 = 2.5 * Math.sin(2 * crank + 0.4);
                $('pouch').setAttribute('d',
                    `M21 6L152 29C${f(132 + w1)} ${f(68 + w2)} ${f(64 + w1)} ${f(80 + w2 * 1.4)} 14 22Z`);
                const q = time % 6;
                const open = q < 0.9 ? 9 * Math.sin(q / 0.9 * Math.PI) ** 2 : 0;
                $('jaw').setAttribute('transform', `rotate(${f(open)} 21 6)`);
                const b = time % 3.7;
                const lid = b < 0.16 ? Math.sin(b / 0.16 * Math.PI) : 0;
                $('lid').setAttribute('transform', `translate(8 -12) scale(1 ${f(lid)})`);

                // 双腿踩踏
                const hip = sway(HIP, bob, rock);
                for (const leg of legs) {
                    const a = crank + leg.phase;
                    const px = BB.x + CRANK * Math.cos(a), py = BB.y + CRANK * Math.sin(a);
                    leg.crank.setAttribute('x2', f(px));
                    leg.crank.setAttribute('y2', f(py));
                    const tilt = 8 + 10 * Math.sin(a - Math.PI / 4);
                    leg.foot.setAttribute('transform', `translate(${f(px)} ${f(py)}) rotate(${f(tilt)})`);
                    const tr = tilt / DEG, c = Math.cos(tr), s = Math.sin(tr);
                    const ax = px + ANKLE.x * c - ANKLE.y * s;
                    const ay = py + ANKLE.x * s + ANKLE.y * c;
                    const hx0 = hip.x + leg.dx, hy0 = hip.y + leg.dy;
                    const k = knee(hx0, hy0, ax, ay);
                    const d = `M${f(hx0)} ${f(hy0)}L${f(k.x)} ${f(k.y)}L${f(ax)} ${f(ay)}`;
                    for (const p of leg.paths) p.setAttribute('d', d);
                    if (leg.thigh) {
                        const ta = Math.atan2(k.y - hy0, k.x - hx0) * DEG;
                        leg.thigh.setAttribute('transform', `translate(${f(hx0)} ${f(hy0)}) rotate(${f(ta)})`);
                    }
                }

                // 后轮扬尘
                dust.forEach((c, i) => {
                    const life = (wind * 1.1 + i / dust.length) % 1;
                    c.setAttribute('cx', f(318 - life * 110));
                    c.setAttribute('cy', f(437 - life * 20 - 5 * Math.sin(life * 3 + i * 2)));
                    c.setAttribute('r', f(3 + life * 12));
                    c.setAttribute('opacity', f(0.55 * (1 - life) * Math.min(1, speed)));
                });
            }

            function frame(now) {
                const dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                if (running) {
                    const da = CADENCE * speed * dt;
                    crank += da;
                    dist += da * GEAR * WHEEL_R;
                    time += dt;
                    wind += dt * (0.35 + 0.65 * speed);
                    render();
                }
                requestAnimationFrame(frame);
            }

            function toggle() {
                running = !running;
                svg.classList.toggle('paused', !running);
                $('toggle').textContent = running ? '暂停' : '播放';
            }

            $('toggle').addEventListener('click', toggle);
            svg.addEventListener('click', toggle);
            document.addEventListener('keydown', e => {
                if (e.code !== 'Space' || e.target.closest?.('button, input')) return;
                e.preventDefault();
                toggle();
            });
            $('speed').addEventListener('input', e => {
                speed = Number(e.target.value);
                $('speedOut').textContent = speed.toFixed(1) + '×';
            });

            render();
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
