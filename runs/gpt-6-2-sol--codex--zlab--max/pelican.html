<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      color: #263c35;
      background: #f7f1e5;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(22px, 4.5vh, 44px) clamp(16px, 5vw, 80px);
      display: grid;
      place-items: center;
    }

    main { width: min(100%, 1260px); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: clamp(14px, 2vw, 23px);
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif CJK SC", "Songti SC", "STSong", SimSun, serif;
      font-size: clamp(1.85rem, 3.6vw, 3rem);
      font-weight: 700;
      letter-spacing: .07em;
      line-height: 1.15;
    }

    .playback {
      display: inline-flex;
      min-height: 44px;
      flex: none;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      border: 1px solid #b8bdb0;
      border-radius: 999px;
      color: inherit;
      background: #fffaf0;
      font: 500 .875rem/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    .playback[hidden] { display: none; }
    .playback:hover { background: #e9ecdf; }
    .playback:focus-visible { outline: 2px solid #326758; outline-offset: 4px; }

    figure {
      aspect-ratio: 1200 / 680;
      margin: 0;
      overflow: hidden;
      border: 1px solid #d6c4aa;
      border-radius: clamp(13px, 1.8vw, 24px);
      background: #f4dbb5;
      box-shadow: 0 16px 48px #674d3220;
    }

    figure > svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 640px) {
      figure { aspect-ratio: 9 / 10; }
    }
  </style>
</head>

            <path d="M465 325c20-2 38-10 54-21m-27 32c23-5 44-16 59-29m-82-10c23-7 36-19 55-21"
                  fill="none" stroke="#abb19b" stroke-width="2" opacity=".8"/>

            <path d="M675 189c33 3 80 6 129 12l40 7c-9 14-35 24-69 33
                     -27 8-38 29-62 29-24 0-39-17-45-38-4-16-4-34 7-43z"
                  fill="url(#pouch)"/>
            <path d="M675 213c7 25 20 39 42 40 16 1 32-9 44-15" fill="none"
                  stroke="#b76847" stroke-opacity=".7" stroke-width="2.2"/>
            <path d="M675 177c35 3 79 6 121 12 20 3 37 7 47 13 6 4 7 10 1 15
                     l-8 1c2-4-1-7-7-8-41-4-79 0-117-1-23 0-36-5-44-13-7-7-2-17 7-19z"
                  fill="url(#bill)"/>
            <path d="M682 184c42 3 99 6 143 16" fill="none" stroke="#ffeab1" stroke-width="2.6"/>
            <path d="M835 199q16 5 11 14l-10 5q2-6-2-7l-5-1z" fill="#b6704f" stroke="none"/>
            <path d="M693 192l8 1" stroke="#8d684a" stroke-width="2.5"/>

            <path d="M651 162q5-7 14-7" fill="none" stroke-width="2.5"/>
            <g transform="translate(666 168)" stroke="none">
              <g id="pelican-eye">
                <ellipse rx="8.5" ry="8.3" fill="#e3a55e"/>
                <circle cx="1.9" r="5.4" fill="#293c33"/>
                <circle cx="3.6" cy="-2.1" r="1.8" fill="#fff9e8"/>
              </g>
            </g>
          </g>

          <path id="holding-wing" d="M618 270c20-4 34 11 48 27 10 10 17 15 24 15
                     3-4 7-5 10-2 3 4-1 10-8 13-11 4-21 0-38-8-22-10-38-21-44-33"
                fill="url(#feathers)" stroke="#2e4036" stroke-width="3.2"/>
          <path d="M687 313q5 3 8-3" fill="none" stroke="#788575" stroke-width="2.4"/>
        </g>
      </svg>
    </figure>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);
    const playbackButton = byId("playback");
    const playbackIcon = byId("playback-icon");
    const playbackLabel = byId("playback-label");
    const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");

    const cyclist = byId("cyclist");
    const body = byId("pelican-body");
    const eye = byId("pelican-eye");
    const holdingWing = byId("holding-wing");
    const chain = byId("chain-motion");
    const roadMarkings = byId("road-markings");
    const wheels = [byId("rear-spokes"), byId("front-spokes")];
    const movingLayers = [
      { element: byId("water-movement"), speed: 20 },
      { element: byId("dune-movement"), speed: 80 },
      { element: byId("foreground-movement"), speed: 162 },
    ];

    const crank = { x: 548, y: 496, radius: 32 };
    const legs = [
      { name: "far", hipX: 552, hipY: 343, phase: Math.PI, thigh: 94, shin: 98 },
      { name: "near", hipX: 532, hipY: 342, phase: 0, thigh: 98, shin: 96 },
    ].map((leg) => ({
      ...leg,
      line: byId(leg.name + "-leg-line"),
      foot: byId(leg.name + "-foot"),
      pedal: byId(leg.name + "-pedal"),
      arm: byId(leg.name + "-crank"),
    }));

    const fullTurn = 2 * Math.PI;
    const pedalPeriod = 1.56;
    const roadSpeed = 390;
    const tireRadius = 97;
    let elapsed = 0;
    let lastFrame = null;
    let frameRequest = null;
    let playing = false;

    function drawLeg(leg, pedalAngle, bob) {
      const angle = pedalAngle + leg.phase;
      const pedalX = crank.x + crank.radius * Math.cos(angle);
      const pedalY = crank.y + crank.radius * Math.sin(angle);
      const pitch = 0.12 * Math.sin(angle + 0.5);
      const degrees = angle * 180 / Math.PI;
      const position = "translate(" + pedalX + " " + pedalY + ")";

      leg.arm.setAttribute("transform", "rotate(" + degrees + ")");
      leg.pedal.setAttribute("transform", position);
      leg.foot.setAttribute("transform", position + " rotate(" + pitch * 180 / Math.PI + ")");

      const hipY = leg.hipY + bob;
      const ankleX = pedalX - 10 * Math.cos(pitch) + 11 * Math.sin(pitch);
      const ankleY = pedalY - 10 * Math.sin(pitch) - 11 * Math.cos(pitch);
      const dx = ankleX - leg.hipX;
      const dy = ankleY - hipY;
      const reach = Math.hypot(dx, dy);

      // The knee is the forward intersection of circles centered at the hip and ankle.
      const along = (leg.thigh ** 2 - leg.shin ** 2 + reach ** 2) / (2 * reach);
      const bend = Math.sqrt(Math.max(0, leg.thigh ** 2 - along ** 2));
      const kneeX = leg.hipX + (dx * along + dy * bend) / reach;
      const kneeY = hipY + (dy * along - dx * bend) / reach;
      const beforeX = kneeX + 0.16 * (leg.hipX - kneeX);
      const beforeY = kneeY + 0.16 * (hipY - kneeY);
      const afterX = kneeX + 0.16 * (ankleX - kneeX);
      const afterY = kneeY + 0.16 * (ankleY - kneeY);

      leg.line.setAttribute("d", [
        "M", leg.hipX, hipY, "L", beforeX, beforeY,
        "Q", kneeX, kneeY, afterX, afterY, "L", ankleX, ankleY,
      ].join(" "));
    }

    function drawRide(time) {
      const cycle = fullTurn * time / pedalPeriod;
      const pedalAngle = (cycle % fullTurn) + 0.4;
      const bob = 2.2 * Math.sin(2 * cycle);
      const drift = 11 * Math.sin(fullTurn * time / 8);
      const wheelAngle = ((time * roadSpeed + drift) / tireRadius * 180 / Math.PI) % 360;

      cyclist.setAttribute("transform", "translate(" + drift + " 0)");
      body.setAttribute("transform", "translate(0 " + bob + ")");
      holdingWing.setAttribute("d", [
        "M", 618, 270 + bob,
        "C", 638, 266 + bob, 652, 281 + bob / 2, 666, 297,
        "C", 676, 307, 683, 312, 690, 312,
        "C", 693, 308, 697, 307, 700, 310,
        "C", 703, 314, 699, 320, 692, 323,
        "C", 681, 327, 671, 323, 654, 315,
        "C", 632, 305 + bob / 2, 616, 294 + bob, 610, 282 + bob,
      ].join(" "));

      const blink = (time + 2.6) % 5.6;
      const eyeHeight = blink < 0.17 ? 1 - 0.92 * Math.sin(Math.PI * blink / 0.17) : 1;
      eye.setAttribute("transform", "scale(1 " + eyeHeight + ")");
      legs.forEach((leg) => drawLeg(leg, pedalAngle, bob));
      wheels.forEach((wheel) => wheel.setAttribute("transform", "rotate(" + wheelAngle + ")"));
      chain.setAttribute("stroke-dashoffset", -((time * 77) % 6));
      roadMarkings.setAttribute("stroke-dashoffset", -((time * roadSpeed) % 212));

      movingLayers.forEach(({ element, speed }) => {
        element.setAttribute("transform", "translate(" + -((time * speed) % 1200) + " 0)");
      });
    }

    function tick(timestamp) {
      if (lastFrame !== null) {
        elapsed += Math.min((timestamp - lastFrame) / 1000, 0.06);
      }
      lastFrame = timestamp;
      drawRide(elapsed);
      frameRequest = requestAnimationFrame(tick);
    }

    function setPlaying(next) {
      if (playing !== next) {
        playing = next;
        lastFrame = null;
        if (playing) {
          frameRequest = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(frameRequest);
          frameRequest = null;
        }
      }

      playbackLabel.textContent = playing ? "暂停" : "播放";
      playbackButton.setAttribute("aria-label", playing ? "暂停动画" : "播放动画");
      playbackIcon.setAttribute("d", playing ? "M4 3h3v10H4z M9 3h3v10H9z" : "M5 3l8 5-8 5z");
    }

    playbackButton.addEventListener("click", () => setPlaying(!playing));
    motionPreference.addEventListener("change", (event) => setPlaying(!event.matches));
    drawRide(0);
    setPlaying(!motionPreference.matches);
    playbackButton.hidden = false;
  </script>
</body>
