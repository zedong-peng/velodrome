<title>骑单车的鹈鹕</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #cae7e6;
  }
  body { display: grid; place-items: center; }
  .stage {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .cloud {
    animation: drift 16s ease-in-out infinite alternate;
    will-change: transform;
  }
  .cloud-2 {
    animation-duration: 21s;
    animation-delay: -5s;
  }
  .cloud-3 {
    animation-duration: 18s;
    animation-delay: -9s;
  }
  .distant-bird {
    animation: drift 22s ease-in-out infinite alternate;
    animation-delay: -7s;
  }
  .wind {
    animation: gust 3.2s ease-in-out infinite;
    will-change: transform, opacity;
  }
  .wind-2 {
    animation-duration: 4.1s;
    animation-delay: -1.4s;
  }
  .wind-3 {
    animation-duration: 2.7s;
    animation-delay: -2.2s;
  }
  .road-line {
    animation: road-flow 2.3s linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(-16px); }
    to   { transform: translateX(22px); }
  }
  @keyframes gust {
    0%, 100% { opacity: 0.18; transform: translateX(14px); }
    50%      { opacity: 0.62; transform: translateX(-14px); }
  }
  @keyframes road-flow {
    to { stroke-dashoffset: 168; }
  }
</style>
</head>

<script>
(() => {
  const BB = { x: 590, y: 490 };
  const CRANK = 46;
  const THIGH = 92;
  const SHIN = 104;
  const cadence = Math.PI * 2 * 0.9;

  const rig = document.getElementById('rig');
  const rearSpin = document.getElementById('rear-spin');
  const frontSpin = document.getElementById('front-spin');
  const nearCrank = document.getElementById('near-crank');
  const farCrank = document.getElementById('far-crank');
  const nearPedal = document.getElementById('near-pedal');
  const farPedal = document.getElementById('far-pedal');
  const nearHip = { x: 566, y: 349 };
  const farHip = { x: 550, y: 346 };

  const degrees = (radians) => radians * 180 / Math.PI;

  function setLine(id, from, to) {
    const line = document.getElementById(id);
    line.setAttribute('x1', from.x.toFixed(2));
    line.setAttribute('y1', from.y.toFixed(2));
    line.setAttribute('x2', to.x.toFixed(2));
    line.setAttribute('y2', to.y.toFixed(2));
  }

  function solveIK(hip, target) {
    let dx = target.x - hip.x;
    let dy = target.y - hip.y;
    let distance = Math.hypot(dx, dy);
    const max = THIGH + SHIN - 0.5;
    const min = Math.abs(THIGH - SHIN) + 0.5;
    if (distance > max) {
      dx *= max / distance;
      dy *= max / distance;
      distance = max;
    } else if (distance < min) {
      dx *= min / distance;
      dy *= min / distance;
      distance = min;
    }
    const along = (THIGH * THIGH - SHIN * SHIN + distance * distance) / (2 * distance);
    const offset = Math.sqrt(Math.max(0, THIGH * THIGH - along * along));
    const midX = hip.x + dx * along / distance;
    const midY = hip.y + dy * along / distance;
    return {
      x: midX + offset * dy / distance,
      y: midY - offset * dx / distance
    };
  }

  function updateLeg(prefix, hip, foot) {
    const knee = solveIK(hip, foot);
    setLine(prefix + '-thigh-outline', hip, knee);
    setLine(prefix + '-thigh', hip, knee);
    setLine(prefix + '-shin-outline', knee, foot);
    setLine(prefix + '-shin', knee, foot);
    const kneeJoint = document.getElementById(prefix + '-knee');
    kneeJoint.setAttribute('cx', knee.x.toFixed(2));
    kneeJoint.setAttribute('cy', knee.y.toFixed(2));
    const footGroup = document.getElementById(prefix + '-foot');
    footGroup.setAttribute('transform', `translate(${foot.x.toFixed(2)} ${foot.y.toFixed(2)})`);
  }

  let startTime = null;

  function animate(now) {
    if (startTime === null) startTime = now;
    const t = (now - startTime) / 1000;
    const pedalAngle = t * cadence;
    const farAngle = pedalAngle + Math.PI;

    const nearFootBaseX = BB.x + CRANK * Math.cos(pedalAngle);
    const nearFootBaseY = BB.y + CRANK * Math.sin(pedalAngle);
    const farFootBaseX = BB.x + CRANK * Math.cos(farAngle);
    const farFootBaseY = BB.y + CRANK * Math.sin(farAngle);

    const nearFoot = { x: nearFootBaseX, y: nearFootBaseY - 4 };
    const farFoot = { x: farFootBaseX, y: farFootBaseY - 4 };

    nearCrank.setAttribute('transform', `rotate(${degrees(pedalAngle).toFixed(2)} ${BB.x} ${BB.y})`);
    farCrank.setAttribute('transform', `rotate(${degrees(farAngle).toFixed(2)} ${BB.x} ${BB.y})`);
    nearPedal.setAttribute('transform', `translate(${nearFootBaseX.toFixed(2)} ${nearFootBaseY.toFixed(2)})`);
    farPedal.setAttribute('transform', `translate(${farFootBaseX.toFixed(2)} ${farFootBaseY.toFixed(2)})`);

    updateLeg('near', nearHip, nearFoot);
    updateLeg('far', farHip, farFoot);

    const wheelAngle = t * 360 * 1.8;
    rearSpin.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);
    frontSpin.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);

    const bob = Math.sin(pedalAngle * 2) * 2.4;
    rig.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
