        <path d="M396 198C391 152 400 112 449 107" fill="none" stroke="#fffefa" stroke-width="25"/>
        <ellipse cx="453" cy="105" rx="21" ry="18" fill="#fffefa"/>
        <ellipse cx="458" cy="114" rx="5.5" ry="3.2" fill="#ffb3a7" fill-opacity=".55"/>
        <g id="eye" transform="translate(463 102)">
          <ellipse rx="4.8" ry="5" fill="#ffffff" stroke="#2d2a3e" stroke-width="1.6"/>
          <circle cx=".9" r="2.7" fill="#1d1b2b"/>
          <circle cx="1.8" cy="-1" r=".9" fill="#ffffff"/>
        </g>
        <path d="M456 93.5C461 91 467 91.5 472 94.5" fill="none" stroke="#2d2a3e" stroke-width="2.2"/>
        <g id="crest" transform="translate(437 95)" fill="#fffefa" stroke="#2d2a3e" stroke-width="1.8">
          <path transform="rotate(204) scale(.8)" d="M0 0C6 -5 16 -6 26 -2C17 2 7 3 0 0Z"/>
          <path transform="rotate(226)" d="M0 0C6 -5 16 -6 26 -2C17 2 7 3 0 0Z"/>
          <path transform="rotate(248) scale(.9)" d="M0 0C6 -5 16 -6 26 -2C17 2 7 3 0 0Z"/>
        </g>
      </g>

      <!-- 身体 -->
      <path d="M248 196C266 176 292 156 328 150C358 145 392 150 408 166C428 186 430 214 410 227C392 238 356 241 326 234C296 228 266 214 248 196Z" fill="url(#gBody)" stroke="#2d2a3e" stroke-width="2.6"/>
      <path d="M398 190q6 4 13 1M394 204q7 4 14 0M382 218q7 3 14-1" fill="none" stroke="#cfd7e3" stroke-width="1.8"/>

      <!-- 翅膀（含伸向车把的前臂）与深色飞羽 -->
      <use href="#wingP" fill="#e9eef5"/>
      <path d="M296 150L298 178L309 184L294 192L306 199L292 207L305 214L300 232L236 232L236 150Z" fill="#3b3e52" clip-path="url(#clipWing)"/>
      <path d="M322 183q7 7 14 0M337 183q7 7 14 0M352 183q7 7 14 0M367 182q7 7 14 0M329 197q7 7 14 0M344 198q7 7 14 0M359 198q7 7 14 0M374 197q7 7 14 0M397 190q6 6 12 1M413 194q6 6 12 1M429 199q6 5 11 1" fill="none" stroke="#c5cfde" stroke-width="1.6"/>
      <use href="#wingP" fill="none" stroke="#2d2a3e" stroke-width="2.4"/>
      <path d="M452 199C458 194 468 196 471 203C473 209 469 216 462 217C455 218 448 213 447 207C447 204 449 201 452 199Z" fill="#3b3e52" stroke="#2d2a3e" stroke-width="2.2"/>
      <path d="M459 199.5C463 199.5 467 201.5 469 204.5M458.5 205.5C462.5 205.5 467 207.5 469 210.5M458 211.5C461 211.5 465 212.5 467 215M451 202C453 199.5 456 198.5 459 198.5" fill="none" stroke="#5d6280" stroke-width="1.6"/>

      <!-- 围巾 -->
      <path id="scarfB" fill="#f5a623" stroke="#2d2a3e" stroke-width="2.2"/>
      <path id="scarfA" fill="#ffcc33" stroke="#2d2a3e" stroke-width="2.2"/>
      <rect x="379" y="153" width="38" height="14" rx="6" transform="rotate(26 398 160)" fill="#ffcc33" stroke="#2d2a3e" stroke-width="2.4"/>
    </g>

</div>
<p id="hint">点击画面或按空格键：暂停 / 继续</p>
<noscript><p>需要启用 JavaScript 才能播放动画。</p></noscript>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const set = (el, k, v) => el.setAttribute(k, v);
  const setAll = (els, k, v) => els.forEach(el => el.setAttribute(k, v));
  const r2 = n => Math.round(n * 100) / 100;
  const TAU = Math.PI * 2, DEG = 180 / Math.PI;

  /* ---------- 几何参数（与 SVG 中的坐标一致） ---------- */
  const BB = [372, 349], RA = [290, 338], HIP = [346, 224];
  const WHEEL_R = 62, RING_R = 22, COG_R = 13;
  const CRANK = 34, THIGH = 78, SHIN = 82;
  const ANKLE = [-12, -13];                 // 脚踝相对踏板中心的偏移
  const GEAR = RING_R / COG_R;              // 曲柄转一圈，后轮转 GEAR 圈
  const CADENCE = 0.75;                     // 踏频：圈 / 秒

  /* ---------- 元素 ---------- */
  const wheelR = $('wheelR'), wheelF = $('wheelF'), cog = $('cog'), ring = $('ring');
  const chain = [$('chain'), $('chainL')], chainL = $('chainL');
  const bobs = [$('bobA'), $('bobB')];
  const neckHead = $('neckHead'), tailF = $('tailF'), crest = $('crest'), eye = $('eye');
  const pouch = $('pouch'), vein = $('vein'), scarfA = $('scarfA'), scarfB = $('scarfB');
  const fishTail = $('fishTail'), sunRays = $('sunRays');
  const dust = Array.from({ length: 6 }, (_, i) => $('dust' + i));
  const legs = [
    { phase: 0,       crank: [$('crankNO'), $('crankN')], pedal: $('pedalN'), foot: $('nFoot'),
      thigh: [$('nThighO'), $('nThigh')], shin: [$('nShinO'), $('nShin')] },
    { phase: Math.PI, crank: [$('crankFO'), $('crankF')], pedal: $('pedalF'), foot: $('fFoot'),
      thigh: [$('fThighO'), $('fThigh')], shin: [$('fShinO'), $('fShin')] }
  ];
  // 视差层：[元素, 相对路面的速度比, 循环周期]
  const layers = [
    [$('lMount'), 0.015, 800], [$('lHillF'), 0.04, 800], [$('lHillN'), 0.10, 800],
    [$('lTrees'), 0.30, 800], [$('lTufts'), 0.85, 800], [$('lDash'), 1.0, 120]
  ];
  const clouds = [[$('cloud1'), 150, 78, 1, 0.02], [$('cloud2'), 430, 50, .8, 0.014], [$('cloud3'), 700, 150, .65, 0.03]];
  const birds = [[$('bird1'), 300, 120, 1, 0], [$('bird2'), 340, 100, .8, 1.3], [$('bird3'), 560, 70, .7, 2.6]];

  /* ---------- 链条：绕过链盘与飞轮的闭合外切线路径 ---------- */
  const chainPitch = (() => {
    const dx = BB[0] - RA[0], dy = BB[1] - RA[1], D = Math.hypot(dx, dy);
    const phi = Math.atan2(dy, dx), beta = Math.acos((COG_R - RING_R) / D);
    const up = phi - beta, lo = phi + beta;                  // 上、下外切线的法线角
    const P = (c, r, a) => [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
    const a1 = P(RA, COG_R, up), a2 = P(BB, RING_R, up), b1 = P(BB, RING_R, lo), b2 = P(RA, COG_R, lo);
    const f = p => r2(p[0]) + ' ' + r2(p[1]);
    const d = `M${f(a1)}L${f(a2)}A${RING_R} ${RING_R} 0 1 1 ${f(b1)}L${f(b2)}A${COG_R} ${COG_R} 0 0 1 ${f(a1)}Z`;
    setAll(chain, 'd', d);
    const arc = (r, a, b) => r * (((b - a) % TAU) + TAU) % TAU;
    const len = Math.hypot(a2[0] - a1[0], a2[1] - a1[1]) + Math.hypot(b2[0] - b1[0], b2[1] - b1[1])
              + arc(RING_R, up, lo) + arc(COG_R, lo, up + TAU);
    const pitch = len / Math.round(len / 5);
    set(chainL, 'stroke-dasharray', `1.7 ${r2(pitch - 1.7)}`);
    return pitch;
  })();

  /* ---------- 两段式腿部反向运动学（膝盖朝前） ---------- */
  function pose(phase, hipY) {
    const px = BB[0] + CRANK * Math.cos(phase), py = BB[1] + CRANK * Math.sin(phase);
    const ax = px + ANKLE[0], ay = py + ANKLE[1];
    const dx = ax - HIP[0], dy = ay - hipY;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.5);
    const a = Math.acos(Math.max(-1, Math.min(1, (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d))));
    const g = Math.atan2(dy, dx) - a;
    return { px, py, ax, ay, kx: HIP[0] + THIGH * Math.cos(g), ky: hipY + THIGH * Math.sin(g) };
  }

  /* ---------- 飘动的围巾：沿基线叠加行波的丝带 ---------- */
  function ribbon(x0, y0, len, w0, w1, phase, lift, droop, amp) {
    const N = 20, c = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, s = u * len;
      c.push([x0 - s, y0 - s * lift + droop * u * u + Math.sin(s * 0.1 - phase) * amp * (0.25 + u * 1.1)]);
    }
    const up = [], lo = [];
    for (let i = 0; i <= N; i++) {
      const a = c[Math.max(0, i - 1)], b = c[Math.min(N, i + 1)];
      const m = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const nx = -(b[1] - a[1]) / m, ny = (b[0] - a[0]) / m;
      const w = (w0 + (w1 - w0) * i / N) / 2;
      up.push([c[i][0] + nx * w, c[i][1] + ny * w]);
      lo.push([c[i][0] - nx * w, c[i][1] - ny * w]);
    }
    const tip = [c[N][0] + 7, c[N][1]];                       // 燕尾缺口
    const pts = up.concat([tip], lo.reverse());
    return 'M' + pts.map(p => r2(p[0]) + ' ' + r2(p[1])).join('L') + 'Z';
  }

  /* ---------- 状态与绘制 ---------- */
  let crank = 0, time = 0;

  function draw() {
    const c = crank, t = time;
    const roll = (c * GEAR * DEG) % 360;                      // 车轮转角
    const dist = c * GEAR * WHEEL_R;                          // 车轮滚过的路程 = 路面位移
    const bump = Math.sin(2 * c + 0.5);                       // 每圈两次的颠簸
    const wind = t * 7;

    set(wheelR, 'transform', `translate(${RA[0]} ${RA[1]}) rotate(${r2(roll)})`);
    set(wheelF, 'transform', `translate(510 338) rotate(${r2(roll)})`);
    set(cog, 'transform', `translate(${RA[0]} ${RA[1]}) rotate(${r2(roll)})`);
    set(ring, 'transform', `translate(${BB[0]} ${BB[1]}) rotate(${r2((c * DEG) % 360)})`);
    set(chainL, 'stroke-dashoffset', r2(-(c * RING_R) % chainPitch));

    // 身体上下起伏，腿随之联动
    const hipY = HIP[1] + bump * 1.2;
    setAll(bobs, 'transform', `translate(0 ${r2(bump * 1.2)})`);
    for (const L of legs) {
      const ph = c + L.phase, p = pose(ph, hipY);
      setAll(L.thigh, 'd', `M${HIP[0]} ${r2(hipY)}L${r2(p.kx)} ${r2(p.ky)}`);
      setAll(L.shin, 'd', `M${r2(p.kx)} ${r2(p.ky)}L${r2(p.ax)} ${r2(p.ay)}`);
      set(L.foot, 'transform', `translate(${r2(p.ax)} ${r2(p.ay)}) rotate(${r2(7 * Math.sin(ph))})`);
      set(L.pedal, 'transform', `translate(${r2(p.px)} ${r2(p.py)})`);
      setAll(L.crank, 'x2', r2(p.px));
      setAll(L.crank, 'y2', r2(p.py));
    }

    // 头颈轻点、尾羽与羽冠随风抖动
    set(neckHead, 'transform', `rotate(${r2(1.5 * Math.sin(2 * c - 0.9) + 0.8 * Math.sin(t * 1.7))} 396 192)`);
    set(tailF, 'transform', `translate(272 192) rotate(${r2(4 * Math.sin(wind * 0.8) + 2 * bump)})`);
    set(crest, 'transform', `translate(437 95) rotate(${r2(6 * Math.sin(wind * 1.1) - 4)})`);

    // 嘴囊随颠簸晃动
    const j1 = 3 * Math.sin(2 * c - 0.2), j2 = 5 * Math.sin(2 * c - 0.9);
    set(pouch, 'd', `M460 118C498 124 544 128 582 133C566 ${r2(158 + j1)} 512 ${r2(168 + j2)} 474 146C466 140 460 128 460 118Z`);
    set(vein, 'd', `M476 140C510 ${r2(156 + j2 * .7)} 548 ${r2(150 + j1 * .7)} 576 137`);

    // 眨眼
    const ph = t % 3.7;
    set(eye, 'transform', `translate(463 102) scale(1 ${r2(ph < 0.16 ? 1 - 0.92 * Math.sin(ph / 0.16 * Math.PI) : 1)})`);

    // 围巾
    set(scarfA, 'd', ribbon(388, 156, 118, 13, 10, wind, 0.28, -4, 6));
    set(scarfB, 'd', ribbon(388, 160, 74, 12, 9, wind + 1.9, 0.12, 20, 5));

    // 车筐里的鱼摆尾
    set(fishTail, 'transform', `rotate(${r2(14 * Math.sin(t * 8))} 8 0)`);

    // 后轮扬起的尘土：从接地点向后飘散并淡出
    dust.forEach((el, i) => {
      const life = (t * 1.1 + i / dust.length) % 1;
      set(el, 'cx', r2(262 - 95 * life));
      set(el, 'cy', r2(403 - 14 * life - 3 * Math.sin(i * 2.3)));
      set(el, 'r', r2(2.5 + 7.5 * life));
      set(el, 'fill-opacity', r2(0.55 * Math.pow(1 - life, 1.3)));
    });

    // 背景：视差滚动、云、鸟、太阳
    for (const [g, k, period] of layers) set(g, 'transform', `translate(${-r2((dist * k) % period)} 0)`);
    for (const [el, x0, y, s, k] of clouds) {
      const x = ((x0 - dist * k) % 1000 + 1000) % 1000 - 100;
      set(el, 'transform', `translate(${r2(x)} ${y}) scale(${s})`);
    }
    for (const [el, x0, y0, s, p] of birds) {
      const x = ((x0 + t * 16) % 960 + 960) % 960 - 80, f = Math.sin(t * 7 + p);
      set(el, 'd', `M-8 ${r2(2 - 2 * f)}Q-4 ${r2(-6 * f)} 0 0Q4 ${r2(-6 * f)} 8 ${r2(2 - 2 * f)}`);
      set(el, 'transform', `translate(${r2(x)} ${r2(y0 + 5 * Math.sin(t * 0.9 + p))}) scale(${s})`);
    }
    set(sunRays, 'transform', `rotate(${r2((t * 4) % 360)})`);
  }

  function step(dt) {
    time += dt;
    crank += TAU * CADENCE * (1 + 0.1 * Math.sin(time * 0.55)) * dt;
    draw();
  }

  /* ---------- 播放控制 ---------- */
  const hint = $('hint');
  let raf = 0, last = 0;
  function frame(now) {
    step(Math.min(0.05, Math.max(0, (now - last) / 1000)));
    last = now;
    raf = requestAnimationFrame(frame);
  }
  function play()  { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function pause() { cancelAnimationFrame(raf); raf = 0; }
  function toggle() {
    raf ? pause() : play();
    hint.textContent = raf ? '点击画面或按空格键：暂停 / 继续' : '已暂停 — 点击画面或按空格键继续';
  }
  $('stage').addEventListener('click', toggle);
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });

  draw();
  play();
})();
</script>
