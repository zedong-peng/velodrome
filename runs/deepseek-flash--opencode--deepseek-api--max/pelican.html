<title>骑自行车的鹈鹕</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #FBE8CD 0%, #F4CE9B 58%, #E8B47F 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scene {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .road-dash {
    stroke-dasharray: 42 98;
    animation: road-dash-move 0.76s linear infinite;
  }
  .pebbles {
    stroke-dasharray: 4 86;
    animation: pebble-move 1.34s linear infinite;
  }
  .chain {
    stroke-dasharray: 8 6;
    animation: chain-move 0.44s linear infinite;
  }
  .cloud {
    animation: cloud-float 9s ease-in-out infinite;
  }
  .c2 {
    animation-duration: 12.5s;
    animation-delay: -4s;
  }
  .c3 {
    animation-duration: 10.5s;
    animation-delay: -2s;
  }
  .wind {
    opacity: 0;
    animation: wind-sweep 2.4s linear infinite;
  }
  .w2 { animation-delay: 0.8s; }
  .w3 { animation-delay: 1.5s; }
  .puff {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: puff-rise 1.9s ease-out infinite;
  }
  .p2 { animation-delay: 0.45s; animation-duration: 2.1s; }
  .p3 { animation-delay: 0.9s; animation-duration: 1.75s; }
  .p4 { animation-delay: 1.25s; animation-duration: 2.3s; }
  @keyframes road-dash-move {
    to { stroke-dashoffset: 140; }
  }
  @keyframes pebble-move {
    to { stroke-dashoffset: 90; }
  }
  @keyframes chain-move {
    to { stroke-dashoffset: -28; }
  }
  @keyframes cloud-float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-18px, 7px); }
  }
  @keyframes wind-sweep {
    0% { opacity: 0; transform: translateX(55px); }
    22% { opacity: 0.58; }
    70% { opacity: 0.22; }
    100% { opacity: 0; transform: translateX(-120px); }
  }
  @keyframes puff-rise {
    0% { opacity: 0.36; transform: translate(0, 0) scale(0.4); }
    28% { opacity: 0.3; }
    100% { opacity: 0; transform: translate(-112px, -28px) scale(1.8); }
  }
  @media (prefers-reduced-motion: reduce) {
    .road-dash, .pebbles, .chain, .cloud, .wind, .puff {
      animation: none !important;
    }
    .road-dash, .pebbles, .chain { stroke-dashoffset: 0; }
    .wind, .puff { opacity: 0; }
  }
</style>
</head>

<script>
(() => {
  const svg = document.getElementById('scene');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cx = 615;
  const cy = 578;
  const radius = 46;
  const nearHip = { x: 604, y: 430 };
  const farHip = { x: 587, y: 424 };
  const upperLeg = 92;
  const lowerLeg = 104;
  const crank = document.getElementById('crank-rotator');
  const nearLegMain = document.querySelector('.near-leg-main');
  const nearLegOutline = document.querySelector('.near-leg-outline');
  const farLegMain = document.querySelector('.far-leg-main');
  const farLegOutline = document.querySelector('.far-leg-outline');
  const nearFoot = document.querySelector('.near-foot');
  const farFoot = document.querySelector('.far-foot');

  const solveKnee = (hip, foot) => {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const distance = Math.max(Math.abs(upperLeg - lowerLeg) + 1, Math.min(upperLeg + lowerLeg - 1, Math.hypot(dx, dy)));
    const baseAngle = Math.atan2(dy, dx);
    const cosine = (upperLeg * upperLeg + distance * distance - lowerLeg * lowerLeg) / (2 * upperLeg * distance);
    const bend = Math.acos(Math.max(-1, Math.min(1, cosine)));
    const kneeAngle = baseAngle - bend;
    return {
      x: hip.x + Math.cos(kneeAngle) * upperLeg,
      y: hip.y + Math.sin(kneeAngle) * upperLeg
    };
  };

  const setLegPath = (element, hip, knee, foot) => {
    if (!element) return;
    element.setAttribute('d', `M ${hip.x} ${hip.y} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`);
  };

  const draw = (time) => {
    const angle = (time / 1150) * Math.PI * 2;
    const degrees = angle * 180 / Math.PI;
    if (crank) crank.setAttribute('transform', `rotate(${degrees.toFixed(2)} ${cx} ${cy})`);

    const nearPedal = {
      x: cx - Math.sin(angle) * radius,
      y: cy + Math.cos(angle) * radius
    };
    const farPedal = {
      x: cx + Math.sin(angle) * radius,
      y: cy - Math.cos(angle) * radius
    };
    const nearAnkle = { x: nearPedal.x + 2, y: nearPedal.y - 8 };
    const farAnkle = { x: farPedal.x + 2, y: farPedal.y - 8 };
    const nearKnee = solveKnee(nearHip, nearAnkle);
    const farKnee = solveKnee(farHip, farAnkle);

    setLegPath(nearLegMain, nearHip, nearKnee, nearAnkle);
    setLegPath(nearLegOutline, nearHip, nearKnee, nearAnkle);
    setLegPath(farLegMain, farHip, farKnee, farAnkle);
    setLegPath(farLegOutline, farHip, farKnee, farAnkle);

    if (nearFoot) {
      nearFoot.setAttribute('transform', `translate(${nearAnkle.x.toFixed(2)} ${nearAnkle.y.toFixed(2)}) rotate(${(Math.sin(angle) * 5).toFixed(2)})`);
    }
    if (farFoot) {
      farFoot.setAttribute('transform', `translate(${farAnkle.x.toFixed(2)} ${farAnkle.y.toFixed(2)}) rotate(${(-Math.sin(angle) * 5).toFixed(2)})`);
    }
  };

  draw(0);

  if (reduced) {
    if (svg && typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    return;
  }

  const start = performance.now();
  const tick = (now) => {
    draw(now - start);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
