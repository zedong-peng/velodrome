<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bicycle</title>
  <style>
    :root {
      color-scheme: light;
      background: #a8d8e8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #a8d8e8;
    }

    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      min-height: 420px;
    }

    .cloud {
      animation: drift 24s linear infinite;
    }

    .cloud.slow {
      animation-duration: 34s;
      animation-delay: -10s;
    }

    .water-line {
      animation: ripple 3.5s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .rider {
      animation: rider-bob 0.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .wing {
      animation: wing-flap 1.1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 38% 70%;
    }

    .leg-front {
      animation: pedal-front 0.8s linear infinite;
      transform-box: fill-box;
      transform-origin: 18% 10%;
    }

    .leg-back {
      animation: pedal-back 0.8s linear infinite;
      transform-box: fill-box;
      transform-origin: 18% 10%;
    }

    .wheel-spin {
      animation: wheel-spin 1.2s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .pedal-spin {
      animation: pedal-spin 0.8s linear infinite;
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }

    .dust {
      animation: dust-puff 1.8s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .dust.delay-1 { animation-delay: -0.6s; }
    .dust.delay-2 { animation-delay: -1.2s; }

    @keyframes drift {
      from { transform: translateX(-90px); }
      to { transform: translateX(1180px); }
    }

    @keyframes ripple {
      from { transform: scaleX(0.92); opacity: 0.5; }
      to { transform: scaleX(1.08); opacity: 0.9; }
    }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(2deg); }
      50% { transform: rotate(-11deg); }
    }

    @keyframes pedal-front {
      0%, 100% { transform: rotate(28deg); }
      50% { transform: rotate(-34deg); }
    }

    @keyframes pedal-back {
      0%, 100% { transform: rotate(-34deg); }
      50% { transform: rotate(28deg); }
    }

    @keyframes wheel-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pedal-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes dust-puff {
      0% { opacity: 0; transform: translate(0, 0) scale(0.55); }
      22% { opacity: 0.65; }
      100% { opacity: 0; transform: translate(-28px, -18px) scale(1.25); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
