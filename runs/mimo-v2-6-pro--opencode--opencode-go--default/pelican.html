<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(1100px 620px at 50% 15%, #1e293b 0%, #0b1220 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #cbd5e1; padding: 20px;
  }
  h1 { margin: 0 0 16px; font-size: 17px; font-weight: 600; letter-spacing: 4px; opacity: .8; }
  .stage {
    width: min(96vw, 1000px);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  svg { display: block; width: 100%; height: auto; }

  .wheel, .crank, .sun-rays {
    transform-box: fill-box; transform-origin: 50% 50%;
    animation: spin linear infinite;
  }
  .wheel { animation-duration: 1s; }
  .crank { animation-duration: 1.5s; }
  .sun-rays { animation-duration: 80s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .thigh, .shin, .foot { transform-box: fill-box; transform-origin: 0% 50%; }
  .thigh { animation: thigh 1.5s linear infinite; }
  .shin  { animation: shin  1.5s linear infinite; }
  .foot  { animation: foot  1.5s linear infinite; }
  .leg2 .thigh, .leg2 .shin, .leg2 .foot { animation-delay: -.75s; }

  @keyframes thigh {
    0%   { transform: rotate(34.9deg); }
    25%  { transform: rotate(76.8deg); }
    50%  { transform: rotate(63.3deg); }
    75%  { transform: rotate(28.1deg); }
    100% { transform: rotate(34.9deg); }
  }
  @keyframes shin {
    0%   { transform: translate(57.5px, 40px) rotate(104.4deg); }
    25%  { transform: translate(16px, 68.2px) rotate(93.7deg); }
    50%  { transform: translate(31.3px, 62.5px) rotate(142.7deg); }
    75%  { transform: translate(61.7px, 33px) rotate(143.3deg); }
    100% { transform: translate(57.5px, 40px) rotate(104.4deg); }
  }
  @keyframes foot {
    0%   { transform: rotate(-104.4deg); }
    25%  { transform: rotate(-93.7deg); }
    50%  { transform: rotate(-142.7deg); }
    75%  { transform: rotate(-143.3deg); }
    100% { transform: rotate(-104.4deg); }
  }

  .rider { animation: bob .75s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5px); }
  }
  .wing {
    transform-box: fill-box; transform-origin: 100% 0%;
    animation: flap 1.1s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(8deg); }
  }
  .pouch {
    transform-box: fill-box; transform-origin: 50% 0%;
    animation: wobble 2.4s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.08); }
  }

  .cloud1 { animation: drift 26s linear infinite; }
  .cloud2 { animation: drift 34s linear infinite; animation-delay: -12s; }
  .cloud3 { animation: drift 20s linear infinite; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translateX(980px); }
    to   { transform: translateX(-280px); }
  }
  .trees { animation: trees 5.5s linear infinite; }
  @keyframes trees {
    from { transform: translateX(0); }
    to   { transform: translateX(-220px); }
  }
  .dashes { animation: dashes 1.1s linear infinite; }
  @keyframes dashes {
    from { transform: translateX(0); }
    to   { transform: translateX(-300px); }
  }
  .streak  { animation: streak .9s linear infinite; }
  .streak2 { animation: streak .9s linear infinite; animation-delay: -.3s; }
  .streak3 { animation: streak .9s linear infinite; animation-delay: -.6s; }
  @keyframes streak {
    0%   { transform: translateX(50px); opacity: 0; }
    20%  { opacity: .65; }
    100% { transform: translateX(-90px); opacity: 0; }
  }
</style>
</head>
