<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 70%, #A5D6A7 70%, #66BB6A 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  svg {
    width: 800px;
    height: 500px;
  }
  .wheel {
    transform-origin: center;
    animation: spin 1s linear infinite;
  }
  .wheel2 {
    transform-origin: center;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }
  .pelican {
    animation: bob 0.5s ease-in-out infinite alternate;
    transform-origin: center;
  }
  @keyframes bob {
    from { transform: translateY(0); }
    to { transform: translateY(-5px); }
  }
  .leg {
    animation: pedal 0.5s ease-in-out infinite alternate;
    transform-origin: center;
  }
  .leg2 {
    animation: pedal2 0.5s ease-in-out infinite alternate;
    transform-origin: center;
  }
  @keyframes pedal {
    from { transform: rotate(-20deg); }
    to { transform: rotate(20deg); }
  }
  @keyframes pedal2 {
    from { transform: rotate(20deg); }
    to { transform: rotate(-20deg); }
  }
  .cloud {
    animation: drift 8s linear infinite;
  }
  .cloud2 {
    animation: drift2 12s linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(-50px); }
    to { transform: translateX(850px); }
  }
  @keyframes drift2 {
    from { transform: translateX(850px); }
    to { transform: translateX(-50px); }
  }
  .bike-whole {
    animation: movebike 3s ease-in-out infinite alternate;
  }
  @keyframes movebike {
    from { transform: translateX(-180px); }
    to { transform: translateX(180px); }
  }
  .bag-flap {
    animation: flap 0.5s ease-in-out infinite alternate;
    transform-origin: 365px 215px;
  }
  @keyframes flap {
    from { transform: rotate(-5deg); }
    to { transform: rotate(5deg); }
  }
  .tail {
    animation: wag 0.4s ease-in-out infinite alternate;
    transform-origin: 480px 260px;
  }
  @keyframes wag {
    from { transform: rotate(-10deg); }
    to { transform: rotate(10deg); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 云朵 -->
  <g class="cloud">
    <ellipse cx="100" cy="60" rx="50" ry="25" fill="white" opacity="0.8"/>
    <ellipse cx="130" cy="50" rx="40" ry="22" fill="white" opacity="0.8"/>
    <ellipse cx="70" cy="55" rx="35" ry="20" fill="white" opacity="0.8"/>
  </g>
  <g class="cloud2">
    <ellipse cx="600" cy="80" rx="45" ry="20" fill="white" opacity="0.7"/>
    <ellipse cx="630" cy="70" rx="35" ry="18" fill="white" opacity="0.7"/>
  </g>

  <!-- 太阳 -->
  <circle cx="680" cy="70" r="45" fill="#FFD54F"/>
  <g stroke="#FFD54F" stroke-width="3">
    <line x1="680" y1="10" x2="680" y2="0"/>
    <line x1="680" y1="130" x2="680" y2="140"/>
    <line x1="620" y1="70" x2="610" y2="70"/>
    <line x1="740" y1="70" x2="750" y2="70"/>
    <line x1="638" y1="28" x2="631" y2="21"/>
    <line x1="722" y1="112" x2="729" y2="119"/>
    <line x1="722" y1="28" x2="729" y2="21"/>
    <line x1="638" y1="112" x2="631" y2="119"/>
  </g>

  <!-- 自行车整体 -->
  <g class="bike-whole">
    <!-- 后轮 -->
    <g>
      <circle class="wheel" cx="280" cy="360" r="45" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="280" cy="360" r="3" fill="#333"/>
      <g stroke="#666" stroke-width="1.5">
        <line x1="280" y1="315" x2="280" y2="405"/>
        <line x1="235" y1="360" x2="325" y2="360"/>
        <line x1="248" y1="328" x2="312" y2="392"/>
        <line x1="248" y1="392" x2="312" y2="328"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g>
      <circle class="wheel2" cx="430" cy="360" r="45" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="430" cy="360" r="3" fill="#333"/>
      <g stroke="#666" stroke-width="1.5">
        <line x1="430" y1="315" x2="430" y2="405"/>
        <line x1="385" y1="360" x2="475" y2="360"/>
        <line x1="398" y1="328" x2="462" y2="392"/>
        <line x1="398" y1="392" x2="462" y2="328"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#D32F2F" stroke-width="4" fill="none">
      <!-- 下叉 -->
      <line x1="280" y1="360" x2="355" y2="360"/>
      <!-- 座管 -->
      <line x1="300" y1="360" x2="310" y2="290"/>
      <!-- 上管 -->
      <line x1="310" y1="290" x2="400" y2="310"/>
      <!-- 立管/把立 -->
      <line x1="400" y1="310" x2="430" y2="360"/>
      <!-- 后上叉 -->
      <line x1="280" y1="360" x2="310" y2="290"/>
      <!-- 后下叉 -->
      <line x1="280" y1="360" x2="300" y2="360"/>
      <!-- 前叉 -->
      <line x1="410" y1="310" x2="430" y2="360"/>
    </g>

    <!-- 脚踏板曲柄中心 -->
    <circle cx="355" cy="360" r="5" fill="#555"/>

    <!-- 踏板1 -->
    <g class="leg">
      <line x1="355" y1="360" x2="335" y2="390" stroke="#555" stroke-width="3"/>
      <rect x="325" y="386" width="20" height="6" rx="2" fill="#555"/>
    </g>
    <!-- 踏板2 -->
    <g class="leg2">
      <line x1="355" y1="360" x2="375" y2="330" stroke="#555" stroke-width="3"/>
      <rect x="365" y="326" width="20" height="6" rx="2" fill="#555"/>
    </g>

    <!-- 车座 -->
    <ellipse cx="310" cy="285" rx="20" ry="8" fill="#444"/>

    <!-- 车把 -->
    <g stroke="#555" stroke-width="3" fill="none">
      <line x1="400" y1="310" x2="415" y2="290"/>
      <line x1="408" y1="285" x2="422" y2="285"/>
    </g>

    <!-- 鹈鹕 -->
    <g class="pelican">
      <!-- 身体 -->
      <ellipse cx="370" cy="255" rx="45" ry="35" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>
      <!-- 翅膀 -->
      <path d="M 340 250 Q 330 230 345 210 Q 360 225 355 245" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
      <!-- 脖子 -->
      <path d="M 395 230 Q 410 200 405 170" stroke="#FAFAFA" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M 395 230 Q 410 200 405 170" stroke="#DDD" stroke-width="1" fill="none"/>
      <!-- 头 -->
      <circle cx="405" cy="165" r="16" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>
      <!-- 喙 -->
      <path d="M 420 160 L 470 158 Q 475 160 470 165 L 422 168 Z" fill="#FFB74D" stroke="#F57C00" stroke-width="1"/>
      <!-- 喉囊 -->
      <path class="bag-flap" d="M 422 168 Q 440 185 430 195 Q 420 190 415 175" fill="#FFCC80" stroke="#FFA726" stroke-width="1"/>
      <!-- 眼睛 -->
      <circle cx="410" cy="158" r="4" fill="#333"/>
      <circle cx="412" cy="157" r="1.5" fill="white"/>
      <!-- 腿（骑车的腿） -->
      <g>
        <line x1="385" y1="285" x2="355" y2="360" stroke="#FFB74D" stroke-width="4" stroke-linecap="round"/>
        <line x1="355" y1="285" x2="355" y2="360" stroke="#FFB74D" stroke-width="4" stroke-linecap="round"/>
        <!-- 脚 -->
        <ellipse cx="355" cy="363" rx="5" ry="3" fill="#FFB74D"/>
      </g>
      <!-- 尾羽 -->
      <g class="tail">
        <path d="M 325 270 Q 305 280 310 295" stroke="#E0E0E0" stroke-width="2" fill="none"/>
        <path d="M 328 275 Q 308 290 315 300" stroke="#E0E0E0" stroke-width="2" fill="none"/>
        <path d="M 330 280 Q 315 295 320 305" stroke="#E0E0E0" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- 地面线 -->
    <line x1="0" y1="405" x2="800" y2="405" stroke="#8BC34A" stroke-width="3"/>
  </g>

  <!-- 前景草 -->
  <g fill="#4CAF50" opacity="0.6">
    <path d="M 50 410 Q 55 390 60 410"/>
    <path d="M 120 415 Q 125 395 130 415"/>
    <path d="M 500 412 Q 505 392 510 412"/>
    <path d="M 650 415 Q 655 395 660 415"/>
    <path d="M 750 410 Q 755 390 760 410"/>
  </g>
</svg>
</body>
</html>
