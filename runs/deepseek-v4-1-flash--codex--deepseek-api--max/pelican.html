<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #0e1626;
    font: 16px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { margin: 0; width: min(96vw, 1080px); }
  svg { width: 100%; height: auto; display: block; border-radius: 20px;
        box-shadow: 0 26px 70px rgba(0, 0, 0, .55); }
  .cap { margin-top: 14px; text-align: center; color: #7f95b8;
         font-size: 13px; letter-spacing: .22em; text-transform: uppercase; }
</style>
</head>
<body>
<figure class="stage">
<svg viewBox="0 0 900 520" role="img" aria-labelledby="ttl desc">
  <title id="ttl">鹈鹕骑自行车</title>
  <desc id="desc">一只戴着围巾的鹈鹕骑着红色自行车向前飞驰的二维矢量动画</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dcff"/>
      <stop offset=".55" stop-color="#e2f4ff"/>
      <stop offset="1" stop-color="#fdf7e8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe9a4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe9a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e7687"/>
      <stop offset="1" stop-color="#434958"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f1"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcb6b"/>
      <stop offset="1" stop-color="#ef9a30"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="cloud">
      <ellipse cx="40" cy="34" rx="30" ry="22"/>
      <ellipse cx="84" cy="24" rx="38" ry="26"/>
      <ellipse cx="128" cy="36" rx="30" ry="20"/>
      <rect x="10" y="34" width="146" height="22" rx="11"/>
    </g>
  </defs>

  <!-- 天空 / 太阳 / 云 -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="756" cy="104" r="130" fill="url(#glow)"/>
  <circle cx="756" cy="104" r="42" fill="#ffd977"/>
  <g fill="#ffffff" opacity=".95">
    <g opacity=".85">
      <animateTransform attributeName="transform" type="translate" values="1160 0; -320 0"
                        dur="52s" begin="-8s" repeatCount="indefinite"/>
      <use href="#cloud" transform="translate(120 58) scale(.9)"/>
    </g>
    <g opacity=".7">
      <animateTransform attributeName="transform" type="translate" values="1160 0; -320 0"
                        dur="34s" begin="-20s" repeatCount="indefinite"/>
      <use href="#cloud" transform="translate(430 132) scale(.6)"/>
    </g>
    <g opacity=".55">
      <animateTransform attributeName="transform" type="translate" values="1160 0; -320 0"
                        dur="24s" begin="-4s" repeatCount="indefinite"/>
      <use href="#cloud" transform="translate(640 40) scale(.42)"/>
    </g>
  </g>

  <!-- 远山 / 树丛 / 路面 -->
  <ellipse cx="170" cy="474" rx="270" ry="94" fill="#b4e5bd"/>
  <ellipse cx="650" cy="486" rx="330" ry="104" fill="#9cdcaa"/>
  <g fill="#7fc98f">
    <circle cx="86" cy="406" r="18"/><circle cx="108" cy="412" r="13"/>
    <circle cx="812" cy="408" r="16"/><circle cx="834" cy="414" r="11"/>
  </g>
  <rect x="0" y="422" width="900" height="98" fill="url(#road)"/>
  <rect x="0" y="422" width="900" height="4" fill="#8f97a8"/>
  <line x1="-90" y1="462" x2="990" y2="462" stroke="#f6e9bd" stroke-width="6"
        stroke-dasharray="76 84" stroke-linecap="round" opacity=".85">
    <animate attributeName="stroke-dashoffset" values="0;160" dur=".9s" repeatCount="indefinite"/>
  </line>
  <line x1="-90" y1="498" x2="990" y2="498" stroke="#f6e9bd" stroke-width="9"
        stroke-dasharray="120 130" stroke-linecap="round" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="0;250" dur=".62s" repeatCount="indefinite"/>
  </line>

  <!-- 车影 / 尘土 -->
  <ellipse cx="472" cy="425" rx="172" ry="11" fill="#161d2a" opacity=".25" filter="url(#blur)"/>
  <g fill="#ffffff">
    <circle cx="346" cy="412" r="5" opacity="0">
      <animate attributeName="r" values="4;18" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="346;302" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="346" cy="412" r="4" opacity="0">
      <animate attributeName="r" values="3;14" dur="1.2s" begin="-.45s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="340;306" dur="1.2s" begin="-.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;0" dur="1.2s" begin="-.45s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".9">
    <line x1="286" y1="196" x2="352" y2="196" opacity="0">
      <animate attributeName="x1" values="326;150" dur=".7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="392;216" dur=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur=".7s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="330" x2="326" y2="330" opacity="0">
      <animate attributeName="x1" values="300;120" dur=".55s" begin="-.22s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="376;196" dur=".55s" begin="-.22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur=".55s" begin="-.22s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="256" x2="352" y2="256" opacity="0">
      <animate attributeName="x1" values="336;176" dur=".8s" begin="-.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="388;228" dur=".8s" begin="-.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.6;0" dur=".8s" begin="-.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 骑车整体（轻微上下颤动） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0"
                      keyTimes="0;.5;1" calcMode="spline"
                      keySplines=".4 0 .6 1;.4 0 .6 1" dur="1s" repeatCount="indefinite"/>

    <!-- 远侧：曲柄、脚踏、腿 -->
    <g stroke-linecap="round">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 452 366; 360 452 366"
                          dur="1s" repeatCount="indefinite"/>
        <line x1="452" y1="366" x2="452" y2="392" stroke="#4c525c" stroke-width="7"/>
        <rect x="441" y="389" width="22" height="7" rx="3" fill="#3b414b"/>
      </g>
      <line x1="424" y1="278" x2="453.9" y2="330" stroke="#c9762a" stroke-width="14">
        <animate attributeName="x2" dur="1s" repeatCount="indefinite"
                 values="453.9;455.8;460.7;467.2;474.5;480.7;483.4;483.7;482.5;478.1;469.4;458.9;453.9"/>
        <animate attributeName="y2" dur="1s" repeatCount="indefinite"
                 values="330;328.8;325.4;319.7;310.4;297.6;286.5;284.4;291.5;304;317.2;326.8;330"/>
      </line>
      <line x1="453.9" y1="330" x2="452" y2="392" stroke="#c9762a" stroke-width="11">
        <animate attributeName="x1" dur="1s" repeatCount="indefinite"
                 values="453.9;455.8;460.7;467.2;474.5;480.7;483.4;483.7;482.5;478.1;469.4;458.9;453.9"/>
        <animate attributeName="y1" dur="1s" repeatCount="indefinite"
                 values="330;328.8;325.4;319.7;310.4;297.6;286.5;284.4;291.5;304;317.2;326.8;330"/>
        <animate attributeName="x2" dur="1s" repeatCount="indefinite"
                 values="452;439;429.5;426;429.5;439;452;465;474.5;478;474.5;465;452"/>
        <animate attributeName="y2" dur="1s" repeatCount="indefinite"
                 values="392;388.5;379;366;353;343.5;340;343.5;353;366;379;388.5;392"/>
      </line>
      <ellipse cx="452" cy="392" rx="15" ry="6" fill="#c9762a" transform="translate(7 0)">
        <animate attributeName="cx" dur="1s" repeatCount="indefinite"
                 values="452;439;429.5;426;429.5;439;452;465;474.5;478;474.5;465;452"/>
        <animate attributeName="cy" dur="1s" repeatCount="indefinite"
                 values="392;388.5;379;366;353;343.5;340;343.5;353;366;379;388.5;392"/>
      </ellipse>
    </g>

    <!-- 车轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 368 360; 360 368 360"
                        dur=".5s" repeatCount="indefinite"/>
      <circle cx="368" cy="360" r="56" fill="none" stroke="#282d36" stroke-width="12"/>
      <circle cx="368" cy="360" r="46" fill="none" stroke="#cbd4e0" stroke-width="4"/>
      <g stroke="#9daabb" stroke-width="2.2" opacity=".9">
        <line x1="322" y1="360" x2="414" y2="360"/>
        <line x1="328.2" y1="337" x2="407.8" y2="383"/>
        <line x1="345" y1="320.2" x2="391" y2="399.8"/>
        <line x1="368" y1="314" x2="368" y2="406"/>
        <line x1="391" y1="320.2" x2="345" y2="399.8"/>
        <line x1="407.8" y1="337" x2="328.2" y2="383"/>
      </g>
      <circle cx="368" cy="360" r="7" fill="#3b414b"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 566 360; 360 566 360"
                        dur=".5s" repeatCount="indefinite"/>
      <circle cx="566" cy="360" r="56" fill="none" stroke="#282d36" stroke-width="12"/>
      <circle cx="566" cy="360" r="46" fill="none" stroke="#cbd4e0" stroke-width="4"/>
      <g stroke="#9daabb" stroke-width="2.2" opacity=".9">
        <line x1="520" y1="360" x2="612" y2="360"/>
        <line x1="526.2" y1="337" x2="605.8" y2="383"/>
        <line x1="543" y1="320.2" x2="589" y2="399.8"/>
        <line x1="566" y1="314" x2="566" y2="406"/>
        <line x1="589" y1="320.2" x2="543" y2="399.8"/>
        <line x1="605.8" y1="337" x2="526.2" y2="383"/>
      </g>
      <circle cx="566" cy="360" r="7" fill="#3b414b"/>
    </g>

    <!-- 近侧：车链、车架、车座、车把、曲柄、腿 -->
    <g stroke-linecap="round">
      <path d="M441 357 L375 354 M441 375 L375 366" fill="none" stroke="#aab4c2" stroke-width="2.5"/>
      <circle cx="452" cy="366" r="11" fill="none" stroke="#4c525c" stroke-width="3"/>
      <g fill="none" stroke="#e8543f" stroke-width="8">
        <path d="M368 360 L452 366"/>
        <path d="M368 360 L426 292"/>
        <path d="M452 366 L426 292"/>
        <path d="M424 292 L547 290"/>
        <path d="M452 366 L547 290"/>
        <path d="M548 292 C556 316 562 340 566 360"/>
      </g>
      <path d="M404 282 C404 275 424 273 446 276 C455 277 454 290 443 291 C420 294 404 290 404 282 Z" fill="#2b3039"/>
      <path d="M548 292 C549 274 541 266 526 266" fill="none" stroke="#2b3039" stroke-width="8"/>
      <line x1="528" y1="266" x2="512" y2="268" stroke="#3b414b" stroke-width="12"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 452 366; 360 452 366"
                          dur="1s" repeatCount="indefinite"/>
        <line x1="452" y1="366" x2="452" y2="340" stroke="#2b3039" stroke-width="8"/>
        <rect x="441" y="334" width="22" height="7" rx="3" fill="#3b414b"/>
      </g>

      <line x1="424" y1="278" x2="483.4" y2="286.5" stroke="#f0a04a" stroke-width="15">
        <animate attributeName="x2" dur="1s" repeatCount="indefinite"
                 values="483.4;483.7;482.5;478.1;469.4;458.9;453.9;455.8;460.7;467.2;474.5;480.7;483.4"/>
        <animate attributeName="y2" dur="1s" repeatCount="indefinite"
                 values="286.5;284.4;291.5;304;317.2;326.8;330;328.8;325.4;319.7;310.4;297.6;286.5"/>
      </line>
      <line x1="483.4" y1="286.5" x2="452" y2="340" stroke="#f0a04a" stroke-width="12">
        <animate attributeName="x1" dur="1s" repeatCount="indefinite"
                 values="483.4;483.7;482.5;478.1;469.4;458.9;453.9;455.8;460.7;467.2;474.5;480.7;483.4"/>
        <animate attributeName="y1" dur="1s" repeatCount="indefinite"
                 values="286.5;284.4;291.5;304;317.2;326.8;330;328.8;325.4;319.7;310.4;297.6;286.5"/>
        <animate attributeName="x2" dur="1s" repeatCount="indefinite"
                 values="452;465;474.5;478;474.5;465;452;439;429.5;426;429.5;439;452"/>
        <animate attributeName="y2" dur="1s" repeatCount="indefinite"
                 values="340;343.5;353;366;379;388.5;392;388.5;379;366;353;343.5;340"/>
      </line>
      <ellipse cx="452" cy="340" rx="15" ry="6" fill="#f0a04a" transform="translate(7 0)">
        <animate attributeName="cx" dur="1s" repeatCount="indefinite"
                 values="452;465;474.5;478;474.5;465;452;439;429.5;426;429.5;439;452"/>
        <animate attributeName="cy" dur="1s" repeatCount="indefinite"
                 values="340;343.5;353;366;379;388.5;392;388.5;379;366;353;343.5;340"/>
      </ellipse>
    </g>

    <!-- 鹈鹕 -->
    <g>
      <path d="M336 246 C312 226 288 226 276 240 C296 246 316 260 332 276 Z" fill="url(#plume)" stroke="#d9e3ee" stroke-width="2"/>
      <ellipse cx="398" cy="251" rx="73" ry="52" transform="rotate(-14 398 251)" fill="url(#plume)" stroke="#d9e3ee" stroke-width="2"/>
      <path d="M392 238 C372 232 350 238 342 250 C360 252 380 256 394 262 Z" fill="#dfe8f2"/>

      <!-- 围巾 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-7 456 210; 7 456 210; -7 456 210"
                          keyTimes="0;.5;1" calcMode="spline"
                          keySplines=".4 0 .6 1;.4 0 .6 1" dur=".8s" repeatCount="indefinite"/>
        <path d="M452 194 C412 174 372 166 334 172 C360 180 388 192 410 204 C422 212 444 208 452 202 Z" fill="#2ec4b6"/>
        <path d="M436 192 C402 178 372 172 344 175 C368 181 390 191 408 202" fill="none" stroke="#22a191" stroke-width="3" opacity=".7"/>
      </g>

      <path d="M432 226 C446 202 466 184 492 176" fill="none" stroke="url(#plume)" stroke-width="34" stroke-linecap="round"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1.6 448 232; 1.6 448 232; -1.6 448 232"
                          keyTimes="0;.5;1" calcMode="spline"
                          keySplines=".4 0 .6 1;.4 0 .6 1" dur="1s" repeatCount="indefinite"/>
        <!-- 喙 -->
        <path d="M522 162 C566 151 616 161 657 175 C648 190 624 201 593 203 C557 205 530 190 522 162 Z" fill="url(#bill)"/>
        <path d="M534 170 C560 182 600 184 636 178" fill="none" stroke="#ffd88a" stroke-width="3.5" opacity=".5"/>
        <path d="M517 152 C566 144 616 154 656 172 C658 175 656 179 652 179" fill="none" stroke="#f2a63c" stroke-width="13" stroke-linecap="round"/>
        <circle cx="545" cy="161" r="2.6" fill="#c9762a" opacity=".8"/>
        <!-- 头 -->
        <circle cx="500" cy="168" r="28" fill="url(#plume)" stroke="#d9e3ee" stroke-width="2"/>
        <path d="M494 144 C490 135 480 131 471 133 C479 137 486 141 490 148 Z" fill="#e6edf5"/>
        <!-- 围巾(领口) -->
        <ellipse cx="456" cy="208" rx="11.5" ry="19" transform="rotate(-40 456 208)" fill="#2ec4b6"/>
        <ellipse cx="456" cy="208" rx="11.5" ry="19" transform="rotate(-40 456 208)" fill="none" stroke="#22a191" stroke-width="2.5"/>
        <!-- 眼睛 -->
        <ellipse cx="504" cy="158" rx="5.4" ry="5" fill="#243040">
          <animate attributeName="ry" values="5;5;.6;5;5" keyTimes="0;.88;.93;.97;1" dur="4.4s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="506" cy="156" r="1.8" fill="#ffffff">
          <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.88;.93;.97" dur="4.4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- 近侧翅膀扶车把 -->
      <path d="M414 222 C452 224 492 238 526 260 C535 266 530 277 519 274 C484 269 446 262 424 250 C410 242 408 230 414 222 Z"
            fill="#eef3f9" stroke="#d9e2ec" stroke-width="2"/>
      <g fill="none" stroke="#ccd8e5" stroke-width="2" stroke-linecap="round">
        <path d="M448 240 C462 246 474 252 484 260"/>
        <path d="M462 248 C472 253 480 258 490 265"/>
      </g>
    </g>
  </g>
</svg>
<figcaption class="cap">Pelican on a Bicycle</figcaption>
</figure>
</body>
</html>
