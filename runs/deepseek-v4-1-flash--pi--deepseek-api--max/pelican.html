<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; padding:24px;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 640px at 50% 0%, #e6f4ff 0%, #c3dcf3 45%, #8fb3d6 100%);
    font-family:ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .stage{
    width:min(1080px,100%);
    border-radius:26px; overflow:hidden; background:#cfe9ff;
    box-shadow:0 34px 70px -24px rgba(16,44,80,.55), 0 0 0 1px rgba(255,255,255,.55) inset;
  }
  svg{ display:block; width:100%; height:auto }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">鹈鹕骑自行车</title>
  <desc id="dsc">一只戴着头盔的鹈鹕蹬着自行车前进的二维循环动画</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc0ec"/><stop offset=".55" stop-color="#bfe8fb"/><stop offset="1" stop-color="#edf9ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f97a6"/><stop offset="1" stop-color="#4f5766"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffe680" stop-opacity=".8"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1=".25" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e2f1"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#f4f8fe"/><stop offset="1" stop-color="#bccadf"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#ffc353"/><stop offset="1" stop-color="#ec8b12"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffd982"/><stop offset="1" stop-color="#f5a12a"/>
    </linearGradient>

    <!-- 轮子：动画内嵌，用 use 复用，两轮天然同步 -->
    <g id="wheel">
      <circle r="78" fill="none" stroke="#2f3646" stroke-width="13"/>
      <circle r="66" fill="none" stroke="#c6cfdd" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        <g stroke="#dde5f0" stroke-width="2.4" stroke-linecap="round">
          <line y1="-64" y2="64"/>
          <line x1="-55.4" y1="-32" x2="55.4" y2="32"/>
          <line x1="-32" y1="-55.4" x2="32" y2="55.4"/>
          <line x1="-64" x2="64"/>
          <line x1="32" y1="-55.4" x2="-32" y2="55.4"/>
          <line x1="55.4" y1="-32" x2="-55.4" y2="32"/>
        </g>
        <circle r="9" fill="#8b95a8"/>
        <circle cy="-42" r="5" fill="#f2615e"/>
      </g>
      <circle r="72" fill="none" stroke="#2f3646" stroke-width="3" opacity=".35"/>
    </g>
  </defs>

  <!-- ===================== 背景 ===================== -->
  <rect width="960" height="600" fill="url(#sky)"/>
  <circle cx="152" cy="110" r="96" fill="url(#sunGlow)"/>
  <circle cx="152" cy="110" r="38" fill="#ffe382"/>

  <!-- 云（视差：缓慢左移，内容重复一份实现无缝循环） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-480 0" dur="26s" repeatCount="indefinite"/>
    <g fill="#ffffff" opacity=".92">
      <g transform="translate(300 74)"><ellipse rx="48" ry="26"/><ellipse cx="-40" cy="9" rx="30" ry="18"/><ellipse cx="38" cy="10" rx="34" ry="20"/></g>
      <g transform="translate(700 130)"><ellipse rx="38" ry="20"/><ellipse cx="-32" cy="7" rx="24" ry="14"/><ellipse cx="30" cy="8" rx="26" ry="15"/></g>
      <g transform="translate(120 226)"><ellipse rx="52" ry="27"/><ellipse cx="-44" cy="10" rx="32" ry="18"/><ellipse cx="42" cy="11" rx="36" ry="20"/></g>
      <g transform="translate(780 74)"><ellipse rx="48" ry="26"/><ellipse cx="-40" cy="9" rx="30" ry="18"/><ellipse cx="38" cy="10" rx="34" ry="20"/></g>
      <g transform="translate(1180 130)"><ellipse rx="38" ry="20"/><ellipse cx="-32" cy="7" rx="24" ry="14"/><ellipse cx="30" cy="8" rx="26" ry="15"/></g>
      <g transform="translate(600 226)"><ellipse rx="52" ry="27"/><ellipse cx="-44" cy="10" rx="32" ry="18"/><ellipse cx="42" cy="11" rx="36" ry="20"/></g>
      <g transform="translate(1260 74)"><ellipse rx="48" ry="26"/><ellipse cx="-40" cy="9" rx="30" ry="18"/><ellipse cx="38" cy="10" rx="34" ry="20"/></g>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0 470 C 130 400 230 462 330 428 C 430 396 540 466 660 436 C 760 412 880 468 960 442 L 960 520 L 0 520 Z" fill="#9fd0a9" opacity=".85"/>
  <path d="M0 486 C 150 448 250 492 380 468 C 520 442 620 494 760 470 C 850 456 910 486 960 472 L 960 520 L 0 520 Z" fill="#7bbd8c"/>

  <!-- 草地与路边草丛（随车速左移，周期 240 无缝循环） -->
  <rect x="0" y="472" width="960" height="30" fill="#6fb07f"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="0.6s" repeatCount="indefinite"/>
    <g>
      <g transform="translate(40 506)" fill="#4e9a63"><path d="M-18 0 C -23 -15 -9 -23 -2 -16 C 2 -27 19 -25 21 -14 C 31 -12 31 0 23 0 Z"/></g>
      <g transform="translate(130 508)" fill="#5aa76e"><path d="M-7 0 C -9 -9 -3 -11 0 -4 C 3 -13 9 -8 7 0 Z"/></g>
      <g transform="translate(280 506)" fill="#4e9a63"><path d="M-16 0 C -21 -13 -8 -20 -2 -14 C 2 -24 17 -22 19 -12 C 28 -10 28 0 20 0 Z"/></g>
      <g transform="translate(370 508)" fill="#5aa76e"><path d="M-7 0 C -9 -9 -3 -11 0 -4 C 3 -13 9 -8 7 0 Z"/></g>
      <g transform="translate(520 506)" fill="#4e9a63"><path d="M-18 0 C -23 -15 -9 -23 -2 -16 C 2 -27 19 -25 21 -14 C 31 -12 31 0 23 0 Z"/></g>
      <g transform="translate(610 508)" fill="#5aa76e"><path d="M-7 0 C -9 -9 -3 -11 0 -4 C 3 -13 9 -8 7 0 Z"/></g>
      <g transform="translate(760 506)" fill="#4e9a63"><path d="M-16 0 C -21 -13 -8 -20 -2 -14 C 2 -24 17 -22 19 -12 C 28 -10 28 0 20 0 Z"/></g>
      <g transform="translate(850 508)" fill="#5aa76e"><path d="M-7 0 C -9 -9 -3 -11 0 -4 C 3 -13 9 -8 7 0 Z"/></g>
      <g transform="translate(1000 506)" fill="#4e9a63"><path d="M-18 0 C -23 -15 -9 -23 -2 -16 C 2 -27 19 -25 21 -14 C 31 -12 31 0 23 0 Z"/></g>
      <g transform="translate(1090 508)" fill="#5aa76e"><path d="M-7 0 C -9 -9 -3 -11 0 -4 C 3 -13 9 -8 7 0 Z"/></g>
      <g transform="translate(1240 506)" fill="#4e9a63"><path d="M-16 0 C -21 -13 -8 -20 -2 -14 C 2 -24 17 -22 19 -12 C 28 -10 28 0 20 0 Z"/></g>
    </g>
  </g>

  <!-- 路面 -->
  <ellipse cx="300" cy="508" rx="86" ry="10" fill="#2b3240" opacity=".25"/>
  <ellipse cx="660" cy="508" rx="86" ry="10" fill="#2b3240" opacity=".25"/>
  <rect x="0" y="500" width="960" height="100" fill="url(#road)"/>
  <line x1="0" y1="500" x2="960" y2="500" stroke="#eef4ff" stroke-width="3" opacity=".45"/>
  <g opacity=".8">
    <line x1="-200" y1="558" x2="1160" y2="558" stroke="#ffe9a8" stroke-width="9" stroke-dasharray="68 52">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="-200" y1="592" x2="1160" y2="592" stroke="#39404f" stroke-width="14" stroke-dasharray="16 86" opacity=".55">
      <animate attributeName="stroke-dashoffset" from="0" to="204" dur="0.51s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0" fill="none">
    <path d="M-40 250 C 40 244 90 240 160 246">
      <animateTransform attributeName="transform" type="translate" values="0 0; -420 0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M-30 320 C 30 314 70 312 130 318">
      <animateTransform attributeName="transform" type="translate" values="0 0; -420 0" dur="1.1s" begin="0.37s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="1.1s" begin="0.37s" repeatCount="indefinite"/>
    </path>
    <path d="M-30 168 C 30 162 80 160 140 166">
      <animateTransform attributeName="transform" type="translate" values="0 0; -420 0" dur="1.1s" begin="0.74s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.6;0" dur="1.1s" begin="0.74s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===================== 远侧腿（在车架之后） ===================== -->
  <g id="leg-far" opacity=".85">
    <g transform="translate(416.0 271.0)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0.00;-2.55;-5.25;-8.06;-10.93;-13.81;-16.61;-19.23;-21.55;-23.45;-24.85;-25.66;-25.84;-25.37;-24.27;-22.58;-20.37;-17.69;-14.63;-11.26;-7.68;-3.97;-0.25;3.33;6.59;9.30;11.27;12.38;12.66;12.26;11.35;10.06;8.48;6.65;4.62;2.40;0.00" dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
        <path d="M0 0 L55.44 79.60" stroke="#c8801f" stroke-width="25" stroke-linecap="round" fill="none"/>
        <g transform="translate(55.44 79.60)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0.00;4.80;9.22;13.18;16.58;19.35;21.41;22.69;23.16;22.81;21.64;19.69;17.02;13.70;9.82;5.46;0.70;-4.35;-9.62;-15.02;-20.43;-25.73;-30.75;-35.27;-38.99;-41.52;-42.50;-41.76;-39.43;-35.86;-31.43;-26.46;-21.19;-15.79;-10.39;-5.09;0.00" dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
            <path d="M0 0 L-57.44 79.40" stroke="#c8801f" stroke-width="19" stroke-linecap="round" fill="none"/>
            <g transform="translate(-57.44 79.40)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-0.00;-2.25;-3.97;-5.12;-5.65;-5.54;-4.80;-3.47;-1.62;0.65;3.21;5.97;8.82;11.67;14.45;17.13;19.67;22.05;24.26;26.28;28.10;29.69;31.00;31.95;32.40;32.22;31.23;29.38;26.77;23.60;20.08;16.40;12.72;9.14;5.77;2.70;-0.00" dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
                <g transform="scale(.85)">
                  <path d="M-10 -10 C 4 -16 30 -15 42 -5 C 47 -1 44 6 34 7 C 18 9 0 7 -10 5 C -16 3 -16 -7 -10 -10 Z" fill="#cf8524" stroke="#a86a17" stroke-width="2.2"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ===================== 自行车 ===================== -->
  <g id="bike">
    <!-- 远侧曲柄 + 脚踏 -->
    <g transform="translate(442 430)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2.5s" repeatCount="indefinite"/>
        <rect x="0" y="-5" width="28" height="10" rx="4" fill="#798394"/>
        <rect x="16" y="-5" width="24" height="10" rx="3" fill="#596274" opacity=".85"/>
      </g>
    </g>

    <use href="#wheel" x="300" y="430"/>
    <use href="#wheel" x="660" y="430"/>

    <!-- 车架 -->
    <g fill="none" stroke="#ee5c5c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M452 430 L300 430"/>
      <path d="M300 430 L400 292"/>
      <path d="M452 430 L400 292"/>
      <path d="M452 430 L624 318"/>
      <path d="M400 292 L636 272"/>
    </g>
    <path d="M624 318 L636 272" fill="none" stroke="#d24747" stroke-width="14" stroke-linecap="round"/>
    <path d="M618 320 L660 430" fill="none" stroke="#b9c3d3" stroke-width="9" stroke-linecap="round"/>

    <!-- 座垫 / 车把 -->
    <path d="M352 278 C 378 264 436 262 472 274 C 480 279 470 289 450 290 L 382 292 C 360 292 344 286 352 278 Z" fill="#3a4254"/>
    <g fill="none" stroke="#3a4254" stroke-width="9" stroke-linecap="round">
      <path d="M634 274 L646 253"/>
      <path d="M646 253 C 672 249 696 257 704 271 C 708 279 702 288 692 288"/>
    </g>

    <!-- 牙盘 + 链条 -->
    <circle cx="452" cy="430" r="24" fill="#cbd4e2" stroke="#8e98ab" stroke-width="3"/>
    <circle cx="452" cy="430" r="24" fill="none" stroke="#8e98ab" stroke-width="6" stroke-dasharray="3 5"/>
    <circle cx="300" cy="430" r="12" fill="#cbd4e2" stroke="#8e98ab" stroke-width="3"/>
    <g stroke="#5c6478" stroke-width="4" stroke-dasharray="9 9" fill="none">
      <path d="M301 418 L454 404"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.12s" repeatCount="indefinite"/></path>
      <path d="M301 442 L454 456"><animate attributeName="stroke-dashoffset" from="0" to="18" dur="0.12s" repeatCount="indefinite"/></path>
    </g>

    <!-- 近侧曲柄 + 脚踏 -->
    <g transform="translate(452 430)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.5s" repeatCount="indefinite"/>
        <rect x="0" y="-5" width="28" height="10" rx="4" fill="#98a3b6"/>
        <rect x="16" y="-5" width="24" height="10" rx="3" fill="#6b7488"/>
      </g>
    </g>
  </g>

  <!-- ===================== 近侧腿 ===================== -->
  <g id="leg-near">
    <g transform="translate(430.0 274.0)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0.00;3.19;6.58;10.07;13.55;16.88;19.91;22.48;24.46;25.76;26.37;26.37;25.86;24.92;23.65;22.08;20.27;18.23;15.98;13.54;10.94;8.19;5.34;2.45;-0.38;-3.07;-5.48;-7.51;-9.04;-9.99;-10.31;-9.99;-9.03;-7.49;-5.42;-2.90;0.00" dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
        <path d="M0 0 L75.18 61.29" stroke="#d98c25" stroke-width="28" stroke-linecap="round" fill="none"/>
        <path d="M0 0 L75.18 61.29" stroke="#f4a93f" stroke-width="24" stroke-linecap="round" fill="none"/>
        <path d="M0 0 L75.18 61.29" stroke="#ffcd85" stroke-width="9" stroke-linecap="round" fill="none" opacity=".55"/>
        <g transform="translate(75.18 61.29)">
          <circle r="13" fill="#f4a93f"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0.00;-5.06;-10.09;-14.94;-19.47;-23.46;-26.69;-28.89;-29.84;-29.43;-27.70;-24.84;-21.12;-16.78;-12.03;-7.06;-1.99;3.03;7.93;12.58;16.91;20.81;24.20;26.99;29.10;30.46;31.02;30.78;29.73;27.91;25.38;22.22;18.50;14.33;9.80;4.99;0.00" dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
            <path d="M0 0 L-25.18 94.71" stroke="#d98c25" stroke-width="22" stroke-linecap="round" fill="none"/>
            <path d="M0 0 L-25.18 94.71" stroke="#f4a93f" stroke-width="18" stroke-linecap="round" fill="none"/>
            <path d="M0 0 L-25.18 94.71" stroke="#ffcd85" stroke-width="7" stroke-linecap="round" fill="none" opacity=".55"/>
            <g transform="translate(-25.18 94.71)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-0.00;1.87;3.50;4.87;5.92;6.59;6.78;6.41;5.38;3.67;1.32;-1.53;-4.74;-8.15;-11.62;-15.03;-18.27;-21.26;-23.91;-26.12;-27.84;-29.00;-29.54;-29.44;-28.72;-27.39;-25.54;-23.27;-20.69;-17.92;-15.07;-12.23;-9.47;-6.84;-4.37;-2.09;-0.00" dur="2.5s" repeatCount="indefinite" calcMode="linear"/>
                <g transform="scale(.85)">
                  <path d="M-10 -10 C 4 -16 30 -15 42 -5 C 47 -1 44 6 34 7 C 18 9 0 7 -10 5 C -16 3 -16 -7 -10 -10 Z" fill="#f4a93f" stroke="#cf8420" stroke-width="2.2"/>
                  <path d="M8 -12 C 12 -4 12 3 8 6" stroke="#cf8420" stroke-width="2.2" fill="none" opacity=".75"/>
                  <path d="M24 -12 C 28 -4 28 4 24 6" stroke="#cf8420" stroke-width="2.2" fill="none" opacity=".75"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ===================== 鹈鹕 ===================== -->
  <g id="rider">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur="1.25s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

      <!-- 尾羽 -->
      <path d="M306 250 C 270 252 238 244 212 226 C 244 204 288 198 320 208 C 334 214 328 248 306 250 Z" fill="#dde6f2" stroke="#c2cee0" stroke-width="2"/>

      <!-- 远侧翅膀 -->
      <path d="M444 180 C 512 186 592 214 664 260 C 680 270 674 288 654 286 C 580 282 488 250 424 204 C 412 194 424 178 444 180 Z" fill="#c6d3e5"/>

      <!-- 身体 -->
      <ellipse cx="386" cy="238" rx="90" ry="60" fill="url(#bodyGrad)" stroke="#c2cee0" stroke-width="2.5" transform="rotate(-8 386 238)"/>
      <ellipse cx="372" cy="262" rx="58" ry="34" fill="#ffffff" opacity=".6" transform="rotate(-8 372 262)"/>
      <path d="M320 194 C 344 186 366 186 386 192" stroke="#ccd7e7" stroke-width="2.5" fill="none" opacity=".9"/>
      <path d="M312 216 C 336 208 358 208 378 214" stroke="#ccd7e7" stroke-width="2.5" fill="none" opacity=".7"/>

      <!-- 脖颈 -->
      <path d="M430 182 C 460 150 494 130 522 124 L 530 158 C 502 164 470 188 452 216 Z" fill="url(#bodyGrad)" stroke="#c2cee0" stroke-width="2.5"/>

      <!-- 头 + 喙 + 喉囊 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 450 200; 2 450 200; -2 450 200" dur="1.25s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        <!-- 喉囊 -->
        <path d="M572 136 C 588 182 618 200 652 192 C 682 185 698 164 706 140 C 668 162 620 158 572 136 Z" fill="url(#pouchGrad)" stroke="#e08f1c" stroke-width="2"/>
        <!-- 头 -->
        <circle cx="546" cy="132" r="32" fill="url(#bodyGrad)" stroke="#c2cee0" stroke-width="2.5"/>
        <!-- 上喙 -->
        <path d="M562 106 C 606 104 656 114 706 136 L 698 150 C 654 130 606 124 560 128 Z" fill="url(#beakGrad)" stroke="#d9861a" stroke-width="2" stroke-linejoin="round"/>
        <path d="M572 136 C 622 152 670 152 702 138" stroke="#d9861a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="614" cy="122" r="2.6" fill="#c9791a"/>
        <!-- 眼睛 -->
        <circle cx="536" cy="108" r="7.5" fill="#ffffff" stroke="#c2cee0" stroke-width="1.5"/>
        <circle cx="538.5" cy="108" r="4.2" fill="#2b3346"/>
        <circle cx="537" cy="106" r="1.5" fill="#ffffff"/>
        <path d="M526 95 C 531 91 541 91 546 95" stroke="#b7c4d6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- 头盔 -->
        <path d="M508 106 C 512 80 540 66 566 74 C 584 79 594 92 592 108 C 566 98 532 98 508 106 Z" fill="#2f8fd8" stroke="#2277b8" stroke-width="2"/>
        <path d="M588 92 C 606 94 614 100 616 108 C 604 104 594 104 584 106 Z" fill="#2f8fd8" stroke="#2277b8" stroke-width="2"/>
        <path d="M520 86 C 534 76 554 74 568 80" stroke="#8dcaf4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 近侧翅膀（握住车把） -->
      <path d="M434 190 C 508 196 592 224 668 266 C 686 276 680 296 660 294 C 586 288 494 258 430 214 C 418 204 420 188 434 190 Z" fill="url(#wingGrad)" stroke="#c2cee0" stroke-width="2.5"/>
      <path d="M486 218 C 514 228 542 240 566 254" stroke="#c9d5e6" stroke-width="2.5" fill="none"/>
      <path d="M528 244 C 554 254 578 266 598 280" stroke="#c9d5e6" stroke-width="2.5" fill="none" opacity=".8"/>
      <path d="M590 274 C 618 284 638 288 654 288" stroke="#c9d5e6" stroke-width="2.5" fill="none" opacity=".6"/>
    </g>
