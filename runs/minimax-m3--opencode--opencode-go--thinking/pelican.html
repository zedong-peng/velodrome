<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10233f;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    svg {
      width: min(100vw, 177.78vh);
      height: min(56.25vw, 100vh);
      display: block;
    }

    .cloud-a {
      animation: cloud-drift 18s linear infinite;
    }

    .cloud-b {
      animation: cloud-drift 25s linear -9s infinite;
    }

    .hill-back {
      animation: hill-scroll 13s linear infinite;
    }

    .hill-front {
      animation: hill-scroll 7s linear infinite;
    }

    .road-dashes {
      animation: road-scroll 1.2s linear infinite;
    }

    .rider-bob {
      animation: rider-bob 0.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 480px 250px;
    }

    .head-bob {
      animation: head-bob 0.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 580px 190px;
    }

    .wing-flap {
      animation: wing-flap 1.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 424px 246px;
    }

    .tail-feather {
      animation: tail-feather 1.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 366px 247px;
    }

    .sun-glow {
      animation: sun-pulse 4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 795px 110px;
    }

    @keyframes cloud-drift {
      from { transform: translateX(-1100px); }
      to { transform: translateX(1100px); }
    }

    @keyframes hill-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-480px); }
    }

    @keyframes road-scroll {
      to { stroke-dashoffset: -120px; }
    }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes head-bob {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-11deg); }
    }

    @keyframes tail-feather {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(7deg); }
    }

    @keyframes sun-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-a,
      .cloud-b,
      .hill-back,
      .hill-front,
      .road-dashes,
      .rider-bob,
      .head-bob,
      .wing-flap,
      .tail-feather,
      .sun-glow {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg viewBox="0 0 960 540" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
      <title id="title">鹈鹕骑自行车的二维动画</title>
      <desc id="description">一只白色鹈鹕在海边公路上欢快地骑着蓝色自行车，车轮、双腿、翅膀与沿途风景持续运动。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5ec7e8"/>
          <stop offset="0.58" stop-color="#bdeaf0"/>
          <stop offset="1" stop-color="#fff0c2"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55c6d6"/>
          <stop offset="1" stop-color="#2489af"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#46536a"/>
          <stop offset="1" stop-color="#293247"/>
        </linearGradient>
        <linearGradient id="bikeBlue" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6de3ff"/>
          <stop offset="1" stop-color="#2585d7"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffbc55"/>
          <stop offset="1" stop-color="#ef7e3e"/>
        </linearGradient>
        <radialGradient id="sunGradient">
          <stop offset="0" stop-color="#fffbd4"/>
          <stop offset="1" stop-color="#ffd86b"/>
        </radialGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#15304c" flood-opacity="0.25"/>
        </filter>
        <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12"/>
        </filter>
        <clipPath id="sceneClip">
          <rect width="960" height="540" rx="24"/>
        </clipPath>
      </defs>

      <g clip-path="url(#sceneClip)">
        <rect width="960" height="540" fill="url(#sky)"/>

        <g class="sun-glow">
          <circle cx="795" cy="110" r="62" fill="#fff5a3" opacity="0.45" filter="url(#blurGlow)"/>
          <circle cx="795" cy="110" r="43" fill="url(#sunGradient)"/>
        </g>

        <g class="cloud-a" fill="#fff" opacity="0.82">
          <path d="M-110 135c13-24 35-38 62-34 12-31 52-41 76-18 31-20 73 3 71 37 25-4 46 12 50 33H-110Z"/>
        </g>

        <rect y="330" width="960" height="111" fill="url(#sea)"/>

          <path d="M42 365q32-10 64 0t64 0" stroke-width="5"/>
          <path d="M207 397q38-11 76 0t76 0" stroke-width="4"/>
          <path d="M473 358q45-12 90 0t90 0" stroke-width="4"/>
          <path d="M716 409q33-10 66 0t66 0" stroke-width="5"/>

            <path d="M348 405l43-83 43 83Z"/>
            <path d="M688 420l42-80 42 80Z"/>

        <g class="hill-front">
          <path d="M-440 455q126-101 258-19 96-112 214-19 112-101 219-10 111-81 282 38 87-66 203 10v84H-440Z" fill="#2f7867"/>
          <g fill="#24685c">

            <path d="M840 446l35-70 35 70Z"/>

        </g>

        <rect y="438" width="960" height="102" fill="url(#road)"/>
        <rect y="438" width="960" height="7" fill="#e7edf1" opacity="0.75"/>

              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
              <line x1="-64" y1="0" x2="64" y2="0"/>

          <g transform="translate(700 400)">

            <circle r="66" fill="#d8f5fb" stroke="#f8ffff" stroke-width="6"/>
            <g stroke="#8eb7c6" stroke-width="2" opacity="0.9">
              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
              <line x1="-64" y1="0" x2="64" y2="0"/>
              <line x1="0" y1="-64" x2="0" y2="64"/>
              <line x1="-45" y1="-45" x2="45" y2="45"/>
              <line x1="45" y1="-45" x2="-45" y2="45"/>
              <line x1="-60" y1="-21" x2="60" y2="21"/>

            </g>
            <circle r="9" fill="#26364a" stroke="#f5ffff" stroke-width="4"/>

          <g fill="none" stroke="url(#bikeBlue)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
            <path d="M292 400L420 291 493 400Z"/>

          <path d="M420 291l205 4" fill="none" stroke="#c0f3ff" stroke-width="5" stroke-linecap="round"/>

          <path d="M645 240l32-9" fill="none" stroke="#27384c" stroke-width="12" stroke-linecap="round"/>
          <path d="M661 234l24-2" fill="none" stroke="#ffcf59" stroke-width="9" stroke-linecap="round"/>
          <path d="M418 280l-2 24" fill="none" stroke="#27384c" stroke-width="9"/>
          <path d="M390 281h58" fill="none" stroke="#27384c" stroke-width="13" stroke-linecap="round"/>
          <path d="M493 400l51-3" fill="none" stroke="#27384c" stroke-width="8" stroke-linecap="round"/>
          <g transform="translate(493 400)">
            <circle r="24" fill="#f7d768" stroke="#27384c" stroke-width="7"/>

            <g>
              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
              <line x1="0" y1="0" x2="0" y2="-32" stroke="#27384c" stroke-width="8" stroke-linecap="round"/>
              <line x1="0" y1="0" x2="0" y2="32" stroke="#27384c" stroke-width="8" stroke-linecap="round"/>
              <path d="M-13-32h26" stroke="#f6b13d" stroke-width="8" stroke-linecap="round"/>
              <path d="M-13 32h26" stroke="#f6b13d" stroke-width="8" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <g class="rider-bob">
          <g class="tail-feather">
            <path d="M386 240q-55-28-94 4 42 4 65 28Z" fill="#e9f3f7" stroke="#b9d2df" stroke-width="4" stroke-linejoin="round"/>

        <g fill="#2c4c5c" opacity="0.8">

  </main>
</body>
</html>
