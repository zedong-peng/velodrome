<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #2b2d42, #12121a 70%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    gap: 14px;
  }

  h1 {
    color: #ffd166;
    font-size: 22px;
    letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(255, 209, 102, .35);
  }

  .hint { color: #8d99ae; font-size: 12px; letter-spacing: 1px; }

  svg.stage {
    width: min(860px, 96vw);
    height: auto;
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    display: block;
  }

  /* ---------- 车轮旋转 ---------- */
  .wheel-spin {
    transform-box: view-box;
    animation: spinCW 1.2s linear infinite;
  }
  .wheel-spin.rear  { transform-origin: 250px 382px; }
  .wheel-spin.front { transform-origin: 510px 382px; }
  @keyframes spinCW { to { transform: rotate(360deg); } }

  /* ---------- 身体上下颠簸 ---------- */
  .pelican-bob {
    animation: bob 1.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(2.5px); }
  }

  /* ---------- 头部/颈部轻晃 ---------- */
  .head-sway {
    transform-box: view-box;
    transform-origin: 352px 234px;
    animation: sway 1.2s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(2.2deg); }
  }

  /* ---------- 翅膀轻扇 ---------- */
  .wing-flap {
    transform-box: view-box;
    transform-origin: 318px 240px;
    animation: flap 0.6s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-5deg); }
  }

  /* ---------- 云朵漂移 ---------- */
  .cloud { animation: drift linear infinite; }
  .cloud.c1 { animation-duration: 26s; }
  .cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
  .cloud.c3 { animation-duration: 22s; animation-delay: -7s; }
  @keyframes drift {
    from { transform: translateX(880px); }
    to   { transform: translateX(-280px); }
  }

  /* ---------- 远山视差 ---------- */
  .hills-far {
    animation: scrollFar 18s linear infinite;
  }
  @keyframes scrollFar {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }

  /* ---------- 近处灌木视差 ---------- */
  .bushes-near {
    animation: scrollNear 5s linear infinite;
  }
  @keyframes scrollNear {
    from { transform: translateX(0); }
    to   { transform: translateX(-200px); }
  }

  /* ---------- 路面虚线 ---------- */
  .road-dashes {
    animation: scrollNear 0.9s linear infinite;
  }

  /* ---------- 速度线 ---------- */
  .speed-line { animation: zoom 0.55s linear infinite; opacity: 0; }
  .speed-line.s2 { animation-delay: 0.18s; }
  .speed-line.s3 { animation-delay: 0.36s; }
  @keyframes zoom {
    0%   { opacity: 0; transform: translateX(30px); }
    20%  { opacity: .85; }
    100% { opacity: 0; transform: translateX(-90px); }
  }

  /* ---------- 太阳光晕脉动 ---------- */
  .sun-glow { animation: glow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glow {
    0%, 100% { opacity: .35; transform: scale(1); }
    50%      { opacity: .6;  transform: scale(1.12); }
  }
</style>
</head>
<body>

<h1>鹈鹕骑自行车</h1>
