<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      --bg-outer: #0f1c2e;
      --panel-bg: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(255, 255, 255, 0.9);
      --text-main: #1f3347;
      --accent: #2a9d8f;
      --accent-hover: #218176;
      --coral: #e76f51;
      --shadow: 0 22px 60px rgba(10, 26, 44, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 30%, #1c3552 0%, #0d1828 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage-wrapper {
      position: relative;
      width: min(96vw, 1120px);
      aspect-ratio: 5 / 3;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, 0.14);
      background: #9ad8ee;
    }

    svg#scene {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(15, 34, 54, 0.18);
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100% - 24px);
    }

    .ctrl-btn {
      appearance: none;
      border: none;
      background: rgba(31, 51, 71, 0.08);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.14s ease, background 0.18s ease, color 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(31, 51, 71, 0.15);
      transform: translateY(-1px);
    }

    .ctrl-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .ctrl-btn.primary {
      background: var(--accent);
      color: #ffffff;
    }

    .ctrl-btn.primary:hover {
      background: var(--accent-hover);
    }

    .ctrl-btn.coral {
      background: var(--coral);
      color: #ffffff;
    }

    .ctrl-btn.coral:hover {
      background: #d85c3e;
    }

    .speed-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
    }

    .speed-group input[type="range"] {
      width: 78px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(31, 51, 71, 0.16);
    }

    .hint-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #244058;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 12px rgba(15, 34, 54, 0.08);
    }

    @media (max-width: 640px) {
      .controls {
        bottom: 10px;
        gap: 6px;
        padding: 6px 10px;
      }
      .ctrl-btn {
        font-size: 12px;
        padding: 5px 10px;
      }
      .divider {
        display: none;
      }
      .hint-badge {
        font-size: 11px;
        top: 10px;
        left: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="stage-wrapper">
    <div class="hint-badge">点击画面或鹈鹕可按铃鸣叫</div>

    <svg id="scene" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">

        <!-- Road Markings & Asphalt Texture Tile (Period = 200, repeated 6 times = 1200) -->

          <!-- Subtle asphalt pebbles & texture ticks (strictly locked to road speed) -->

      // ================================================================

      function transformPoint(pt, tx, ty, angleDeg, pivotX, pivotY) {
        const rad = angleDeg * Math.PI / 180;
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        const rx = pt.x - pivotX;
        const ry = pt.y - pivotY;
        return {
          x: pivotX + rx * c - ry * s + tx,
          y: pivotY + rx * s + ry * c + ty
        };
      }

      // Exact 2-bone Inverse Kinematics with knee bending FORWARD (+x direction)
      function solveLegIK(hx, hy, ax, ay, l1, l2) {
        const dx = ax - hx;
        const dy = ay - hy;
        let d = Math.hypot(dx, dy);
        const minD = Math.abs(l1 - l2) + 0.5;
        const maxD = l1 + l2 - 0.5;
        if (d < minD) d = minD;
        if (d > maxD) d = maxD;

        const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));

        const ux = dx / d;
        const uy = dy / d;
        // Forward-facing perpendicular in screen coordinates (Y down -> (+uy, -ux) points right)
        const px = uy;
        const py = -ux;

        return {
          kx: hx + a * ux + h * px,
          ky: hy + a * uy + h * py
        };
      }

      function computeAnkleForPedal(pedalX, pedalY, footAngleDeg) {
        const rad = footAngleDeg * Math.PI / 180;
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        // Ensures local (FOOT_CONTACT_X, FOOT_CONTACT_Y) lands exactly at (pedalX, pedalY)
        return {
          ax: pedalX - (FOOT_CONTACT_X * c - FOOT_CONTACT_Y * s),
          ay: pedalY - (FOOT_CONTACT_X * s + FOOT_CONTACT_Y * c)
        };
      }

      function f(n) {
        return n.toFixed(1);
      }

      // ================================================================
      // UPDATE FUNCTIONS
      // ================================================================
      function updateLeg(isNear, angle, hipWorld) {
        const px = BB_X + R_CRANK * Math.cos(angle);
        const py = BB_Y + R_CRANK * Math.sin(angle);

        // Realistic gentle ankling motion through the pedal circle
        const footAngle = -5 + 9 * Math.sin(angle - 0.55);
        const { ax, ay } = computeAnkleForPedal(px, py, footAngle);
        const { kx, ky } = solveLegIK(hipWorld.x, hipWorld.y, ax, ay, L1, L2);

        if (isNear) {
          nearCrankArm.setAttribute('x2', f(px));
          nearCrankArm.setAttribute('y2', f(py));
          nearCrankHighlight.setAttribute('x2', f(px));
          nearCrankHighlight.setAttribute('y2', f(py));
          nearPedal.setAttribute('transform', `translate(${f(px)}, ${f(py)}) rotate(${f(footAngle * 0.55)})`);

          const upperD = `M ${f(hipWorld.x)} ${f(hipWorld.y)} L ${f(kx)} ${f(ky)}`;
          const lowerD = `M ${f(kx)} ${f(ky)} L ${f(ax)} ${f(ay)}`;
          nearUpperLeg.setAttribute('d', upperD);
          nearUpperLegHi.setAttribute('d', upperD);
          nearLowerLeg.setAttribute('d', lowerD);
          nearLowerLegHi.setAttribute('d', lowerD);

          nearKneeJoint.setAttribute('cx', f(kx));
          nearKneeJoint.setAttribute('cy', f(ky));
          nearKneeHi.setAttribute('cx', f(kx + 1.2));
          nearKneeHi.setAttribute('cy', f(ky - 1.6));

          // Align feathered white thigh cuff along upper leg angle
          const thighAngle = Math.atan2(ky - hipWorld.y, kx - hipWorld.x) * 180 / Math.PI - 42;
          nearThighCuff.setAttribute(
            'transform',
            `translate(${f(hipWorld.x - 432)}, ${f(hipWorld.y - 316)}) rotate(${f(thighAngle * 0.55)}, 432, 316)`
          );

          nearFoot.setAttribute('transform', `translate(${f(ax)}, ${f(ay)}) rotate(${f(footAngle)})`);
        } else {
          farCrankArm.setAttribute('x2', f(px));
          farCrankArm.setAttribute('y2', f(py));
          farPedal.setAttribute('transform', `translate(${f(px)}, ${f(py)}) rotate(${f(footAngle * 0.55)})`);

          farUpperLeg.setAttribute('d', `M ${f(hipWorld.x)} ${f(hipWorld.y)} L ${f(kx)} ${f(ky)}`);
          farLowerLeg.setAttribute('d', `M ${f(kx)} ${f(ky)} L ${f(ax)} ${f(ay)}`);
          farKneeJoint.setAttribute('cx', f(kx));
          farKneeJoint.setAttribute('cy', f(ky));
          farFoot.setAttribute('transform', `translate(${f(ax)}, ${f(ay)}) rotate(${f(footAngle)})`);
        }
      }

      function updateWings(shNear, shFar) {
        // Delta of moving shoulders relative to resting pose (handlebar grips stay locked to bike!)
        const dnx = shNear.x - SH_NEAR_LOCAL.x;
        const dny = shNear.y - SH_NEAR_LOCAL.y;

        // Near wing: shoulder moves by (dnx, dny), midpoint flexes by 0.55, grip end stays 100% locked!
        const mx = dnx * 0.52;
        const my = dny * 0.52;

        nearWingUpper.setAttribute(
          'd',
          `M ${f(426 + dnx)} ${f(226 + dny)}
           C ${f(446 + dnx * 0.85)} ${f(218 + dny * 0.85)}, ${f(474 + mx)} ${f(234 + my)}, 507 262
           C ${f(492 + mx * 0.5)} ${f(269 + my * 0.5)}, ${f(468 + mx)} ${f(272 + my)}, ${f(444 + dnx * 0.8)} ${f(269 + dny * 0.8)}
           C ${f(422 + dnx)} ${f(266 + dny)}, ${f(411 + dnx)} ${f(253 + dny)}, ${f(415 + dnx)} ${f(238 + dny)}
           C ${f(417 + dnx)} ${f(231 + dny)}, ${f(421 + dnx)} ${f(228 + dny)}, ${f(426 + dnx)} ${f(226 + dny)} Z`
        );

        nearWingSecondary.setAttribute(
          'd',
          `M ${f(416 + dnx)} ${f(248 + dny)}
           C ${f(414 + dnx)} ${f(268 + dny)}, ${f(434 + dnx * 0.8)} ${f(282 + dny * 0.8)}, ${f(464 + mx)} ${f(280 + my)}
           C ${f(482 + mx * 0.5)} ${f(279 + my * 0.5)}, ${f(496 + mx * 0.25)} ${f(273 + my * 0.25)}, 506 266
           C ${f(486 + mx * 0.5)} ${f(254 + my * 0.5)}, ${f(458 + dnx * 0.7)} ${f(242 + dny * 0.7)}, ${f(416 + dnx)} ${f(248 + dny)} Z`
        );

        nearWingPrimaries.setAttribute(
          'd',
          `M ${f(480 + mx * 0.45)} ${f(264 + my * 0.45)}
           C ${f(498 + mx * 0.2)} ${f(258 + my * 0.2)}, 514 261, 524 267
           C 527 271, 523 278, 514 278
           C 503 278, ${f(492 + mx * 0.3)} ${f(276 + my * 0.3)}, ${f(476 + mx * 0.45)} ${f(274 + my * 0.45)} Z`
        );

        nearWingDetail.setAttribute(
          'd',
          `M ${f(432 + dnx * 0.9)} ${f(254 + dny * 0.9)} Q ${f(448 + mx)} ${f(262 + my)} ${f(464 + mx * 0.8)} ${f(258 + my * 0.8)}
           M ${f(446 + dnx * 0.85)} ${f(244 + dny * 0.85)} Q ${f(464 + mx)} ${f(252 + my)} ${f(480 + mx * 0.6)} ${f(252 + my * 0.6)}`
        );

        // Far wing
        const dfx = shFar.x - SH_FAR_LOCAL.x;
        const dfy = shFar.y - SH_FAR_LOCAL.y;
        farWingPath.setAttribute(
          'd',
          `M ${f(468 + dfx)} ${f(222 + dfy)}
           C ${f(490 + dfx * 0.6)} ${f(220 + dfy * 0.6)}, ${f(514 + dfx * 0.25)} ${f(238 + dfy * 0.25)}, 532 256
           C 538 262, 532 270, 522 268
           C ${f(500 + dfx * 0.3)} ${f(264 + dfy * 0.3)}, ${f(480 + dfx * 0.65)} ${f(254 + dfy * 0.65)}, ${f(464 + dfx)} ${f(246 + dfy)} Z`
        );
      }

      function updateScarf(t, spd) {
        const amp = 4.5 + spd * 3.5;
        const freq = 7.2 + spd * 2.2;
        const w1 = Math.sin(t * freq) * amp;
        const w2 = Math.sin(t * freq - 1.55) * (amp * 1.45);
        const wb1 = Math.sin(t * freq + 1.1) * (amp * 0.95);
        const wb2 = Math.sin(t * freq - 0.5) * (amp * 1.35);

        // Front scarf tail
        const tipX = 354 - spd * 6;
        const tipY = 208 + w2;
        scarfTailFront.setAttribute(
          'd',
          `M 456 207
           C 424 ${f(212 + w1)}, 392 ${f(198 + w2 * 0.65)}, ${f(tipX)} ${f(tipY)}
           C ${f(tipX + 4)} ${f(tipY + 10)}, ${f(tipX + 8)} ${f(tipY + 18)}, ${f(tipX + 14)} ${f(tipY + 23)}
           C 398 ${f(221 + w2 * 0.6)}, 428 ${f(230 + w1 * 0.85)}, 458 220 Z`
        );

        scarfStripe1.setAttribute(
          'd',
          `M 426 ${f(210 + w1 * 0.72)} C 423 ${f(216 + w1 * 0.72)}, 422 ${f(221 + w1 * 0.72)}, 425 ${f(226 + w1 * 0.72)}`
        );
        scarfStripe2.setAttribute(
          'd',
          `M 393 ${f(205 + w2 * 0.55)} C 390 ${f(211 + w2 * 0.55)}, 391 ${f(217 + w2 * 0.55)}, 394 ${f(222 + w2 * 0.55)}`
        );

        // Back scarf tail
        const bTipX = 368 - spd * 5;
        const bTipY = 204 + wb2;
        scarfTailBack.setAttribute(
          'd',
          `M 454 205
           C 425 ${f(201 + wb1)}, 395 ${f(213 + wb2 * 0.65)}, ${f(bTipX)} ${f(bTipY)}
           C ${f(bTipX - 3)} ${f(bTipY + 8)}, ${f(bTipX)} ${f(bTipY + 16)}, ${f(bTipX + 8)} ${f(bTipY + 18)}
           C 402 ${f(225 + wb2 * 0.6)}, 430 ${f(216 + wb1 * 0.8)}, 456 218 Z`
        );
      }

      function updateGulls(t) {
        const gulls = [
          { el: gull1, baseX: 1120, y: 92, speed: 34, flap: 4.6, phase: 0, span: 15 },
          { el: gull2, baseX: 1120, y: 128, speed: 28, flap: 5.1, phase: 2.1, span: 12 },
          { el: gull3, baseX: 1120, y: 74, speed: 22, flap: 4.2, phase: 4.0, span: 10 }
        ];
        gulls.forEach((g) => {
          const x = 1080 - ((t * g.speed + g.phase * 150) % 1180);
          const y = g.y + Math.sin(t * 1.4 + g.phase) * 7;
          const wingY = Math.sin(t * g.flap + g.phase) * (g.span * 0.42);
          const s = g.span;
          g.el.setAttribute(
            'd',
            `M ${f(x)} ${f(y)} Q ${f(x - s * 0.5)} ${f(y - 6 + wingY)} ${f(x - s)} ${f(y + wingY * 1.3)}
             M ${f(x)} ${f(y)} Q ${f(x + s * 0.5)} ${f(y - 6 + wingY)} ${f(x + s)} ${f(y + wingY * 1.3)}`
          );
        });
      }

      function triggerSquawk() {
        squawkTimer = 0;
        nextAutoSquawkAt = rawTime + 8 + Math.random() * 5;
      }

      function applyMood(sunset) {
        isSunset = sunset;
        const setStop = (id, color) => document.getElementById(id).setAttribute('stop-color', color);
        const glint = document.getElementById('sunOceanGlint');
        if (sunset) {
          setStop('skyStop0', '#3C4F82');
          setStop('skyStop1', '#D97B6C');
          setStop('skyStop2', '#FFD08A');
          setStop('sunHalo0', '#FFE39C');
          setStop('sunHalo1', '#FF8E53');
          setStop('sunHalo2', '#FF6B4A');
          document.getElementById('sunDisk').setAttribute('fill', '#FFBE5C');
          document.getElementById('sunGroup').setAttribute('transform', 'translate(810, 248)');
          glint.setAttribute('fill', '#FFCA7A');
          glint.setAttribute('opacity', '0.68');
          setStop('oceanStop0', '#4A527A');
          setStop('oceanStop1', '#A6687A');
          setStop('oceanStop2', '#EBA881');
          setStop('sandStop0', '#E8BA8E');
          setStop('sandStop1', '#C9956B');
          btnMood.textContent = '☀️ 切换晴日';
        } else {
          setStop('skyStop0', '#5DB7DE');
          setStop('skyStop1', '#ACE0F2');
          setStop('skyStop2', '#FFF0D4');
          setStop('sunHalo0', '#FFF7CC');
          setStop('sunHalo1', '#FFE08C');
          setStop('sunHalo2', '#FFD166');
          document.getElementById('sunDisk').setAttribute('fill', '#FFF2B2');
          document.getElementById('sunGroup').setAttribute('transform', 'translate(822, 114)');
          glint.setAttribute('fill', '#FFF5C4');
          glint.setAttribute('opacity', '0.45');
          setStop('oceanStop0', '#298CB5');
          setStop('oceanStop1', '#40ABC9');
          setStop('oceanStop2', '#7FD3DE');
          setStop('sandStop0', '#F6E3BC');
          setStop('sandStop1', '#E5C896');
          btnMood.textContent = '🌅 切换日落';
        }
      }

      // ================================================================
      // MAIN ANIMATION LOOP
      // ================================================================
      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (isPlaying) {
          rawTime += dt;
          const crankFreq = 0.72 * speedMul; // rev/s
          const dCrank = dt * crankFreq * Math.PI * 2;
          crankAngle += dCrank;
          elapsed += dt * (0.45 + 0.55 * speedMul);

          // Exact wheel rotation & linear ground distance (zero wheel slip!)
          const wheelAngle = crankAngle * GEAR_RATIO;
          groundDist += dCrank * GEAR_RATIO * R_WHEEL;

          // Update parallax layers (all seamless via modulo wrap)
          cloudsLayer.setAttribute('transform', `translate(${f(-(groundDist * 0.055) % 1200)}, 0)`);
          horizonLayer.setAttribute('transform', `translate(${f(-(groundDist * 0.11) % 1200)}, 0)`);
          beachLayer.setAttribute('transform', `translate(${f(-(groundDist * 0.34) % 1200)}, 0)`);
          railingLayer.setAttribute('transform', `translate(${f(-(groundDist * 0.72) % 1000)}, 0)`);
          roadLayer.setAttribute('transform', `translate(${f(-(groundDist * 1.0) % 1200)}, 0)`);
          fgGrassLayer.setAttribute('transform', `translate(${f(-(groundDist * 1.18) % 1200)}, 0)`);

          // Gentle shoreline wave undulation & sparkle pulse
          const foamY = Math.sin(rawTime * 2.1) * 2.6;
          shoreFoam.setAttribute('transform', `translate(0, ${f(foamY)})`);
          oceanSparkles.setAttribute('opacity', (0.38 + 0.22 * Math.sin(rawTime * 3.1)).toFixed(2));

          // Rotate wheels, cogs, chainring & advance chain links
          const wheelDeg = (wheelAngle * 180 / Math.PI) % 360;
          const crankDeg = (crankAngle * 180 / Math.PI) % 360;
          rearWheelRot.setAttribute('transform', `rotate(${f(wheelDeg)})`);
          frontWheelRot.setAttribute('transform', `rotate(${f(wheelDeg)})`);
          rearCogRot.setAttribute('transform', `rotate(${f(wheelDeg)})`);
          chainringRot.setAttribute('transform', `rotate(${f(crankDeg)})`);

          const chainShift = -(crankAngle * R_RING) % CHAIN_DASH_PERIOD;
          chainLinks.setAttribute('stroke-dashoffset', f(chainShift));

          // Subtle micro road suspension bounce for the entire bike
          const bikeBounceY = Math.sin(crankAngle * 2 - 0.3) * 0.9 + Math.sin(rawTime * 11) * 0.25;
          heroRig.setAttribute('transform', `translate(0, ${f(bikeBounceY)})`);
          bikeShadow.setAttribute('rx', f(196 + Math.sin(crankAngle * 2) * 3.5));

          // Pelican torso pedaling bob & cheerful lean
          const bodyBobY = Math.sin(crankAngle * 2) * 3.2;
          const bodyBobX = Math.cos(crankAngle * 2) * 1.1;
          const bodyTilt = Math.sin(crankAngle * 2 + 0.4) * 1.6;
          pelicanBodyGroup.setAttribute(
            'transform',
            `translate(${f(bodyBobX)}, ${f(bodyBobY)}) rotate(${f(bodyTilt)}, ${BODY_PIVOT_X}, ${BODY_PIVOT_Y})`
          );

          // Tail feathers & head crest subtle flutter
          const tailWag = Math.sin(crankAngle * 2 - 0.9) * 4.5 + Math.sin(elapsed * 9) * 1.6;
          pelicanTail.setAttribute('transform', `translate(384, 271) rotate(${f(tailWag)})`);

          const crestFlutter = Math.sin(elapsed * 11) * (3 + speedMul * 2.2);
          pelicanCrest.setAttribute('transform', `translate(-14, -31) rotate(${f(crestFlutter)})`);

          // Auto squawk trigger every ~9-13s for lively storytelling
          if (squawkTimer < 0 && rawTime >= nextAutoSquawkAt) {
            triggerSquawk();
          }

          // Interactive Squawk & Bell Ring animation
          let squawkOpen = 0;
          let headSquawkTilt = 0;
          if (squawkTimer >= 0) {
            squawkTimer += dt;
            const p = squawkTimer / SQUAWK_DURATION;
            if (p >= 1) {
              squawkTimer = -1;
              bellWaves.setAttribute('opacity', '0');
              squawkFx.setAttribute('opacity', '0');
              mouthInside.setAttribute('opacity', '0');
              bikeBell.setAttribute('transform', 'translate(551, 261)');
            } else {
              // Double cheerful honk-honk envelope
              const env = Math.sin(p * Math.PI);
              const doublePulse = Math.max(0, Math.sin(p * Math.PI * 2.5));
              squawkOpen = env * (0.45 + 0.55 * doublePulse);
              headSquawkTilt = -env * 8.5;

              // Bell vibration & expanding sound waves
              const bellShake = Math.sin(p * 48) * (1 - p) * 2.2;
              bikeBell.setAttribute('transform', `translate(${f(551 + bellShake)}, 261) rotate(${f(bellShake * 4)})`);
              const waveAlpha = Math.sin(Math.min(1, p * 1.5) * Math.PI);
              bellWaves.setAttribute('opacity', (waveAlpha * 0.9).toFixed(2));
              bellWaves.setAttribute('transform', `translate(0, ${f(-p * 10)})`);

              // Musical notes float upward
              const fxAlpha = Math.sin(p * Math.PI);
              squawkFx.setAttribute('opacity', fxAlpha.toFixed(2));
              squawkFx.setAttribute('transform', `translate(${f(p * 14)}, ${f(-p * 24)})`);
              mouthInside.setAttribute('opacity', (squawkOpen > 0.08 ? 0.92 : 0).toFixed(2));
            }
          }

          // Head stabilization + subtle bob + squawk lift
          const headTilt = -bodyTilt * 0.65 + Math.sin(crankAngle * 2 - 0.7) * 2.1 + headSquawkTilt;
          pelicanHeadPivot.setAttribute('transform', `translate(486, 142) rotate(${f(headTilt)})`);

          // Articulated beak & bouncy throat pouch secondary motion
          const upperAngle = -squawkOpen * 14;
          const lowerAngle = squawkOpen * 12;
          upperBeakGroup.setAttribute('transform', `rotate(${f(upperAngle)}, 26, -8)`);
          lowerBeakGroup.setAttribute('transform', `rotate(${f(lowerAngle)}, 26, -8)`);

          const pouchJiggle = Math.sin(crankAngle * 2 - 0.95) * 3.8 + squawkOpen * 8.5;
          pelicanPouch.setAttribute(
            'd',
            `M 4 5 C 12 ${f(24 + pouchJiggle * 0.5)}, 38 ${f(48 + pouchJiggle)}, 76 ${f(47 + pouchJiggle)} C 110 ${f(46 + pouchJiggle * 0.7)}, 134 24, 148 1 L 24 -8 Z`
          );
          pouchHighlight.setAttribute(
            'd',
            `M 28 8 C 44 ${f(26 + pouchJiggle * 0.55)}, 72 ${f(34 + pouchJiggle * 0.75)}, 106 ${f(23 + pouchJiggle * 0.4)}`
          );
          pouchFold.setAttribute(
            'd',
            `M 24 ${f(18 + pouchJiggle * 0.35)} C 44 ${f(37 + pouchJiggle * 0.75)}, 74 ${f(42 + pouchJiggle * 0.85)}, 108 ${f(31 + pouchJiggle * 0.55)}`
          );

          // Natural periodic blinking (plus happy squint during squawk!)
          if (blinkTimer < 0 && rawTime >= nextBlinkAt) {
            blinkTimer = 0;
          }
          let eyeClosed = squawkOpen > 0.35;
          if (blinkTimer >= 0) {
            blinkTimer += dt;
            if (blinkTimer < 0.14) {
              eyeClosed = true;
            } else {
              blinkTimer = -1;
              nextBlinkAt = rawTime + 2.8 + Math.random() * 2.8;
            }
          }
          pelicanEyeOpen.setAttribute('opacity', eyeClosed ? '0' : '1');
          pelicanEyeClosed.setAttribute('opacity', eyeClosed ? '1' : '0');

          // Compute exact world hip & shoulder positions from animated torso
          const hipNearWorld = transformPoint(HIP_NEAR_LOCAL, bodyBobX, bodyBobY, bodyTilt, BODY_PIVOT_X, BODY_PIVOT_Y);
          const hipFarWorld  = transformPoint(HIP_FAR_LOCAL,  bodyBobX, bodyBobY, bodyTilt, BODY_PIVOT_X, BODY_PIVOT_Y);
          const shNearWorld  = transformPoint(SH_NEAR_LOCAL,  bodyBobX, bodyBobY, bodyTilt, BODY_PIVOT_X, BODY_PIVOT_Y);
          const shFarWorld   = transformPoint(SH_FAR_LOCAL,   bodyBobX, bodyBobY, bodyTilt, BODY_PIVOT_X, BODY_PIVOT_Y);

          // Solve 2-bone IK for both legs (180 degrees out of phase)
          updateLeg(true, crankAngle, hipNearWorld);
          updateLeg(false, crankAngle + Math.PI, hipFarWorld);

          // Flex both wings cleanly between animated shoulders & locked handlebar grips
          updateWings(shNearWorld, shFarWorld);

          // Animate scarf ribbons
          updateScarf(elapsed, speedMul);

          // Playful fish bob inside basket (plus startled hop when bell rings!)
          const fishHop = squawkTimer >= 0 ? -Math.sin((squawkTimer / SQUAWK_DURATION) * Math.PI) * 6.5 : 0;
          const fishBob = Math.sin(crankAngle * 2 - 0.5) * 1.6 + fishHop;
          const fishRot = Math.sin(crankAngle * 2 - 0.5) * 1.4 + (squawkTimer >= 0 ? Math.sin(squawkTimer * 28) * 3.5 : 0);
          basketFish.setAttribute('transform', `translate(0, ${f(fishBob)}) rotate(${f(fishRot)}, 612, 282)`);

          // Distant seagulls
          updateGulls(rawTime);

          // Flowing sea breeze wind lines
          windStreams.forEach((ws, idx) => {
            ws.x -= dt * ws.speed * speedMul;
            if (ws.x < -120) {
              ws.x = 1040 + Math.random() * 260;
              ws.y = 120 + Math.random() * 290;
            }
            const el = windEls[idx];
            el.setAttribute('transform', `translate(${f(ws.x)}, ${f(ws.y)})`);
            el.setAttribute('opacity', (0.22 + 0.25 * Math.min(1.4, speedMul)).toFixed(2));
          });
        }

        requestAnimationFrame(tick);
      }

      // ================================================================
      // EVENT LISTENERS
      // ================================================================
      btnPlayPause.addEventListener('click', (e) => {
        e.stopPropagation();
        isPlaying = !isPlaying;
        btnPlayPause.textContent = isPlaying ? '⏸ 暂停' : '▶ 继续';
      });

      speedSlider.addEventListener('input', (e) => {
        speedMul = parseFloat(e.target.value);
        speedLabel.textContent = `${speedMul.toFixed(1)}x`;
      });

      btnSquawk.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isPlaying) {
          isPlaying = true;
          btnPlayPause.textContent = '⏸ 暂停';
        }
        triggerSquawk();
      });

      btnMood.addEventListener('click', (e) => {
        e.stopPropagation();
        applyMood(!isSunset);
      });

      scene.addEventListener('click', () => {
        if (!isPlaying) {
          isPlaying = true;
          btnPlayPause.textContent = '⏸ 暂停';
        }
        triggerSquawk();
      });

      // Render frame 0 immediately so IK limbs & scenery start in exact pose, then run loop
      tick(lastTime);
    })();
  </script>
</body>
</html>
