<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Ride</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #182437;
      --cream: #fff5da;
      --coral: #f47d68;
      --teal: #2aa7a0;
      --gold: #f5bd4b;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      background: #17253c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .scene {
      width: min(100vw, 1100px);
      aspect-ratio: 3 / 2;
      max-height: 100vh;
      overflow: hidden;
      border-radius: 22px;
      box-shadow: 0 28px 80px rgba(3, 12, 28, .45);
      background: #f8ae75;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cloud {
      animation: cloud-drift 24s linear infinite;
    }

    .cloud--slow {
      animation-duration: 34s;
      animation-delay: -13s;
    }

    .cloud--fast {
      animation-duration: 19s;
      animation-delay: -7s;
    }

    .road-mark {
      animation: road-flow 2.6s linear infinite;
    }

    .bike-and-pelican {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: ride-bob .52s ease-in-out infinite alternate;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin .85s linear infinite;
    }

    .pedal-crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin .85s linear infinite;
    }

    .leg--back {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: back-leg .85s ease-in-out infinite;
    }

    .leg--front {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: front-leg .85s ease-in-out infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 78% 78%;
      animation: wing-flutter 1.3s ease-in-out infinite;
    }

    .head {
      transform-box: fill-box;
      transform-origin: 55% 90%;
      animation: head-bob .52s ease-in-out infinite alternate;
    }

    .small-spark {
      animation: sparkle 2.8s ease-in-out infinite;
    }

    .small-spark:nth-of-type(2) { animation-delay: -1s; }
    .small-spark:nth-of-type(3) { animation-delay: -2s; }

    @keyframes cloud-drift {
      from { transform: translateX(-170px); }
      to { transform: translateX(1050px); }
    }

    @keyframes road-flow {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }

    @keyframes ride-bob {
      from { transform: translateY(0); }
      to { transform: translateY(5px); }
    }

    @keyframes wheel-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes back-leg {
      0%, 100% { transform: rotate(30deg); }
      50% { transform: rotate(-30deg); }
    }

    @keyframes front-leg {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(30deg); }
    }

    @keyframes wing-flutter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg) translateY(-2px); }
    }

    @keyframes head-bob {
      from { transform: rotate(-1deg); }
      to { transform: rotate(2deg); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: .25; transform: scale(.7); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="A pelican riding a bicycle through a sunset landscape">
    <svg viewBox="0 0 960 640" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
      <title id="title">Pelican Ride</title>
      <desc id="description">A cheerful pelican pedals a bicycle along a seaside road at sunset.</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5878bb"/>
          <stop offset=".56" stop-color="#ec9e91"/>
          <stop offset="1" stop-color="#f7c37c"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4babb2"/>
          <stop offset="1" stop-color="#1d7187"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4c526d"/>
          <stop offset="1" stop-color="#2f354e"/>
        </linearGradient>
        <radialGradient id="sun-glow">
          <stop offset="0" stop-color="#fff8c5" stop-opacity=".85"/>
          <stop offset=".55" stop-color="#ffd979" stop-opacity=".34"/>
          <stop offset="1" stop-color="#ffd979" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
          <feOffset dy="10"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope=".25"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <clipPath id="scene-clip">
          <rect width="960" height="640" rx="22"/>
        </clipPath>
      </defs>

      <g clip-path="url(#scene-clip)">
        <rect width="960" height="640" fill="url(#sky)"/>
        <circle cx="721" cy="173" r="194" fill="url(#sun-glow)"/>
        <circle cx="721" cy="173" r="58" fill="#ffe49a" opacity=".95"/>

        <g class="cloud cloud--slow" fill="#fff5e0" opacity=".52">
          <path d="M-110 170 C-85 141 -45 142 -28 163 C-2 121 61 124 77 171 C112 161 145 182 145 209 H-110Z"/>
        </g>
        <g class="cloud cloud--fast" fill="#fff8e9" opacity=".4">
          <path d="M-120 278 C-93 242 -43 248 -28 275 C-4 225 65 228 84 278 C119 267 159 292 159 321 H-120Z"/>
        </g>
        <g class="cloud" fill="#fff8e9" opacity=".35">
          <path d="M775 88 C795 59 833 61 850 84 C875 40 935 47 949 89 C986 80 1012 103 1012 126 H775Z"/>
        </g>

        <path d="M0 365 C102 326 165 351 252 375 C337 398 406 381 495 350 C583 319 651 314 729 348 C814 385 880 365 960 338 V520 H0Z" fill="#385d75" opacity=".9"/>
        <path d="M0 411 C109 384 179 417 269 432 C377 450 452 397 544 384 C637 371 704 424 790 421 C852 419 909 395 960 389 V527 H0Z" fill="#2d586c"/>

        <path d="M0 422 C120 412 203 447 302 460 C404 473 475 445 564 434 C668 421 722 470 815 462 C881 456 923 442 960 444 V531 H0Z" fill="url(#water)"/>
        <g fill="none" stroke="#b2e1d0" stroke-linecap="round" opacity=".55">
          <path d="M61 461h95 M197 486h142 M740 474h103 M802 502h75 M345 443h74" stroke-width="4"/>
          <path d="M20 492h66 M475 478h128 M640 501h83" stroke-width="3"/>
        </g>

        <path d="M0 502 C183 484 328 504 478 496 C657 486 805 474 960 490 V640 H0Z" fill="url(#road)"/>
        <path d="M0 518 C174 500 335 520 485 512 C651 502 810 490 960 505" fill="none" stroke="#78809a" stroke-width="4" opacity=".45"/>
        <g class="road-mark" fill="#e8c77a" opacity=".9">
          <path d="M-45 566 h110 l-8 10 H-52Z"/>
          <path d="M194 558 h110 l-7 10 H187Z"/>
          <path d="M433 550 h110 l-6 10 H427Z"/>
          <path d="M672 543 h110 l-5 10 H667Z"/>
          <path d="M911 536 h110 l-4 10 H907Z"/>
        </g>

        <g class="small-spark" fill="#fff4b0">
          <path d="M122 156 l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
        </g>
        <g class="small-spark" fill="#fff4b0">
          <path d="M856 259 l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
        </g>
        <g class="small-spark" fill="#fff4b0">
          <path d="M265 206 l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
        </g>

        <g class="bike-and-pelican" filter="url(#soft-shadow)">
          <ellipse cx="482" cy="568" rx="210" ry="19" fill="#1e2941" opacity=".4"/>

          <!-- Bicycle wheels -->
          <g class="wheel" stroke="#e8e1d5" stroke-width="5" fill="none">
            <circle cx="345" cy="500" r="67" stroke="#182437" stroke-width="10"/>
            <circle cx="345" cy="500" r="58" stroke="#d7d5cf" stroke-width="3"/>
            <path d="M345 442v116 M287 500h116 M304 459l82 82 M386 459l-82 82" stroke="#d7d5cf" stroke-width="2" opacity=".9"/>
          </g>
          <g class="wheel" stroke="#e8e1d5" stroke-width="5" fill="none">
            <circle cx="622" cy="500" r="67" stroke="#182437" stroke-width="10"/>
            <circle cx="622" cy="500" r="58" stroke="#d7d5cf" stroke-width="3"/>
            <path d="M622 442v116 M564 500h116 M581 459l82 82 M663 459l-82 82" stroke="#d7d5cf" stroke-width="2" opacity=".9"/>
          </g>

          <!-- Bicycle frame and fork -->
          <g fill="none" stroke="#f47d68" stroke-linecap="round" stroke-linejoin="round">
            <path d="M345 500 L423 424 L520 500 L345 500 L476 500 L423 424" stroke-width="10"/>
            <path d="M520 500 L553 405 L622 500" stroke-width="8"/>
            <path d="M553 405 L579 392" stroke-width="8"/>
            <path d="M568 386 q24 -4 40 8" stroke="#182437" stroke-width="7"/>
            <path d="M407 422 L391 402" stroke="#182437" stroke-width="8"/>
            <path d="M376 399 h38" stroke="#182437" stroke-width="8"/>
          </g>
          <circle cx="423" cy="424" r="8" fill="#f7c34e"/>
          <circle cx="476" cy="500" r="10" fill="#182437"/>

          <!-- Pelican legs -->
          <g fill="none" stroke="#f0a044" stroke-width="10" stroke-linecap="round">
            <path class="leg--back" d="M447 383 L466 468 L476 500"/>
            <path class="leg--front" d="M483 381 L458 455 L476 500"/>
          </g>
          <g fill="none" stroke="#f8c364" stroke-width="6" stroke-linecap="round">
            <path d="M467 500 q-17 9 -27 1"/>
            <path d="M476 500 q16 10 27 2"/>
          </g>

          <!-- Pelican body -->
          <path d="M382 303 C383 260 421 228 469 234 C512 239 539 276 530 321 C522 360 493 391 451 392 C408 392 379 359 382 303Z" fill="#fff8e5" stroke="#182437" stroke-width="7"/>
          <path d="M411 292 C432 272 472 272 503 287 C515 309 511 337 493 358 C470 376 438 373 418 355 C406 336 403 310 411 292Z" fill="#f3e7cb"/>
          <path d="M400 323 C427 343 464 348 505 329" fill="none" stroke="#e1cbaa" stroke-width="5" opacity=".8"/>

          <!-- Back wing -->
          <path d="M472 279 C519 263 554 277 568 305 C541 306 520 318 499 341 C484 327 475 306 472 279Z" fill="#e6d6b6" stroke="#182437" stroke-width="7"/>
          <path d="M500 293 q28 4 49 10 M498 305 q24 5 42 13 M495 318 q18 6 30 14" fill="none" stroke="#c6af8c" stroke-width="4" stroke-linecap="round"/>

          <!-- Front wing -->
          <path class="wing" d="M410 280 C371 286 349 314 356 348 C363 372 391 379 416 365 C436 353 445 331 443 302Z" fill="#fff5dc" stroke="#182437" stroke-width="7"/>
          <path d="M405 296 C389 314 383 337 388 359 M418 302 C405 323 402 344 407 360" fill="none" stroke="#dbc9a8" stroke-width="4" stroke-linecap="round"/>

          <!-- Pelican head and bill -->
          <g class="head">
            <path d="M410 252 C397 221 407 183 439 166 C471 149 510 160 527 190 C542 218 528 254 501 269 C469 286 424 275 410 252Z" fill="#fff9e9" stroke="#182437" stroke-width="7"/>
            <path d="M450 164 C470 151 497 157 514 174 C493 177 476 189 464 205 C451 194 446 180 450 164Z" fill="#f6ecd6"/>
            <path d="M509 218 C553 216 608 229 645 252 C658 260 650 274 633 276 L503 262 C494 251 495 231 509 218Z" fill="#efad58" stroke="#182437" stroke-width="7"/>
            <path d="M511 248 C545 251 592 257 634 266" fill="none" stroke="#d8844b" stroke-width="5" stroke-linecap="round"/>
            <path d="M509 218 C531 219 546 223 564 230" fill="none" stroke="#f8ca70" stroke-width="8" stroke-linecap="round"/>
            <circle cx="485" cy="207" r="12" fill="#182437"/>
            <circle cx="489" cy="203" r="4" fill="#fff8e6"/>
            <path d="M454 190 q13 -11 27 -2" fill="none" stroke="#d7c39f" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- Crank and pedal -->
          <g class="pedal-crank">
            <circle cx="476" cy="500" r="16" fill="#f7c34e" stroke="#182437" stroke-width="5"/>
            <path d="M476 500 l-20 -22 M456 478 h-19 M476 500 l22 20 M498 520 h18" fill="none" stroke="#182437" stroke-width="6" stroke-linecap="round"/>
          </g>

          <!-- Bell -->
          <path d="M567 393 q12 -14 25 0 v12 h-25Z" fill="#f7c34e" stroke="#182437" stroke-width="4"/>
          <circle cx="579" cy="407" r="3" fill="#182437"/>
        </g>

        <g transform="translate(47 548)" fill="#fff5da" opacity=".8">
          <circle cx="0" cy="0" r="3"/><circle cx="13" cy="0" r="3"/><circle cx="26" cy="0" r="3"/><circle cx="39" cy="0" r="3"/>
        </g>
        <text x="48" y="585" fill="#fff5da" opacity=".75" font-size="13" letter-spacing="3">KEEP MOVING</text>
      </g>
    </svg>
  </main>
</body>
</html>
