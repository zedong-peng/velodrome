<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1100px 620px at 50% -8%,#eaf5ff,#c8dcf1 55%,#aec6e0);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#2f4358;

  .card{
    width:min(980px,100%);background:#fff;border-radius:22px;overflow:hidden;
    box-shadow:0 24px 60px rgba(31,58,89,.22),0 3px 10px rgba(31,58,89,.12);
  }
  .bar{display:flex;align-items:center;gap:12px;padding:16px 22px 14px}
  .bar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.4px}
  .bar .hint{margin-left:auto;font-size:12.5px;color:#93a7bb}
  svg{display:block;width:100%;height:auto;cursor:pointer;user-select:none}

  /* 无缝滚动 —— 所有“贴地”元素速度统一为 150px/秒，轮子转速也按此换算 */
  #hillsFar {animation:slide800 40s  linear infinite}
  #hillsNear{animation:slide800 20s  linear infinite}
  #trees    {animation:slide800 5.333s linear infinite}
  #dashes   {animation:slide120 .8s  linear infinite}
  #clouds   {animation:slide700 16s  linear infinite}
  @keyframes slide800{from{transform:translateX(0)}   to{transform:translateX(-800px)}}
  @keyframes slide120{from{transform:translateX(0)}   to{transform:translateX(-120px)}}
  @keyframes slide700{from{transform:translateX(0)}   to{transform:translateX(-700px)}}
  #scene.paused *{animation-play-state:paused}
</style>
</head>

<script>
(function () {
  const svg = document.getElementById('scene');

  /* ---------- 自行车几何（与 SVG 中的坐标一致） ---------- */
  const C  = { x: 360, y: 388 };   // 中轴（曲柄中心）
  const R  = 20;                   // 曲柄长度
  const HIP_NEAR = { x: 360, y: 292 };
  const HIP_FAR  = { x: 350, y: 295 };
  const L1 = 59, L2 = 60;          // 大腿 / 小腿
  const T  = 1100;                 // 踏一圈的毫秒数（≈55 转/分）

  const el = {
    rig:       document.getElementById('rig'),
    crankNear: document.getElementById('crankNear'),
    crankFar:  document.getElementById('crankFar'),
    footNear:  document.getElementById('footNear'),
    footFar:   document.getElementById('footFar'),
    legNear:   document.getElementById('legNear'),
    legFar:    document.getElementById('legFar')
  };

  /* 两段式反向运动学：已知髋、脚，求膝盖。
     膝盖向后弯（像鸟腿），这与骑车的踏频配合起来最自然。 */
  function legPath(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d  = Math.hypot(dx, dy);
    const reach = L1 + L2 - 0.01;
    if (d > reach) { dx *= reach / d; dy *= reach / d; d = reach; }  // 够不到就夹紧
    const ux = dx / d, uy = dy / d;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);   // 膝盖在髋-脚连线上的投影
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a)); // 垂距
    const kx = hip.x + a * ux - h * uy;
    const ky = hip.y + a * uy + h * ux;
    return 'M' + hip.x + ',' + hip.y +
           ' L' + kx.toFixed(1) + ',' + ky.toFixed(1) +
           ' L' + (hip.x + dx).toFixed(1) + ',' + (hip.y + dy).toFixed(1);
  }

  let phase = 0, last = null, running = true;

  function frame(t) {
    if (last === null) last = t;
    const dt = Math.min(t - last, 64);
    last = t;
    if (running) phase = (phase + dt) % T;

    const a   = phase / T * Math.PI * 2;   // 曲柄角（弧度）
    const deg = a * 180 / Math.PI;

    // 两个脚踏（相隔 180°）
    const pedalNear = { x: C.x - R * Math.sin(a), y: C.y + R * Math.cos(a) };
    const pedalFar  = { x: C.x + R * Math.sin(a), y: C.y - R * Math.cos(a) };

    el.crankNear.setAttribute('transform', 'rotate(' + deg + ' ' + C.x + ' ' + C.y + ')');
    el.crankFar.setAttribute('transform',  'rotate(' + deg + ' ' + C.x + ' ' + C.y + ')');

    // 脚踏反向自转 → 脚掌始终水平，像真的在踩
    el.footNear.setAttribute('transform', 'translate(' + pedalNear.x.toFixed(2) + ',' + pedalNear.y.toFixed(2) + ') rotate(' + (-deg) + ')');
    el.footFar.setAttribute('transform',  'translate(' + pedalFar.x.toFixed(2)  + ',' + pedalFar.y.toFixed(2)  + ') rotate(' + (-deg) + ')');

    el.legNear.setAttribute('d', legPath(HIP_NEAR, pedalNear));
    el.legFar.setAttribute('d',  legPath(HIP_FAR,  pedalFar));

    // 每半圈一次上下颠簸
    el.rig.setAttribute('transform', 'translate(0 ' + (-1.2 * Math.abs(Math.sin(a))).toFixed(2) + ')');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 点击暂停 / 继续 ---------- */
  svg.addEventListener('click', function () {
    running = !running;
    svg.classList.toggle('paused', !running);
    if (running) { svg.unpauseAnimations(); } else { svg.pauseAnimations(); }
  });
})();
</script>
</body>
</html>
