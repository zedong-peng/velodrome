<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - Pelican Bike Ride</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: #c8eaf5;
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    overflow-x:hidden;
  }
  h1{
    margin:18px 0 10px;
    font-size:22px;
    letter-spacing:2px;
    color:#2b2d42;
    text-shadow:0 1px 0 #fff;
  }
  .sub{
    font-size:13px;color:#5a6a7a;margin-bottom:14px;letter-spacing:1px;
  }
  .stage{
    width:min(920px,96vw);
    background:#fff;
    border-radius:18px;
    box-shadow:0 18px 40px rgba(0,0,0,0.15),0 2px 8px rgba(0,0,0,0.08);
    padding:10px;
  }
  svg{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
    background:transparent;
  }
  /* 动画 */
  .wheel{
    animation: wheelRotate 0.7s linear infinite;
    transform-origin:center;
    transform-box:fill-box;
  }
  @keyframes wheelRotate{
    to{transform:rotate(360deg)}
  }
  .crank{
    animation: pedalRotate 0.7s linear infinite;
    transform-origin:355px 375px;
  }
  @keyframes pedalRotate{
    to{transform:rotate(360deg)}
  }
  .pelican-bob{
    animation: bob 0.7s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(2.5px)}
  }
  .wing{
    animation: wingFlap 0.35s ease-in-out infinite alternate;
    transform-origin:310px 305px;
    transform-box:fill-box;
  }
  @keyframes wingFlap{
    0%{transform:rotate(-3deg)}
    100%{transform:rotate(6deg)}
  }
  .pouch{
    animation: pouchWobble 0.7s ease-in-out infinite;
    transform-origin:410px 265px;
  }
  @keyframes pouchWobble{
    0%,100%{transform:scaleY(1)}
    50%{transform:scaleY(1.06) scaleX(0.98)}
  }
  .cloud{
    animation: cloudDrift linear infinite;
  }
  .cloud.c1{animation-duration:22s}
  .cloud.c2{animation-duration:31s}
  .cloud.c3{animation-duration:18s}
  @keyframes cloudDrift{
    from{transform:translateX(0)}
    to{transform:translateX(-200px)}
  }
  .road-dash{
    animation: dashMove 0.6s linear infinite;
  }
  @keyframes dashMove{
    to{transform:translateX(-40px)}
  }
  .tail{
    animation: tailWag 0.4s ease-in-out infinite alternate;
    transform-origin:270px 315px;
  }
  @keyframes tailWag{
    to{transform:rotate(12deg)}
  }
  .head-bob{
    animation: headBob 0.7s ease-in-out infinite;
  }
  @keyframes headBob{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(1px) rotate(1deg)}
    75%{transform:translateY(-1px) rotate(-1deg)}
  }
  .eye-lid{
    animation: blink 4.5s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    94%{transform:scaleY(0.1)}
    96%{transform:scaleY(1)}
  }
</style>
</head>
<body>

<p style="margin-top:14px;font-size:12px;color:#6b7280;text-align:center;max-width:640px;line-height:1.7">
  鹈鹕的大嘴随骑行轻微晃动，脚蹼紧踩踏板，车轮与链条同步转动。画面所有元素均为 SVG 矢量绘制。<br>
  按 <kbd style="background:#fff;padding:2px 6px;border-radius:4px;border:1px solid #ddd;box-shadow:0 1px 0 #ccc">空格</kbd> 暂停 / 继续 · 鼠标悬停有惊喜
</p>

<script>
// 腿部跟随踏板 - 纯离线 JS 计算
(function(){
  const crankCX = 355, crankCY = 375, crankR = 30;
  const hipX = 335, hipY = 340;
  const legL = document.getElementById('legL');
  const legR = document.getElementById('legR');
  const footL = document.getElementById('footL');
  const footR = document.getElementById('footR');
  let t0 = performance.now();
  let paused = false;
  let pauseTime = 0;
  let animId;

  function frame(now){
    if(paused){ animId = requestAnimationFrame(frame); return; }
    const elapsed = (now - t0)/1000; // 秒
    const period = 0.7; // 与CSS一致
    const angle = (elapsed % period)/period * Math.PI * 2; // 0-2PI

    // 左脚 角度0, 右脚 + PI
    const aL = angle;
    const aR = angle + Math.PI;

    const pedLX = crankCX + Math.cos(aL) * crankR;
    const pedLY = crankCY + Math.sin(aL) * crankR;
    const pedRX = crankCX + Math.cos(aR) * crankR;
    const pedRY = crankCY + Math.sin(aR) * crankR;

    // 更新腿线
    if(legL){
      legL.setAttribute('x2', pedLX);
      legL.setAttribute('y2', pedLY);
    }
    if(legR){
      legR.setAttribute('x2', pedRX);
      legR.setAttribute('y2', pedRY);
    }
    if(footL){
      footL.setAttribute('transform', `translate(${pedLX-355},${pedLY-345})`);
    }
    if(footR){
      footR.setAttribute('transform', `translate(${pedRX-355},${pedRY-405})`);
    }

    animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);

  // 空格暂停
  window.addEventListener('keydown', (e)=>{
    if(e.code==='Space'){
      e.preventDefault();
      paused = !paused;
      document.querySelectorAll('.wheel,.crank,.pelican-bob,.wing,.pouch,.road-dash,.cloud').forEach(el=>{
        el.style.animationPlayState = paused ? 'paused' : 'running';
      });
      // SMIL 暂停
      document.querySelectorAll('animate,animateTransform').forEach(a=>{
        try{ paused ? a.endElement() : a.beginElement(); }catch(_){}
      });
      // SVG SMIL pause/unpause
      const svg = document.querySelector('svg');
      if(svg){
        try{ paused ? svg.pauseAnimations() : svg.unpauseAnimations(); }catch(_){}
      }
    }
  });

  // 悬停鹈鹕加速翅膀
  const pelican = document.getElementById('pelicanGroup');
  if(pelican){
    pelican.addEventListener('mouseenter', ()=>{
      document.querySelectorAll('.wing').forEach(w=> w.style.animationDuration='0.12s');
      document.querySelector('.pouch') && (document.querySelector('.pouch').style.animationDuration='0.25s');
    });
    pelican.addEventListener('mouseleave', ()=>{
      document.querySelectorAll('.wing').forEach(w=> w.style.animationDuration='0.35s');
      document.querySelector('.pouch') && (document.querySelector('.pouch').style.animationDuration='0.7s');
    });
  }

  // 点击车铃抖动
  const bell = document.querySelector('circle[cx="514"]');
  if(bell){
    bell.style.cursor='pointer';
    bell.addEventListener('click', ()=>{
      bell.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:220, easing:'ease-out'});
      // 触发气泡文字变化
      const t = document.querySelector('#bubble text');
      if(t){
        const orig = t.textContent;
        t.textContent = '叮铃铃～♪';
        setTimeout(()=> t.textContent=orig, 900);
      }
    });
  }
})();
</script>
