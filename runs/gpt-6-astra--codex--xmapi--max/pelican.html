<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5f4f3">
  <title>鹈鹕骑行记</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263f45;
      --muted: #607d80;
      --paper: #e5f4f3;
      --accent: #d65c49;
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100svh;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      width: min(100%, 1440px);
      padding: 32px 48px 12px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 1;
    }
    .identity { display: flex; align-items: center; gap: 13px; }
    .mark { width: 44px; height: 44px; flex: 0 0 44px; }
    h1 { margin: 0; font-size: 23px; line-height: 1.4; font-weight: 650; }
    .edition { margin-top: 3px; font-size: 10px; color: var(--muted); }
    .route { display: flex; align-items: center; gap: 9px; font-size: 12px; }
    .route svg { width: 25px; height: 25px; }
    main { display: grid; align-items: center; flex: 1; min-height: 0; }
    .scene {
      width: 100%;
      height: min(70svh, 780px);
      min-height: 420px;
      display: block;
      overflow: visible;
    }
    .scene .outlined { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .scene .round { stroke-linejoin: round; stroke-linecap: round; }
    .scene .fine { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; }
    footer {
      width: min(100%, 1344px);
      margin: 0 auto;
      padding: 12px 48px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 1;
    }
    .trip { display: flex; align-items: center; gap: 12px; }
    .trip-line { display: block; width: 32px; height: 2px; background: var(--accent); }
    .trip-title { font-size: 13px; }
    .trip-detail { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .controls { display: flex; gap: 12px; align-items: center; }
    .icon-button {
      position: relative;
      width: 44px;
      height: 44px;
      padding: 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid #263f4526;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }
    .icon-button:hover { background: #ffffff85; }
    .icon-button:active { transform: scale(.94); }
    .icon-button.primary { background: var(--ink); border-color: var(--ink); color: white; }
    .icon-button.primary:hover { background: #3a5960; }
    .icon-button svg { display: block; width: 18px; height: 18px; }
    .icon-button::after {
      content: attr(aria-label);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 9px;
      border-radius: 4px;
      background: var(--ink);
      color: white;
      white-space: nowrap;
      font-size: 11px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms;
    }
    .icon-button:hover::after, .icon-button:focus-visible::after { opacity: 1; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .speed { display: flex; align-items: center; gap: 11px; padding-left: 14px; border-left: 1px solid #263f4526; }
    .speed label { font-size: 12px; color: var(--muted); }
    .speed input { width: 100px; height: 28px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .speed output { width: 36px; font-variant-numeric: tabular-nums; font-size: 12px; }
    [hidden] { display: none !important; }
    @media (min-width: 1600px) { .scene { height: min(73svh, 950px); } }
    @media (max-width: 640px) {
      header { padding: 25px 24px 8px; gap: 12px; }
      h1 { font-size: 20px; }
      .edition { font-size: 9px; }
      .mark { width: 38px; height: 38px; flex-basis: 38px; }
      .route { font-size: 11px; gap: 5px; }
      .route svg { width: 20px; height: 20px; }
      .scene { min-height: 360px; height: 62svh; }
      footer { flex-direction: column; padding: 8px 20px 24px; gap: 22px; }
      .trip { align-self: flex-start; margin-left: 4px; }
      .trip-detail { display: none; }
      .controls { gap: 10px; }
      .speed { gap: 9px; padding-left: 12px; }
      .speed input { width: 88px; }
    }
    @media (max-width: 360px) {
      header { padding-inline: 18px; }
      .identity { gap: 9px; }
      .route span { display: none; }
      .speed input { width: 66px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { transition: none !important; }
    }
  </style>
</head>

        </button>
        <button class="icon-button" id="restart" type="button" aria-label="重新开始">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>
        </button>
        <div class="speed">
          <label for="speed">速度</label>
          <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速">
          <output id="speed-value" for="speed">1.0×</output>
        </div>
      </div>
    </footer>
  </div>
  <script>
    (() => {
      'use strict';

      const el = id => document.getElementById(id);
      const scene = el('scene');
      const toggle = el('toggle');
      const speed = el('speed');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const mobile = window.matchMedia('(max-width: 640px)');
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'chainring', 'pelican', 'scarf-tail',
        'cloud-a', 'cloud-b', 'cloud-c', 'gulls', 'breeze', 'shadow',
        'sea-lines', 'road-marks', 'verge', 'roadside'
      ].map(id => [id, el(id)]));
      const legs = Object.fromEntries(['near', 'far'].map(side => [side,
        Object.fromEntries(['thigh-outline', 'thigh', 'shin-outline', 'shin', 'foot', 'crank', 'pedal']
          .map(part => [part, el(`${side}-${part}`)]))
      ]));
      const crankShine = el('near-crank-shine');
      let running = !reducedMotion.matches;
      let rate = Number(speed.value);
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;
      const TAU = Math.PI * 2;
      const crank = { x: 573, y: 540, radius: 36 };

      function fitScene() {
        scene.setAttribute('viewBox', mobile.matches ? '230 125 710 620' : '0 0 1200 760');
      }

      function setPath(node, start, end) {
        node.setAttribute('d', `M${start.x.toFixed(2)} ${start.y.toFixed(2)}L${end.x.toFixed(2)} ${end.y.toFixed(2)}`);
      }

      function drift(initialX, velocity) {
        return 1800 - ((1800 - initialX + elapsed * velocity) % 2400);
      }

      // Two-link inverse kinematics keeps both webbed feet on their pedals.
      function drawLeg(side, angle, bob) {
        const nodes = legs[side];
        const hip = { x: side === 'near' ? 548 : 562, y: 397 + bob };
        const foot = {
          x: crank.x + Math.cos(angle) * crank.radius,
          y: crank.y + Math.sin(angle) * crank.radius
        };
        const thighLength = 93;
        const shinLength = 98;
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (thighLength ** 2 - shinLength ** 2 + distance ** 2) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thighLength ** 2 - along ** 2));
        const knee = {
          x: hip.x + along * dx / distance + bend * dy / distance,
          y: hip.y + along * dy / distance - bend * dx / distance
        };
        setPath(nodes['thigh-outline'], hip, knee);
        setPath(nodes.thigh, hip, knee);
        setPath(nodes['shin-outline'], knee, foot);
        setPath(nodes.shin, knee, foot);
        setPath(nodes.crank, crank, foot);
        if (side === 'near') setPath(crankShine, crank, foot);
        nodes.foot.setAttribute('transform', `translate(${foot.x} ${foot.y - 3})`);
        nodes.pedal.setAttribute('transform', `translate(${foot.x} ${foot.y})`);
      }

      function render() {
        const angle = elapsed * TAU * .72 + .45;
        const bob = Math.sin(angle * 2) * 1.6;
        const distance = elapsed * 150;
        const wheelDegrees = distance / 98.5 * 180 / Math.PI;
        parts['rear-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
        parts.chainring.setAttribute('transform', `rotate(${angle * 180 / Math.PI % 360} 573 540)`);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(elapsed * 7) * 3.5} 602 301)`);
        drawLeg('far', angle + Math.PI, bob);
        drawLeg('near', angle, bob);
        parts['road-marks'].setAttribute('patternTransform', `translate(${-distance % 220} 0)`);
        parts.verge.setAttribute('patternTransform', `translate(${-distance % 460} 0)`);
        parts['sea-lines'].setAttribute('patternTransform', `translate(${-distance * .15 % 310} 0)`);
        parts['cloud-a'].setAttribute('transform', `translate(${drift(143, 8) - 143} 0)`);
        parts['cloud-b'].setAttribute('transform', `translate(${drift(747, 5) - 747} 0)`);
        parts['cloud-c'].setAttribute('transform', `translate(${drift(1050, 10) - 1050} 0)`);
        parts.gulls.setAttribute('transform', `translate(${drift(863, 11) - 863} ${Math.sin(elapsed * 1.5) * 5})`);
        parts.roadside.setAttribute('transform', `translate(${drift(1080, 150)} 0)`);
        parts.breeze.setAttribute('opacity', String(.35 + Math.sin(elapsed * 3) * .18));
        parts.breeze.setAttribute('transform', `translate(${-Math.sin(elapsed * 3) * 6} 0)`);
        parts.shadow.setAttribute('rx', String(269 - bob * 2));
      }

      function updateControls() {
        toggle.setAttribute('aria-label', running ? '暂停' : '继续播放');
        toggle.setAttribute('aria-pressed', String(!running));
        el('pause-icon').toggleAttribute('hidden', !running);
        el('play-icon').toggleAttribute('hidden', running);
      }

      function tick(timestamp) {
        frameId = null;
        if (!running || document.hidden) return;
        if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .05) * rate;
        previousTime = timestamp;
        render();
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        previousTime = null;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        updateControls();
        if (running && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      toggle.addEventListener('click', () => {
        running = !running;
        syncPlayback();
      });
      el('restart').addEventListener('click', () => {
        elapsed = 0;
        previousTime = null;
        render();
      });
      speed.addEventListener('input', () => {
        rate = Number(speed.value);
        el('speed-value').value = `${Number.isInteger(rate) ? rate.toFixed(1) : rate}×`;
        speed.setAttribute('aria-valuetext', `${rate} 倍速`);
      });
      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', () => {
        running = !reducedMotion.matches;
        syncPlayback();
      });
      mobile.addEventListener('change', fitScene);

      fitScene();
      render();
      syncPlayback();
    })();
  </script>
</body>
</html>
