<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root {
    --sky-top: #6fc3f0;
    --sky-bot: #e6f7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #2b4a63 0%, #14232f 70%, #0c151d 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .frame {
    width: min(100%, 1000px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 26px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    background: #9fdcf7;
  }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    position: absolute;
    left: 0; right: 0;
    bottom: -30px;
    text-align: center;
    color: rgba(255,255,255,.55);
    font-size: 13px;
    letter-spacing: .12em;
  }
  .wrap { position: relative; }

  /* 链条滚动 */
  .chain { stroke-dasharray: 7 5; animation: chainMove .45s linear infinite; }
  @keyframes chainMove { to { stroke-dashoffset: -24; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一只鹈鹕骑自行车的二维动画" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5cb8ec"/>
          <stop offset="55%"  stop-color="#a9e2f8"/>
          <stop offset="100%" stop-color="#eaf9ff"/>
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#fff6c9" stop-opacity=".95"/>
          <stop offset="55%"  stop-color="#ffe680" stop-opacity=".45"/>
          <stop offset="100%" stop-color="#ffe680" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#6b7482"/>
          <stop offset="100%" stop-color="#4d5561"/>
        </linearGradient>

        <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#8ecf72"/>
          <stop offset="100%" stop-color="#63b25c"/>
        </linearGradient>

        <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#1d2a35" stop-opacity=".45"/>
          <stop offset="100%" stop-color="#1d2a35" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#fbd889"/>
          <stop offset="100%" stop-color="#f0b95c"/>
        </linearGradient>

        <!-- 云朵 -->
        <g id="cloud">
          <ellipse cx="0" cy="0" rx="34" ry="18"/>
          <ellipse cx="-24" cy="6" rx="22" ry="13"/>
          <ellipse cx="26" cy="7" rx="20" ry="12"/>
          <ellipse cx="6" cy="-13" rx="19" ry="14"/>
        </g>

        <!-- 远景山丘（0..800） -->
        <g id="tHills">
          <path d="M0 330 Q100 250 200 320 Q320 230 430 310 Q560 240 660 300 Q740 262 800 330 L800 400 L0 400 Z" fill="#a9c9e6"/>
        </g>

        <!-- 中景山丘 -->
        <g id="tHills2">
          <path d="M0 358 Q120 318 240 348 Q380 300 520 342 Q660 312 800 358 L800 400 L0 400 Z" fill="#7fb6d6"/>
        </g>

        <!-- 树 -->
        <g id="tTree">
          <rect x="-4" y="-26" width="8" height="30" rx="3" fill="#8a6242"/>
          <circle cx="0" cy="-38" r="20" fill="#4f9e5c"/>
          <circle cx="-14" cy="-30" r="14" fill="#5aae66"/>
          <circle cx="13" cy="-31" r="15" fill="#469255"/>
        </g>

        <!-- 近景草丛与灌木 -->
        <g id="tBush">
          <ellipse cx="0" cy="0" rx="26" ry="13" fill="#4f9d55"/>
          <ellipse cx="-14" cy="-4" rx="15" ry="10" fill="#5bad60"/>
          <ellipse cx="15" cy="-3" rx="16" ry="11" fill="#469255"/>
        </g>
        <g id="tTuft" fill="none" stroke="#3f8f4c" stroke-width="3" stroke-linecap="round">
          <path d="M0 0 Q-3 -12 -8 -18"/>
          <path d="M0 0 Q1 -14 3 -22"/>
          <path d="M0 0 Q6 -10 11 -15"/>
        </g>

        <!-- 路面虚线 -->
        <g id="tDash">
          <rect x="0" y="404" width="56" height="11" rx="5.5" fill="#f6f1df" opacity=".9"/>
        </g>

        <!-- 车轮辐条 -->
        <g id="tSpokes" stroke="#c3ccd8" stroke-width="3" stroke-linecap="round">
          <line x1="-52" y1="0" x2="52" y2="0"/>
          <line x1="-36.8" y1="-36.8" x2="36.8" y2="36.8"/>
          <line x1="0" y1="-52" x2="0" y2="52"/>
          <line x1="-36.8" y1="36.8" x2="36.8" y2="-36.8"/>
        </g>
      </defs>

      <!-- ================= 背景 ================= -->
      <rect x="0" y="0" width="800" height="450" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g>
        <circle cx="676" cy="86" r="78" fill="url(#sunGlow)"/>
        <circle cx="676" cy="86" r="30" fill="#fff3b8"/>
        <circle cx="676" cy="86" r="30" fill="none" stroke="#ffe27a" stroke-width="3"/>
        <g stroke="#ffe27a" stroke-width="4" stroke-linecap="round" opacity=".75">
          <animateTransform attributeName="transform" type="rotate" from="0 676 86" to="360 676 86" dur="40s" repeatCount="indefinite"/>
          <line x1="676" y1="34" x2="676" y2="46"/>
          <line x1="676" y1="126" x2="676" y2="138"/>
          <line x1="624" y1="86" x2="636" y2="86"/>
          <line x1="716" y1="86" x2="728" y2="86"/>
          <line x1="640" y1="50" x2="648" y2="58"/>
          <line x1="704" y1="114" x2="712" y2="122"/>
          <line x1="640" y1="122" x2="648" y2="114"/>
          <line x1="704" y1="58" x2="712" y2="50"/>
        </g>
      </g>

      <!-- 云 -->
      <g fill="#ffffff" opacity=".92">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;-1700 0" dur="62s" repeatCount="indefinite"/>
          <g transform="translate(120 92) scale(1.1)"><use xlink:href="#cloud" href="#cloud"/></g>
          <g transform="translate(420 60) scale(.8)"><use xlink:href="#cloud" href="#cloud"/></g>
          <g transform="translate(700 120) scale(1.25)"><use xlink:href="#cloud" href="#cloud"/></g>
          <g transform="translate(1030 86) scale(.95)"><use xlink:href="#cloud" href="#cloud"/></g>
          <g transform="translate(1330 130) scale(1.1)"><use xlink:href="#cloud" href="#cloud"/></g>
          <g transform="translate(1600 70) scale(.75)"><use xlink:href="#cloud" href="#cloud"/></g>
        </g>
      </g>

      <!-- 飞鸟 -->
      <g fill="none" stroke="#5b7f9c" stroke-width="2.4" stroke-linecap="round" opacity=".65">
        <g>
          <animateTransform attributeName="transform" type="translate" values="-60 118; 900 74" dur="16s" repeatCount="indefinite"/>
          <path d="M0 0 q8 -8 16 0 q8 -8 16 0"/>
          <path d="M34 8 q6 -6 12 0 q6 -6 12 0"/>
        </g>
      </g>

      <!-- 远山 -->
      <g opacity=".85">
        <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="11s" repeatCount="indefinite"/>
        <use xlink:href="#tHills" href="#tHills" x="0"/>
        <use xlink:href="#tHills" href="#tHills" x="800"/>
      </g>

      <!-- 中山 -->
      <g opacity=".95">
        <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="7s" repeatCount="indefinite"/>
        <use xlink:href="#tHills2" href="#tHills2" x="0"/>
        <use xlink:href="#tHills2" href="#tHills2" x="800"/>
      </g>

      <!-- 草地 -->
      <rect x="0" y="330" width="800" height="52" fill="url(#grassG)"/>
      <path d="M0 348 Q200 342 400 350 Q600 358 800 346 L800 360 L0 360 Z" fill="#7ac463" opacity=".55"/>

      <!-- 树林 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="3.9s" repeatCount="indefinite"/>
        <use xlink:href="#tTree" href="#tTree" x="70"  y="352"/>
        <use xlink:href="#tTree" href="#tTree" x="186" y="356"/>
        <g transform="translate(268 350) scale(1.25)"><use xlink:href="#tTree" href="#tTree"/></g>
        <use xlink:href="#tTree" href="#tTree" x="392" y="356"/>
        <use xlink:href="#tTree" href="#tTree" x="470" y="352"/>
        <g transform="translate(584 357) scale(1.15)"><use xlink:href="#tTree" href="#tTree"/></g>
        <use xlink:href="#tTree" href="#tTree" x="672" y="351"/>
        <use xlink:href="#tTree" href="#tTree" x="770" y="356"/>
        <use xlink:href="#tTree" href="#tTree" x="870" y="352"/>
        <use xlink:href="#tTree" href="#tTree" x="986" y="356"/>
        <g transform="translate(1068 350) scale(1.25)"><use xlink:href="#tTree" href="#tTree"/></g>
        <use xlink:href="#tTree" href="#tTree" x="1192" y="356"/>
        <use xlink:href="#tTree" href="#tTree" x="1270" y="352"/>
        <g transform="translate(1384 357) scale(1.15)"><use xlink:href="#tTree" href="#tTree"/></g>
        <use xlink:href="#tTree" href="#tTree" x="1472" y="351"/>
        <use xlink:href="#tTree" href="#tTree" x="1570" y="356"/>
      </g>

      <!-- 近景灌木与草丛 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="2.6s" repeatCount="indefinite"/>
        <use xlink:href="#tBush" href="#tBush" x="46"  y="372"/>
        <use xlink:href="#tBush" href="#tBush" x="196" y="376"/>
        <use xlink:href="#tBush" href="#tBush" x="322" y="370"/>
        <use xlink:href="#tBush" href="#tBush" x="498" y="375"/>
        <use xlink:href="#tBush" href="#tBush" x="622" y="371"/>
        <use xlink:href="#tBush" href="#tBush" x="764" y="376"/>
        <use xlink:href="#tBush" href="#tBush" x="846" y="372"/>
        <use xlink:href="#tBush" href="#tBush" x="996" y="376"/>
        <use xlink:href="#tBush" href="#tBush" x="1122" y="370"/>
        <use xlink:href="#tBush" href="#tBush" x="1298" y="375"/>
        <use xlink:href="#tBush" href="#tBush" x="1422" y="371"/>
        <use xlink:href="#tBush" href="#tBush" x="1564" y="376"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="1.1s" repeatCount="indefinite"/>
        <use xlink:href="#tTuft" href="#tTuft" x="30"  y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="96"  y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="160" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="226" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="290" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="352" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="416" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="478" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="542" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="606" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="670" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="734" y="380"/>
        <use xlink:href="#tTuft" href="#tTuft" x="798" y="380"/>
      </g>

      <!-- 路面 -->
      <rect x="0" y="380" width="800" height="70" fill="url(#roadG)"/>
      <rect x="0" y="380" width="800" height="5" fill="#3f4753" opacity=".6"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="2.2s" repeatCount="indefinite"/>
        <use xlink:href="#tDash" href="#tDash" x="0"/>
        <use xlink:href="#tDash" href="#tDash" x="100"/>
        <use xlink:href="#tDash" href="#tDash" x="200"/>
        <use xlink:href="#tDash" href="#tDash" x="300"/>
        <use xlink:href="#tDash" href="#tDash" x="400"/>
        <use xlink:href="#tDash" href="#tDash" x="500"/>
        <use xlink:href="#tDash" href="#tDash" x="600"/>
        <use xlink:href="#tDash" href="#tDash" x="700"/>
        <use xlink:href="#tDash" href="#tDash" x="800"/>
      </g>

      <!-- ================= 自行车 + 鹈鹕 ================= -->
      <!-- 地面投影 -->
      <ellipse cx="390" cy="384" rx="160" ry="14" fill="url(#shadowG)"/>

      <!-- 后轮 -->
      <g>
        <circle cx="250" cy="320" r="60" fill="none" stroke="#2c3038" stroke-width="11"/>
        <circle cx="250" cy="320" r="52" fill="none" stroke="#e6ecf3" stroke-width="4"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 250 320" to="360 250 320" dur="1.05s" repeatCount="indefinite"/>
          <use xlink:href="#tSpokes" href="#tSpokes" x="250" y="320"/>
        </g>
        <circle cx="250" cy="320" r="7" fill="#9aa4b2" stroke="#6b7480" stroke-width="2"/>
      </g>

      <!-- 前轮 -->
      <g>
        <circle cx="530" cy="320" r="60" fill="none" stroke="#2c3038" stroke-width="11"/>
        <circle cx="530" cy="320" r="52" fill="none" stroke="#e6ecf3" stroke-width="4"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 530 320" to="360 530 320" dur="1.05s" repeatCount="indefinite"/>
          <use xlink:href="#tSpokes" href="#tSpokes" x="530" y="320"/>
        </g>
        <circle cx="530" cy="320" r="7" fill="#9aa4b2" stroke="#6b7480" stroke-width="2"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#c8443b" stroke-width="10">
          <path d="M250 320 L348 320"/>
          <path d="M250 320 L330 215"/>
          <path d="M348 320 L330 215"/>
          <path d="M330 215 L482 228"/>
          <path d="M348 320 L492 258"/>
          <path d="M482 228 L492 258"/>
          <path d="M492 258 L530 320"/>
        </g>
        <g stroke="#ef5f52" stroke-width="7">
          <path d="M250 320 L348 320"/>
          <path d="M250 320 L330 215"/>
          <path d="M348 320 L330 215"/>
          <path d="M330 215 L482 228"/>
          <path d="M348 320 L492 258"/>
          <path d="M482 228 L492 258"/>
          <path d="M492 258 L530 320"/>
        </g>
      </g>

      <!-- 链条 -->
      <g fill="none" stroke="#5d6672" stroke-width="4" class="chain">
        <path d="M250 309 L348 303"/>
        <path d="M250 331 L348 337"/>
      </g>

      <!-- 车把 -->
      <g fill="none" stroke-linecap="round">
        <path d="M486 234 C496 220 506 211 524 206" stroke="#3a3f4b" stroke-width="7"/>
        <path d="M514 210 L531 203" stroke="#23262d" stroke-width="10"/>
      </g>

      <!-- 坐垫 -->
      <path d="M310 212 Q330 203 352 210 Q352 217 330 219 Q312 218 310 212 Z" fill="#3a3f4b"/>

      <!-- 曲柄 + 脚踏 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 348 320" to="360 348 320" dur="1.4s" repeatCount="indefinite"/>
        <circle cx="348" cy="320" r="17" fill="none" stroke="#b8bec7" stroke-width="4"/>
        <line x1="348" y1="320" x2="370" y2="320" stroke="#8b939e" stroke-width="6" stroke-linecap="round"/>
        <line x1="348" y1="320" x2="326" y2="320" stroke="#8b939e" stroke-width="6" stroke-linecap="round"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 348 320" to="0 348 320" dur="1.4s" repeatCount="indefinite"/>
          <rect x="357" y="316.5" width="26" height="7" rx="3.5" fill="#39404b"/>
          <rect x="313" y="316.5" width="26" height="7" rx="3.5" fill="#39404b"/>
        </g>
      </g>

      <!-- 腿（后腿） -->
      <path fill="none" stroke="#e08b28" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur="1.4s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          values="M348 228 Q342 283 326 320;
                  M348 228 Q345 274 332.4 304.4;
                  M348 228 Q354 270 348 298;
                  M348 228 Q363 274 363.6 304.4;
                  M348 228 Q366 283 370 320;
                  M348 228 Q363 293 363.6 335.6;
                  M348 228 Q354 296 348 342;
                  M348 228 Q345 293 332.4 335.6;
                  M348 228 Q342 283 326 320"/>
      </path>

      <!-- 腿（前腿） -->
      <path fill="none" stroke="#f2a63c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur="1.4s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          values="M348 228 Q366 283 370 320;
                  M348 228 Q363 293 363.6 335.6;
                  M348 228 Q354 296 348 342;
                  M348 228 Q345 293 332.4 335.6;
                  M348 228 Q342 283 326 320;
                  M348 228 Q345 274 332.4 304.4;
                  M348 228 Q354 270 348 298;
                  M348 228 Q363 274 363.6 304.4;
                  M348 228 Q366 283 370 320"/>
      </path>

      <!-- 脚掌 A -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="1.4s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          values="370 320; 363.6 335.6; 348 342; 332.4 335.6; 326 320; 332.4 304.4; 348 298; 363.6 304.4; 370 320"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.4s" repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            values="0;45;90;135;180;225;270;315;360"/>
          <path d="M-8 -6 C-2 -9 6 -6 11 -3 Q14 0 10 2 C4 4 -4 3 -8 1 Z" fill="#f6b04a" stroke="#d98f22" stroke-width="1.6"/>
        </g>
      </g>
      <!-- 脚掌 B -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="1.4s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          values="326 320; 332.4 304.4; 348 298; 363.6 304.4; 370 320; 363.6 335.6; 348 342; 332.4 335.6; 326 320"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.4s" repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            values="180;225;270;315;360;405;450;495;540"/>
          <path d="M-8 -6 C-2 -9 6 -6 11 -3 Q14 0 10 2 C4 4 -4 3 -8 1 Z" fill="#f6b04a" stroke="#d98f22" stroke-width="1.6"/>
        </g>
      </g>

      <!-- ================= 鹈鹕 ================= -->
      <g>
        <!-- 身体上下起伏 -->
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.7s" repeatCount="indefinite"/>

        <!-- 远侧翅膀（轻微扇动） -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 340 176; -9 340 176; 0 340 176; 6 340 176; 0 340 176" dur="2.4s" repeatCount="indefinite"/>
          <path d="M272 176 C274 142 294 122 318 128 C340 134 346 156 328 170 C308 186 280 192 272 176 Z"
                fill="#dbe3ee" stroke="#c3cddb" stroke-width="2.5"/>
          <path d="M283 172 C291 157 305 147 321 145" fill="none" stroke="#c3cddb" stroke-width="2"/>
          <path d="M290 180 C300 167 312 159 327 157" fill="none" stroke="#c3cddb" stroke-width="2"/>
        </g>

        <!-- 尾羽 -->
        <path d="M266 178 L214 146 L204 188 L262 208 Z" fill="#eef3fa" stroke="#c3cddb" stroke-width="2.5"/>

        <!-- 脖子 -->
        <path d="M368 180 C392 156 400 130 396 106" fill="none" stroke="#c3cddb" stroke-width="34" stroke-linecap="round"/>
        <path d="M368 180 C392 156 400 130 396 106" fill="none" stroke="#fdfefe" stroke-width="28" stroke-linecap="round"/>

        <!-- 喉囊 -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" dur="0.7s" repeatCount="indefinite"/>
          <path d="M404 100 C440 106 490 114 534 116 C526 145 492 165 452 157 C420 150 400 124 404 100 Z"
                fill="url(#pouchG)" stroke="#dfa542" stroke-width="2.5"/>
          <path d="M420 118 C442 134 478 140 514 134" fill="none" stroke="#e3ab4c" stroke-width="2" opacity=".8"/>
        </g>

        <!-- 身体 -->
        <path d="M258 178 C262 150 292 132 330 132 C368 132 392 148 398 174 C404 200 392 222 366 231 C336 241 296 234 274 215 C260 203 254 192 258 178 Z"
              fill="#ffffff" stroke="#c3cddb" stroke-width="3"/>
        <path d="M270 208 C296 228 340 234 372 218 C360 232 336 240 312 236 C292 232 278 221 270 208 Z" fill="#eef2f8" opacity=".9"/>

        <!-- 身体上的翅膀 -->
        <path d="M288 168 C312 154 350 157 366 176 C380 192 372 214 344 218 C316 222 290 204 288 168 Z"
              fill="#e8eef6" stroke="#c3cddb" stroke-width="2.5"/>

        <!-- 伸向车把的翅膀 -->
