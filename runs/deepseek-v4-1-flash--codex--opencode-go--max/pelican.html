<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8edff1">
  <title>鹈鹕骑行记</title>
  <style>
    :root {
      color-scheme: light;
      background: #8edff1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 244, 189, 0.8), transparent 18%),
        linear-gradient(180deg, #78d4ec 0%, #bceaf3 58%, #d9f4ef 100%);
    }

    .scene {
      display: block;
      width: min(100vw, 171.428571svh);
      height: min(100svh, 58.333333vw);
      max-width: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 28px rgba(25, 70, 86, 0.14));
    }

    .wheel-spokes {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 0.92s linear infinite;
    }

    .wheel-spokes.rear {
      animation-direction: reverse;
    }

    .road-marks {
      animation: road-scroll 1.1s linear infinite;
    }

    .roadside {
      animation: road-scroll 2.3s linear infinite;
    }

    .rider-bob {
      transform-box: view-box;
      transform-origin: 590px 330px;
      animation: rider-bob 0.64s ease-in-out infinite;
    }

    .scarf {
      transform-box: view-box;
      transform-origin: 667px 224px;
      animation: scarf-wave 0.48s ease-in-out infinite alternate;
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s ease-in-out infinite;
    }

    .tail-tip {
      transform-box: view-box;
      transform-origin: 510px 342px;
      animation: tail-flutter 0.58s ease-in-out infinite alternate;
    }

    .speed-line {
      animation: speed-flicker 1.35s ease-in-out infinite;
    }

    .speed-line:nth-child(2) {
      animation-delay: -0.45s;
    }

    .speed-line:nth-child(3) {
      animation-delay: -0.9s;
    }

    @keyframes wheel-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes road-scroll {
      to {
        transform: translateX(-180px);
      }
    }

    @keyframes rider-bob {
      0%,
      100% {
        transform: translateY(0) rotate(-0.35deg);
      }
      50% {
        transform: translateY(-3px) rotate(0.45deg);
      }
    }

    @keyframes scarf-wave {
      from {
        transform: rotate(-4deg) scaleX(1);
      }
      to {
        transform: rotate(5deg) scaleX(1.06);
      }
    }

    @keyframes blink {
      0%,
      44%,
      48%,
      100% {
        transform: scaleY(1);
      }
      46% {
        transform: scaleY(0.08);
      }
    }

    @keyframes tail-flutter {
      from {
        transform: rotate(-2deg);
      }
      to {
        transform: rotate(4deg);
      }
    }

    @keyframes speed-flicker {
      0%,
      100% {
        opacity: 0;
        transform: translateX(18px);
      }
      38%,
      70% {
        opacity: 0.75;
        transform: translateX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel-spokes,
      .road-marks,
      .roadside,
      .rider-bob,
      .scarf,
      .eye,
      .tail-tip,
      .speed-line {
        animation-play-state: paused !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const svg = document.querySelector(".scene");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const drivetrain = document.getElementById("drivetrain");
      const pedalA = document.getElementById("pedal-a");
      const pedalB = document.getElementById("pedal-b");
      const footA = document.getElementById("foot-a");
      const footB = document.getElementById("foot-b");
      const backLeg = document.getElementById("back-leg");
      const backLegOutline = document.getElementById("back-leg-outline");
      const frontLeg = document.getElementById("front-leg");
      const frontLegOutline = document.getElementById("front-leg-outline");

      const crank = { x: 590, y: 480, radius: 34 };
      const backHip = { x: 568, y: 365 };
      const frontHip = { x: 600, y: 371 };
      const upperLeg = 82;
      const lowerLeg = 88;

      function solveKnee(hip, foot) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.max(Math.hypot(dx, dy), 0.001);
        const reach = Math.min(distance, upperLeg + lowerLeg - 0.01);
        const along = (upperLeg * upperLeg - lowerLeg * lowerLeg + reach * reach) / (2 * reach);
        const height = Math.sqrt(Math.max(upperLeg * upperLeg - along * along, 0));
        const baseX = hip.x + (dx / distance) * along;
        const baseY = hip.y + (dy / distance) * along;

        // The positive perpendicular side keeps the bird's knees bending forward.
        return {
          x: baseX + (dy / distance) * height,
          y: baseY - (dx / distance) * height
        };
      }

      function legPath(hip, foot) {
        const knee = solveKnee(hip, foot);
        return `M${hip.x} ${hip.y} L${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
      }

      function placePedal(group, foot) {
        group.setAttribute("transform", `translate(${foot.x.toFixed(2)} ${foot.y.toFixed(2)})`);
      }

      function render(time) {
        const angle = reducedMotion ? 0.8 : time / 650;
        const degrees = (angle * 180 / Math.PI) % 360;

        const footA = {
          x: crank.x + Math.cos(angle) * crank.radius,
          y: crank.y + Math.sin(angle) * crank.radius
        };
        const footB = {
          x: crank.x + Math.cos(angle + Math.PI) * crank.radius,
          y: crank.y + Math.sin(angle + Math.PI) * crank.radius
        };

        drivetrain.setAttribute("transform", `rotate(${degrees.toFixed(2)} ${crank.x} ${crank.y})`);
        placePedal(pedalA, footA);
        placePedal(pedalB, footB);
        footAElementSet(footA, footB);
      }

      function footAElementSet(firstFoot, secondFoot) {
        const firstPath = legPath(backHip, firstFoot);
        const secondPath = legPath(frontHip, secondFoot);

        backLeg.setAttribute("d", firstPath);
        backLegOutline.setAttribute("d", firstPath);
        frontLeg.setAttribute("d", secondPath);
        frontLegOutline.setAttribute("d", secondPath);

        footA.setAttribute("transform", `translate(${firstFoot.x.toFixed(2)} ${firstFoot.y.toFixed(2)})`);
        footB.setAttribute("transform", `translate(${secondFoot.x.toFixed(2)} ${secondFoot.y.toFixed(2)})`);
      }

      if (reducedMotion) {
        if (typeof svg.pauseAnimations === "function") {
          svg.pauseAnimations();
        }
        render(0);
      } else {
        requestAnimationFrame(function animate(time) {
          render(time);
          requestAnimationFrame(animate);
        });
      }
    })();
  </script>
</body>
</html>
