<head>
<meta charset="utf-8">

<style>

    margin:0; display:grid; place-items:center; gap:14px;
    background: radial-gradient(1200px 700px at 50% -10%, #17253f 0%, #0a0f1a 65%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;

    width: min(96vw, 1040px);
    filter: drop-shadow(0 26px 60px rgba(0,0,0,.6));

  svg{ display:block; width:100%; height:auto; border-radius:20px; }
  .caption{
    margin:0 0 6px; font-size:13px; letter-spacing:.14em;
    color:#8ea3bf; text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="stage">

  <svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img"

    <defs>

        <path d="M 465 447 L 405 302"/>
        <path d="M 465 447 L 622 340"/>
        <path d="M 405 302 L 612 290"/>
        <path d="M 612 290 L 622 340"/>
        <path d="M 622 340 C 630 378 644 408 660 432"/>

      <!-- 座垫 -->

</div>

<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const $  = id => document.getElementById(id);
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

  /* ---------- 几何参数 ---------- */
  const HUB_R = { x: 320, y: 432 };   // 后轮轴心
  const HUB_F = { x: 660, y: 432 };   // 前轮轴心
  const BB    = { x: 465, y: 447 };   // 中轴（曲柄中心）
  const CRANK = 28;                   // 曲柄长度
  const HIP   = { x: 390, y: 300 };   // 髋关节（藏在肚子下面）
  const L1 = 106, L2 = 106;           // 大腿 / 小腿

  /* ---------- 车轮 ---------- */
  function makeWheel(cx, cy) {
    const g = el("g", {});
    g.appendChild(el("circle", { cx, cy, r: 65, fill: "none", stroke: "#c7d1df", "stroke-width": 5 }));
    for (let i = 0; i < 14; i++) {
      const a = i * Math.PI * 2 / 14;
      g.appendChild(el("line", {
        x1: cx, y1: cy,
        x2: cx + Math.cos(a) * 63, y2: cy + Math.sin(a) * 63,
        stroke: "#dde5ef", "stroke-width": 2, "stroke-linecap": "round"
      }));
    }
    g.appendChild(el("circle", { cx, cy, r: 77, fill: "none", stroke: "#2b3140", "stroke-width": 11 }));
    g.appendChild(el("circle", { cx, cy, r: 10, fill: "#98a3b5", stroke: "#2b3140", "stroke-width": 3.5 }));
    // 气门嘴：让轮子的旋转看得出来
    g.appendChild(el("line", { x1: cx, y1: cy - 62, x2: cx, y2: cy - 50,
                               stroke: "#2b3140", "stroke-width": 4, "stroke-linecap": "round" }));
    g.appendChild(el("circle", { cx, cy: cy - 46, r: 4.5, fill: "#e8514f", stroke: "#2b3140", "stroke-width": 2 }));
    return g;
  }
  const wheelRear  = $("wheelRear");
  const wheelFront = $("wheelFront");
  wheelRear.appendChild(makeWheel(HUB_R.x, HUB_R.y));
  wheelFront.appendChild(makeWheel(HUB_F.x, HUB_F.y));

  /* ---------- 云 ---------- */
  const cloudDefs = [
    { x: 120, y: 84,  s: 26, k: 1.00 },
    { x: 430, y: 168, s: 40, k: 0.68 },
    { x: 700, y: 62,  s: 18, k: 1.18 },
    { x: 950, y: 150, s: 34, k: 0.82 }
  ];
  const clouds = cloudDefs.map(d => {
    const g = el("g", {});
    const puffs = [[0, 0, 34], [34, 8, 26], [-34, 10, 24], [12, -18, 24], [-14, -14, 20], [58, 14, 18]];
    puffs.forEach(([dx, dy, r]) => {
      g.appendChild(el("ellipse", { cx: d.x + dx * d.k, cy: d.y + dy * d.k,
                                    rx: r * d.k, ry: r * 0.72 * d.k }));
    });
    $("clouds").appendChild(g);
    return { node: g, base: d.x, speed: d.s };
  });

  /* ---------- 两段式反向运动学（鸟腿：膝向后弯） ---------- */
  function ik(hx, hy, fx, fy, l1, l2) {
    const dx = fx - hx, dy = fy - hy;
    const raw = Math.hypot(dx, dy) || 1e-6;
    const d = Math.min(l1 + l2 - 0.5, Math.max(Math.abs(l1 - l2) + 0.5, raw));
    const ux = dx / raw, uy = dy / raw;
    const foot = { x: hx + ux * d, y: hy + uy * d };       // 夹紧后的脚落点
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const bx = hx + ux * a, by = hy + uy * a;
    const k1 = { x: bx - h * uy, y: by + h * ux };
    const k2 = { x: bx + h * uy, y: by - h * ux };
    return { knee: (k1.x < k2.x ? k1 : k2), foot };        // 取更靠后的一侧 → 鸟的踝关节
  }

  const legNearOut = $("legNearOut"), legNear = $("legNear"), footNear = $("footNear");
  const legFarOut  = $("legFarOut"),  legFar  = $("legFar"),  footFar  = $("footFar");
  const crankNear  = $("crankNear"),  crankFar = $("crankFar");
  const pelican = $("pelican"), wing = $("wing"), pouch = $("pouch"), eyelid = $("eyelid");
  const sunRays = $("sunRays"), dashFar = $("dashFar"), dashNear = $("dashNear");

  const F = (n) => n.toFixed(2);

  function updLeg(hipX, hipY, footX, footY, out, line, foot, tilt, scale) {
    const r = ik(hipX, hipY, footX, footY, L1, L2);
    const d = `M ${F(hipX)} ${F(hipY)} L ${F(r.knee.x)} ${F(r.knee.y)} L ${F(r.foot.x)} ${F(r.foot.y)}`;
    out.setAttribute("d", d);
    line.setAttribute("d", d);
    foot.setAttribute("transform",
      `translate(${F(footX)} ${F(footY)}) rotate(${F(tilt)}) scale(${scale})`);
  }

  /* ---------- 主循环 ---------- */
  const start = performance.now();

  function frame(now) {
    const t = (now - start) / 1000;

    /* 轮子 & 曲柄：顺时针 = 前进 */
    const wheelDeg = t * 235;
    wheelRear .setAttribute("transform", `rotate(${F(wheelDeg)} ${HUB_R.x} ${HUB_R.y})`);
    wheelFront.setAttribute("transform", `rotate(${F(wheelDeg)} ${HUB_F.x} ${HUB_F.y})`);

    const crankDeg = t * 150;
    const rad = crankDeg * Math.PI / 180;
    crankNear.setAttribute("transform", `rotate(${F(crankDeg)} ${BB.x} ${BB.y})`);
    crankFar .setAttribute("transform", `rotate(${F(crankDeg + 180)} ${BB.x} ${BB.y})`);

    const pNear = { x: BB.x + CRANK * Math.sin(rad), y: BB.y - CRANK * Math.cos(rad) };
    const pFar  = { x: BB.x - CRANK * Math.sin(rad), y: BB.y + CRANK * Math.cos(rad) };

    /* 身体上下起伏（腿的髋关节跟着动，脚仍踩在脚踏上） */
    const bob = Math.sin(rad * 2) * 2.6 + Math.sin(t * 9) * 0.45;
    pelican.setAttribute("transform", `translate(0 ${F(bob)})`);
    const hipY = HIP.y + bob;

    updLeg(HIP.x, hipY, pNear.x, pNear.y - 4,
           legNearOut, legNear, footNear, -4 + Math.sin(rad) * 11, 0.92);
    updLeg(HIP.x - 6, hipY + 2, pFar.x, pFar.y - 4,
           legFarOut, legFar, footFar, -4 + Math.sin(rad + Math.PI) * 11, 0.86);

    /* 翅膀轻轻扇动（翅尖固定在车把上） */
    const w = Math.sin(t * 3.1) * 4;
    wing.setAttribute("d",
      `M 424 192 C 480 ${F(182 - w)} 530 ${F(200 - w)} 572 ${F(232 - w * 0.6)} ` +
      `C 600 ${F(252 - w * 0.4)} 622 ${F(258 - w * 0.2)} 644 258 ` +
      `C 654 262 654 276 642 280 ` +
      `C 612 ${F(282 + w * 0.4)} 586 ${F(270 + w * 0.6)} 558 254 ` +
      `C 516 232 466 242 430 234 C 410 228 410 200 424 192 Z`);

    /* 喉囊晃动 */
    const j = Math.sin(t * 4.2) * 3 + Math.sin(t * 7.3) * 1.2;
    pouch.setAttribute("d",
      `M 584 137 C 624 ${F(150 + j * 0.5)} 682 ${F(160 + j * 0.8)} 748 158 ` +
      `C 744 ${F(196 + j * 1.7)} 704 ${F(226 + j * 1.8)} 654 ${F(218 + j * 1.4)} ` +
      `C 616 ${F(212 + j)} 588 174 584 137 Z`);

    /* 眨眼 */
    const ph = t % 4.6;
    const blink = ph < 0.14 ? Math.sin(ph / 0.14 * Math.PI) : 0;
    eyelid.setAttribute("transform", `translate(0 ${F(-26 + 26 * blink)})`);

    /* 太阳光晕缓慢转动 */
    sunRays.setAttribute("transform", `rotate(${F(t * 4)} 742 112)`);

    /* 云飘动 */
    clouds.forEach(c => {
      const x = (((c.base - t * c.s + 320) % 1300) + 1300) % 1300 - 320;
      c.node.setAttribute("transform", `translate(${F(x - c.base)} 0)`);
    });

    /* 路面虚线滚动 */
    dashFar .setAttribute("stroke-dashoffset", F((t * 150) % 130));
    dashNear.setAttribute("stroke-dashoffset", F((t * 280) % 220));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
