<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(circle at 50% 15%, #22303f, #0c1116 72%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #dbe4ee;
  }
  .stage { width: min(1000px, 96vw); }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .55);
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 14px;
    padding: 0 4px;
    font-size: 14px;
  }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; opacity: .92; }
  button {
    font: inherit;
    color: inherit;
    padding: 7px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(255, 255, 255, .08);
    cursor: pointer;
    transition: background .18s ease, transform .08s ease;
  }
  button:hover { background: rgba(255, 255, 255, .16); }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
<main class="stage">

      <stop offset="70%"  stop-color="#f3f8fc"/>
      <stop offset="100%" stop-color="#d7e4ee"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f9bb7c"/>
      <stop offset="100%" stop-color="#e88f38"/>

<script>
  (function () {
    var svg = document.getElementById('scene');
    var btn = document.getElementById('toggle');
    if (!svg || !btn || typeof svg.pauseAnimations !== 'function') return;
    btn.addEventListener('click', function () {
      if (svg.animationsPaused()) {
        svg.unpauseAnimations();
        btn.textContent = '暂停';
      } else {
        svg.pauseAnimations();
        btn.textContent = '播放';
      }
    });
  })();
</script>
</body>
