<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf3e9">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #284854;
      background: #eaf3e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 48px);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(255, 255, 255, .78), transparent 34rem),
        #eaf3e9;
    }

    .card {
      width: min(1080px, 100%);
      overflow: hidden;
      border: 1px solid rgba(62, 102, 99, .14);
      border-radius: 28px;
      background: #f8faf2;
      box-shadow: 0 24px 70px rgba(47, 83, 80, .13), 0 3px 10px rgba(47, 83, 80, .06);
    }

    .intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 30px clamp(22px, 5vw, 56px) 25px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 9px;
      color: #6d9587;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f0a64d;
      content: "";
    }

    h1 {
      margin: 0;
      color: #254954;
      font-size: clamp(1.65rem, 4vw, 2.55rem);
      font-weight: 800;
      letter-spacing: -.055em;
      line-height: 1.15;
    }

    .lede {
      margin: 9px 0 0;
      color: #68827d;
      font-size: clamp(.9rem, 2vw, 1.02rem);
      letter-spacing: .02em;
    }

    .weather-pill {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border: 1px solid #d8e7d5;
      border-radius: 999px;
      background: #f0f6e9;
      color: #51736a;
      font-size: .82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .weather-sun {
      width: 14px;
      height: 14px;
      border: 3px solid #f4b64d;
      border-radius: 50%;
      background: #ffda76;
      box-shadow: 0 0 0 3px rgba(244, 182, 77, .16);
    }

    .artwork {
      overflow: hidden;
      background: #bde8e5;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px clamp(22px, 5vw, 56px) 20px;
      color: #718880;
      font-size: .78rem;
      letter-spacing: .035em;
    }

    .caption strong {
      color: #4c726a;
      font-weight: 750;
    }

    .motion-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .motion-note::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #77b894;
      content: "";
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes drift {
      from { transform: translateX(-8px); }
      to { transform: translateX(24px); }
    }

    @keyframes road-roll {
      to { stroke-dashoffset: -72px; }
    }

    .spokes {
      transform-box: view-box;
      animation: spin 1.65s linear infinite;
    }

    #rear-spokes { transform-origin: 330px 374px; }
    #front-spokes { transform-origin: 615px 374px; }

    #pedal-crank {
      transform-box: view-box;
      transform-origin: 463px 374px;
      animation: spin 1.2s linear infinite;
    }

    #rider {
      transform-box: view-box;
      transform-origin: 460px 215px;
      animation: bob 1.2s ease-in-out infinite;
    }

    .cloud {
      transform-box: fill-box;
      transform-origin: center;
      animation: drift 24s ease-in-out infinite alternate;
    }

    #cloud-two { animation-duration: 31s; animation-delay: -12s; }

    #road-markings {
      animation: road-roll 1.2s linear infinite;
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .card { border-radius: 20px; }
      .intro { align-items: flex-start; padding-top: 24px; }
      .weather-pill { margin-top: 4px; padding: 8px 10px; font-size: .72rem; }
      .caption { align-items: flex-start; flex-direction: column; gap: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="intro">
      <div>
        <p class="eyebrow">COASTAL RIDE · SVG MOTION</p>
        <h1>鹈鹕的海岸骑行</h1>
        <p class="lede">踩着轻快的节拍，沿着海风向前。</p>
      </div>
      <div class="weather-pill"><span class="weather-sun" aria-hidden="true"></span>海风正好</div>
    </header>

    <section class="artwork" aria-label="动画插画">
      <svg id="ride-scene" viewBox="0 0 960 560" role="img" aria-labelledby="scene-title scene-description" xmlns="http://www.w3.org/2000/svg">
        <title id="scene-title">骑自行车的鹈鹕</title>
        <desc id="scene-description">戴着青绿色头盔的鹈鹕，在阳光明媚的海边骑着蓝绿色自行车。车轮旋转，鹈鹕的双腿交替踩踏，云朵轻轻飘过。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#92d9e8"/>
            <stop offset=".62" stop-color="#d4f0df"/>
            <stop offset="1" stop-color="#f4f0d2"/>
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#78d0ca"/>
            <stop offset="1" stop-color="#4eaaa9"/>
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#536e72"/>
            <stop offset="1" stop-color="#354f5b"/>
          </linearGradient>
          <radialGradient id="sun-glow">
            <stop stop-color="#fff5c8" stop-opacity=".82"/>
            <stop offset="1" stop-color="#fff5c8" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft-shadow" x="-30%" y="-100%" width="160%" height="300%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
        </defs>

        <!-- 海天与远处的岛屿 -->
        <rect width="960" height="560" fill="url(#sky)"/>
        <circle cx="794" cy="117" r="94" fill="url(#sun-glow)"/>
        <circle cx="794" cy="117" r="35" fill="#ffe08a"/>
        <circle cx="794" cy="117" r="27" fill="#ffe9a9"/>

        <g class="cloud" id="cloud-one" fill="#f9fff2" opacity=".88">
          <ellipse cx="148" cy="105" rx="38" ry="16"/>
          <circle cx="130" cy="98" r="17"/>
          <circle cx="153" cy="89" r="24"/>
          <circle cx="177" cy="101" r="16"/>
          <path d="M119 103h68v12h-68z"/>
        </g>
        <g class="cloud" id="cloud-two" fill="#fffdf0" opacity=".8">
          <ellipse cx="658" cy="185" rx="28" ry="12"/>
          <circle cx="645" cy="180" r="13"/>
          <circle cx="662" cy="173" r="18"/>
          <circle cx="680" cy="183" r="12"/>
          <path d="M637 183h54v10h-54z"/>
        </g>

        <path d="M0 275c78-24 132-16 201-4 75 14 129-10 192-18 67-9 118 14 191 7 75-8 125-28 200-14 67 12 121 20 176 5v88H0z" fill="#a6cf9d"/>
        <path d="M0 295c93-15 147 3 230 2 86-1 145-21 222-17 75 4 126 20 201 17 96-4 181-28 307-5v139H0z" fill="url(#sea)"/>
        <path d="M0 307c120-13 196 10 302 2m77-12c61-9 99-7 150 1m73 14c89 4 153-16 235-15" fill="none" stroke="#c9f2df" stroke-width="3" stroke-linecap="round" opacity=".68"/>
        <path d="M80 351c38-4 69 0 99 4m362-20c43-5 75-3 105 2m124 23c29-4 57-4 81 0" fill="none" stroke="#b6ece0" stroke-width="2" stroke-linecap="round" opacity=".57"/>

        <!-- 海岸公路 -->
        <path d="M0 420c170-19 313-11 467-13 177-3 319 5 493 15v138H0z" fill="url(#road)"/>
        <path d="M0 420c170-19 313-11 467-13 177-3 319 5 493 15" fill="none" stroke="#e3d99e" stroke-width="5" opacity=".82"/>
        <path id="road-markings" d="M-40 493h1040" fill="none" stroke="#f2df9c" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 54" opacity=".9"/>

        <!-- 车轮与车架 -->
        <ellipse cx="471" cy="453" rx="208" ry="13" fill="#203e4a" opacity=".2" filter="url(#soft-shadow)"/>

        <g aria-hidden="true">
          <circle cx="330" cy="374" r="77" fill="none" stroke="#294c59" stroke-width="11"/>
          <circle cx="330" cy="374" r="68" fill="none" stroke="#d6eee2" stroke-width="2.5"/>
          <g class="spokes" id="rear-spokes" stroke="#78999a" stroke-width="2.2" opacity=".95">
            <path d="M330 374v-65m0 65 46-46m-46 46h65m-65 0 46 46m-46-46v65m0-65-46 46m46-46h-65m65 0-46-46"/>
          </g>
          <circle cx="330" cy="374" r="8" fill="#f5b04f" stroke="#294c59" stroke-width="3"/>

          <circle cx="615" cy="374" r="77" fill="none" stroke="#294c59" stroke-width="11"/>
          <circle cx="615" cy="374" r="68" fill="none" stroke="#d6eee2" stroke-width="2.5"/>
          <g class="spokes" id="front-spokes" stroke="#78999a" stroke-width="2.2" opacity=".95">
            <path d="M615 374v-65m0 65 46-46m-46 46h65m-65 0 46 46m-46-46v65m0-65-46 46m46-46h-65m65 0-46-46"/>
          </g>
          <circle cx="615" cy="374" r="8" fill="#f5b04f" stroke="#294c59" stroke-width="3"/>
        </g>

        <g fill="none" stroke="#198195" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M330 374 420 272 463 374Z"/>
          <path d="M420 272 550 266 615 374 463 374"/>
        </g>
        <g fill="none" stroke="#e8f2d9" stroke-width="2.5" stroke-linecap="round" opacity=".76">
          <path d="M331 374 462 374"/>
          <path d="M421 272 549 266"/>
        </g>

        <!-- 车座、车把与前叉 -->
        <path d="m420 272-7-23" fill="none" stroke="#285563" stroke-width="7" stroke-linecap="round"/>
        <path d="M392 248c12-8 34-9 48-1 4 2 3 7-2 8l-38 3c-8 0-12-6-8-10Z" fill="#f3a253" stroke="#285563" stroke-width="3"/>
        <path d="m550 266 8-23" fill="none" stroke="#285563" stroke-width="7" stroke-linecap="round"/>
        <path d="M550 244c10-10 30-12 42-4m-42 4c-2 6 1 10 7 10" fill="none" stroke="#285563" stroke-width="7" stroke-linecap="round"/>
        <path d="M587 239c6 1 9 4 10 9" fill="none" stroke="#285563" stroke-width="7" stroke-linecap="round"/>

        <!-- 鹈鹕的双腿：脚随曲柄交替画圆 -->
        <path d="M434 241 Q417 264 426 302 L434 374" fill="none" stroke="#bf7045" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1" values="M434 241 Q417 264 426 302 L434 374;M434 241 Q412 257 440 282 L463 345;M434 241 Q461 260 473 307 L492 374;M434 241 Q467 265 446 316 L463 403;M434 241 Q417 264 426 302 L434 374"/>
        </path>
        <path d="M445 241 Q478 255 478 297 L492 374" fill="none" stroke="#f2a04b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1" values="M445 241 Q478 255 478 297 L492 374;M445 241 Q491 258 486 310 L463 403;M445 241 Q460 260 453 305 L434 374;M445 241 Q455 255 466 283 L463 345;M445 241 Q478 255 478 297 L492 374"/>
        </path>

        <!-- 曲柄和踏板 -->
        <g id="pedal-crank" fill="none" stroke="#314e59" stroke-width="7" stroke-linecap="round">
          <path d="M463 374h29m-29 0h-29"/>
          <path d="M486 367h13m-65 14h13" stroke="#f4b34f" stroke-width="8"/>
        </g>
        <circle cx="463" cy="374" r="10" fill="#f6bc58" stroke="#314e59" stroke-width="4"/>

        <!-- 鹈鹕：长颈、羽翼、头盔和标志性长喙 -->
        <g id="rider">
          <path d="M445 211c-7-17-2-36 3-54 4-16 13-25 26-23 12 2 17 12 12 23-8 16-7 33-2 49-7 15-28 19-39 5Z" fill="#fbf6e8" stroke="#d7ddcf" stroke-width="2.5"/>
          <ellipse cx="451" cy="214" rx="48" ry="31" fill="#fbf7e9" stroke="#d7ddcf" stroke-width="2.5"/>
          <path d="M421 207c-13-11-21-14-29-10 6 10 13 18 25 23" fill="#f3efdf" stroke="#d7ddcf" stroke-width="2" stroke-linecap="round"/>
          <path d="M423 207c10-17 37-23 55-9 5 4 7 9 7 14-12 15-34 21-51 14-8-4-12-11-11-19Z" fill="#e9e6d8" stroke="#d0d6c9" stroke-width="2"/>
          <path d="M432 205c10-7 20-9 29-8m-27 16c8-3 15-4 22-4m-13 13c6-1 11-3 16-6" fill="none" stroke="#c5cdbf" stroke-width="2" stroke-linecap="round"/>

          <!-- 翼伸向车把 -->
          <path d="M466 191c18 8 36 21 53 34 12 9 23 16 36 21" fill="none" stroke="#cbd2c4" stroke-width="20" stroke-linecap="round"/>
          <path d="M466 191c18 8 36 21 53 34 12 9 23 16 36 21" fill="none" stroke="#fbf7e9" stroke-width="15" stroke-linecap="round"/>
          <path d="M549 244c2-7 8-10 13-7l7 7c2 4-1 8-5 9l-9-3" fill="none" stroke="#fbf7e9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M549 244c2-7 8-10 13-7" fill="none" stroke="#d0d6c8" stroke-width="2" stroke-linecap="round"/>

          <ellipse cx="470" cy="124" rx="21" ry="20" fill="#fbf7e9" stroke="#d7ddcf" stroke-width="2"/>
          <path d="M449 112c2-15 13-24 27-23 12 1 20 9 22 23-14-5-31-4-49 3Z" fill="#55a994" stroke="#347f7c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M450 112c14-5 31-6 47-1" fill="none" stroke="#f7cb62" stroke-width="4" stroke-linecap="round"/>
          <path d="M464 112c6-5 14-6 20-5" fill="none" stroke="#8dd0b1" stroke-width="2" stroke-linecap="round"/>

          <!-- 喉囊与上喙 -->
          <path d="M486 129c27 1 58 8 91 13-3 18-16 31-35 35-17-7-39-22-55-39Z" fill="#e9783f" stroke="#c85d36" stroke-width="2" stroke-linejoin="round"/>
          <path d="M486 124c30 0 63 8 94 15 3 1 3 4-1 5-35 4-66-2-95-10Z" fill="#ffb94f" stroke="#d78339" stroke-width="2" stroke-linejoin="round"/>
          <path d="M489 135c25 7 56 11 87 9" fill="none" stroke="#b95337" stroke-width="2" stroke-linecap="round" opacity=".8"/>

          <ellipse cx="478" cy="119" rx="5.5" ry="6.5" fill="#fffdf4"/>
          <circle cx="480" cy="120" r="3.1" fill="#29454d"/>
          <circle cx="481" cy="119" r="1" fill="#fff"/>
          <path d="M462 138c3 2 7 3 10 2" fill="none" stroke="#e1cdb3" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- 小小的海风闪光 -->
        <g fill="none" stroke="#fff5cf" stroke-linecap="round" opacity=".9">
          <path d="m720 239 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" stroke-width="2"/>
          <path d="m236 177 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" stroke-width="1.7"/>
        </g>
      </svg>
    </section>

    <footer class="caption">
      <strong>慢慢骑，海风会跟上。</strong>
      <span class="motion-note">SVG 2D 动画 · 车轮转动 · 踏板循环</span>
    </footer>
  </main>

  <script>
    const scene = document.getElementById('ride-scene');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const syncMotionPreference = () => {
      if (reducedMotion.matches) scene.pauseAnimations();
      else scene.unpauseAnimations();
    };
    syncMotionPreference();
    reducedMotion.addEventListener?.('change', syncMotionPreference);
  </script>
</body>
</html>
