  <style>
    :root { color-scheme: light; color: #283f3a; background: #f6f0e2; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.6vw, 42px);
      background: radial-gradient(ellipse at 50% 35%, #fffbef, #f3ecdc 90%);
    }
    main { width: min(100%, 1580px, max(720px, calc(174.65svh - 170px))); }
    figure { margin: 0; }
    .picture {
      overflow: hidden;
      aspect-ratio: 1240 / 710;
      border: 1px solid #526761;
      border-radius: 3px;
      background: #c7dbcd;
      box-shadow: 0 2px 0 #cfc7b4;
    }
    #scene { display: block; width: 100%; height: 100%; }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: clamp(12px, 1.4vw, 21px) 1px 0;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: .55em;
      margin: 0;
      font: 650 clamp(19px, 2.05vw, 29px)/1.25 "Baskervville", "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      letter-spacing: .11em;
    }
    .colophon { width: 1.15em; height: 1.15em; flex: none; }
    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 7px 16px;
      border: 1px solid #7c8878;
      border-radius: 30px;
      background: transparent;
      color: #29423c;
      font: 600 14px/1.2 "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover { background: #e6e8d7; }
    button:active { background: #d7dfcf; }
    button:focus-visible { outline: 3px solid #be5838; outline-offset: 3px; }
    button[hidden] { display: none; }
    @media (max-aspect-ratio: 4/5) {
      body { padding: 14px; }
      .picture { aspect-ratio: .91; }
      button { min-height: 44px; }
    }
    @media (max-height: 500px) and (min-aspect-ratio: 4/3) {
      body { padding: 6px 12px; }
      main { width: min(100%, calc(174.65svh - 92px)); }
      figcaption { padding-top: 5px; }
      h1 { font-size: 17px; }
      button { min-height: 32px; }
    }

      ];

      function transform(id, value) {
        elements[id].setAttribute('transform', value);
      }

      function pedalLeg(side, angle, hipX, hipY) {
        const pedalX = 600 + 35 * Math.cos(angle);
        const pedalY = 556 + 35 * Math.sin(angle);
        const footTilt = -1 + 4.5 * Math.cos(angle - .2);
        const tilt = footTilt / degrees;
        const ankleX = pedalX - 17 * Math.cos(tilt) + 14 * Math.sin(tilt);
        const ankleY = pedalY - 5 - 17 * Math.sin(tilt) - 14 * Math.cos(tilt);

        // 用两段固定长度的腿骨求跗关节位置，使脚蹼始终踩住踏板。
        const upper = 80;
        const lower = 103;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const reach = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + reach * reach) / (2 * reach);
        const across = Math.sqrt(Math.max(0, upper * upper - along * along));
        const jointX = hipX + (along * dx - across * dy) / reach;
        const jointY = hipY + (along * dy + across * dx) / reach;

        elements[side + '-leg-line'].setAttribute('d',
          'M' + hipX + ' ' + hipY + 'L' + jointX + ' ' + jointY + 'L' + ankleX + ' ' + ankleY
        );
        transform(side + '-crank', 'rotate(' + (angle * degrees) + ')');
        transform(side + '-pedal', 'translate(' + pedalX + ' ' + pedalY + ')');
        transform(side + '-foot', 'translate(0 -5) rotate(' + footTilt + ')');

        if (side === 'near') {
          const shinAngle = Math.atan2(ankleY - jointY, ankleX - jointX) * degrees;
          transform('shin-detail', 'translate(' + jointX + ' ' + jointY + ') rotate(' + shinAngle + ')');
        }
      }

      function draw(seconds) {
        const phase = (seconds * radiansPerSecond) % (2 * Math.PI);
        const crank = phase + Math.PI / 6;
        const wheelAngle = (seconds * radiansPerSecond * gearRatio * degrees) % 360;
        const distance = seconds * roadSpeed;
        const sway = .8 * Math.sin(crank);
        const bob = -1.45 + 1.45 * Math.cos(2 * crank);

        transform('rear-spokes', 'rotate(' + wheelAngle + ')');
        transform('front-spokes', 'rotate(' + (wheelAngle + 21) + ')');
        elements['chain-links'].setAttribute('stroke-dashoffset', -(seconds * radiansPerSecond * 20) % 7);
        transform('pelican', 'translate(' + sway + ' ' + bob + ')');
        pedalLeg('near', crank, 547 + sway, 412 + bob);
        pedalLeg('far', crank + Math.PI, 567 + sway, 407 + bob);

        const breeze = seconds * 3.5;
        transform('scarf-long', 'rotate(' + (3 * Math.sin(breeze) + 1.2 * Math.sin(breeze * 1.6)) + ')');
        transform('scarf-short', 'rotate(' + (4.5 * Math.sin(breeze - 1.2)) + ')');
        const blink = Math.min(1, Math.abs((seconds % 5.6) - 4.3) / .12);
        transform('eye', 'scale(1 ' + (.09 + .91 * blink * blink) + ')');
        transform('gulls', 'translate(' + (7 * Math.sin(seconds * .39)) + ' ' + (4 * Math.sin(seconds * .62)) + ')');

        for (const [id, speed] of layers) {
          const offset = -((distance * speed) % 1240);
          const drift = id === 'boats' ? 1.4 * Math.sin(seconds * 1.45) : 0;
          transform(id, 'translate(' + offset + ' ' + drift + ')');
        }
      }

      let playing = !motionPreference.matches;
      let seconds = 0;
      let previousTimestamp = null;
      let frame = null;

      function tick(timestamp) {
        if (previousTimestamp !== null) {
          seconds += Math.min((timestamp - previousTimestamp) / 1000, .12);
        }
        previousTimestamp = timestamp;
        draw(seconds);
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previousTimestamp = null;
        label.textContent = playing ? '暂停' : '播放';
        button.setAttribute('aria-label', label.textContent + '动画');
        button.title = label.textContent + '动画（空格键）';
        icon.setAttribute('d', playing ? 'M3 2h3.5v12H3zM9.5 2H13v12H9.5z' : 'M4 2l9 6-9 6z');
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }

      function togglePlayback() {
        playing = !playing;
        syncPlayback();
      }

      button.addEventListener('click', togglePlayback);
      document.addEventListener('visibilitychange', syncPlayback);
      document.addEventListener('keydown', event => {
        if (event.code === 'Space' && event.target !== button && !event.altKey && !event.ctrlKey && !event.metaKey) {
          event.preventDefault();
          if (!event.repeat) togglePlayback();
        }
      });
      motionPreference.addEventListener('change', event => {
        playing = !event.matches;
        syncPlayback();
      });

      draw(0);
      button.hidden = false;
      syncPlayback();
    })();
  </script>
</body>
</html>
