<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1e2a32;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .stage {
    width: min(860px, 100%);
    background: #f6fbff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
  }
  .header h1 { font-size: 18px; margin: 0; color: #21343f; letter-spacing: .04em; }
  .header p { margin: 2px 0 0; font-size: 13px; color: #6b8795; }
  .controls { display: flex; gap: 10px; align-items: center; font-size: 13px; color: #41565f; }
  .controls button {
    border: 1px solid #c8d9e2; background: #fff; border-radius: 999px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  .controls button:hover { background: #eaf4fa; }
  .wrap { padding: 0 12px 12px; }
  svg { width: 100%; height: auto; display: block; border-radius: 12px; background: #87CEEB; }

  /* ---- SVG CSS 动画 ---- */
  .cloud1 { animation: cloudDrift 22s linear infinite; }
  .cloud2 { animation: cloudDrift 32s linear infinite; animation-delay: -12s; }
  .cloud3 { animation: cloudDrift 27s linear infinite; animation-delay: -20s; }
  @keyframes cloudDrift {
    from { transform: translateX(180px); }
    to   { transform: translateX(-950px); }
  }
  .scenery-move { animation: scenery 5s linear infinite; }
  @keyframes scenery {
    from { transform: translateX(0); }
    to   { transform: translateX(-200px); }
  }
  .road-dash { animation: dashMove .7s linear infinite; }
  @keyframes dashMove {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -55; }
  }
  .chain-line { animation: dashMove .5s linear infinite; }
  .wing-flap {
    transform-box: fill-box; transform-origin: 20% 30%;
    animation: flap 1.6s ease-in-out infinite;
  }
  @keyframes flap {
    0%,100% { transform: rotate(-4deg); }
    50%     { transform: rotate(7deg); }
  }
  .head-nod {
    transform-box: fill-box; transform-origin: 20% 80%;
    animation: nod 1.6s ease-in-out infinite;
  }
  @keyframes nod {
    0%,100% { transform: rotate(-3deg) translateY(0); }
    50%     { transform: rotate(2deg) translateY(2px); }
  }
  .pouch-wobble {
    transform-box: fill-box; transform-origin: 15% 10%;
    animation: wobble 1.6s ease-in-out infinite;
  }
  @keyframes wobble {
    0%,100% { transform: scaleY(1) rotate(0deg); }
    50%     { transform: scaleY(1.07) rotate(1.5deg); }
  }
  .scarf-wave {
    transform-box: fill-box; transform-origin: 100% 50%;
    animation: scarf 0.9s ease-in-out infinite;
  }
  @keyframes scarf {
    0%,100% { transform: skewY(-6deg) scaleX(1); }
    50%     { transform: skewY(7deg) scaleX(1.05); }
  }
  .tail-wag {
    transform-box: fill-box; transform-origin: 100% 50%;
    animation: tail 1.6s ease-in-out infinite;
  }
  @keyframes tail {
    0%,100% { transform: rotate(-5deg); }
    50%     { transform: rotate(6deg); }
  }
  .sun-spin {
    transform-box: fill-box; transform-origin: center;
    animation: sunspin 24s linear infinite;
  }
  @keyframes sunspin { to { transform: rotate(360deg); } }
  .speed-line { animation: speedBlink .6s ease-in-out infinite alternate; }
  .speed-line.s2 { animation-delay: -.2s; }
  .speed-line.s3 { animation-delay: -.4s; }
  @keyframes speedBlink {
    from { opacity: .15; } to { opacity: .65; }
  }
  .shadow-pulse { animation: shadowP 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes shadowP {
    0%,100% { transform: scaleX(1); opacity:.28; }
    50%     { transform: scaleX(.96); opacity:.22; }
  }
  .paused * { animation-play-state: paused !important; }
  .caption {
    padding: 8px 6px 2px; font-size: 13px; color: #5a7683; display:flex; justify-content:space-between;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="header">
    <div>
      <h1>🚲 鹈鹕骑自行车 · 纯 SVG 2D 动画</h1>

    <div class="controls">

  </div>

        <line x1="-48" y1="0" x2="-56" y2="0"/><line x1="48" y1="0" x2="56" y2="0"/>

        <g id="rearSpin">

            <line x1="542" y1="382" x2="505" y2="345"/><line x1="542" y1="382" x2="579" y2="419"/>
            <line x1="542" y1="382" x2="579" y2="345"/><line x1="542" y1="382" x2="505" y2="419"/>

        <g transform="translate(26,-14) rotate(10)">
          <ellipse cx="0" cy="0" rx="15" ry="8" fill="#9BE29B" stroke="#1E7A34" stroke-width="2"/>
          <polygon points="13,0 22,-7 22,7" fill="#1E7A34"/>

  <div class="caption"><span>◉ 纯内联 SVG：车轮辐条 / 链条 / 路面均为矢量动画，无任何外部资源</span><span>鹈鹕： stabilized pedaling by IK</span></div>
  </div>

<script>
(function(){
  const crank = document.getElementById('crank');
  const rearSpin = document.getElementById('rearSpin');
  const frontSpin = document.getElementById('frontSpin');
  const legFront = document.getElementById('legFront');
  const legBack = document.getElementById('legBack');
  const footFront = document.getElementById('footFront');
  const footBack = document.getElementById('footBack');
  const pelican = document.getElementById('pelican');
  const bike = document.getElementById('bike');
  const pupil = document.getElementById('pupil');
  const svg = document.getElementById('scene');
  const speedInput = document.getElementById('speed');
  const btn = document.getElementById('btn');

  const BB = {x:400, y:382};
  const CR = 38; // 曲柄半径
  let crankAngle = 0;   // 度
  let wheelAngle = 0;
  let t = 0;
  let speed = 1;
  let running = true;

  speedInput.addEventListener('input', e => speed = parseFloat(e.target.value));
  btn.addEventListener('click', () => {
    running = !running;
    btn.textContent = running ? '⏸ 暂停' : '▶ 播放';
    svg.classList.toggle('paused', !running);
  });

  function kneePoint(hx, hy, fx, fy, bend){
    const mx = (hx+fx)/2, my = (hy+fy)/2;
    // 膝盖向前凸（自行车朝右，前方为 +x）
    return {x: mx + bend, y: my - 4};
  }

  function frame(){
    requestAnimationFrame(frame);
    if(!running) return;
    const dt = speed;
    t += 0.06 * dt;
    crankAngle = (crankAngle + 4.2 * dt) % 360;
    wheelAngle = (wheelAngle + 10.5 * dt) % 360;

    // 车身与身体起伏（同频、不同幅，模拟踩踏颠簸）
    const bobBike = Math.sin(crankAngle * Math.PI/180 * 2) * 1.6;
    const bobBody = Math.sin(crankAngle * Math.PI/180 * 2 - 0.6) * -6;
    bike.setAttribute('transform', `translate(0 ${bobBike})`);
    // 注意：鹈鹕坐在车上，整体跟车 + 自身起伏
    const bodyY = bobBike + bobBody;
    pelican.setAttribute('transform', `translate(0 ${bodyY})`);

    // 曲柄旋转（含车身起伏修正：旋转中心也上移）
    crank.setAttribute('transform', `translate(0 ${bobBike}) rotate(${crankAngle} ${BB.x} ${BB.y})`);
    rearSpin.setAttribute('transform', `rotate(${wheelAngle} 260 382)`);
    frontSpin.setAttribute('transform', `rotate(${wheelAngle} 542 382)`);

    // 踏板轴心世界坐标
    const r = crankAngle * Math.PI/180;
    const p1x = BB.x + CR*Math.cos(r), p1y = BB.y + CR*Math.sin(r) + bobBike;
    const p2x = BB.x - CR*Math.cos(r), p2y = BB.y - CR*Math.sin(r) + bobBike;

    // 髋部（随身体起伏）
    const hipF = {x: 392, y: 272 + bodyY};
    const hipB = {x: 375, y: 272 + bodyY};
    const kF = kneePoint(hipF.x, hipF.y, p1x, p1y, 34);
    const kB = kneePoint(hipB.x, hipB.y, p2x, p2y, 30);

    // 因 pelican 组已有 bodyY 平移，腿部坐标要减去 bodyY 才能放在组内坐标系
    legFront.setAttribute('points',
      `${hipF.x},${hipF.y - bodyY} ${kF.x},${kF.y - bodyY} ${p1x},${p1y - bodyY}`);
    legBack.setAttribute('points',
      `${hipB.x},${hipB.y - bodyY} ${kB.x},${kB.y - bodyY} ${p2x},${p2y - bodyY}`);
    footFront.setAttribute('cx', p1x);
    footFront.setAttribute('cy', (p1y - bodyY));
    footBack.setAttribute('cx', p2x);
    footBack.setAttribute('cy', (p2y - bodyY));

    // 眼珠微转 + 尘土
    pupil.setAttribute('cx', 503 + Math.sin(t*1.4)*1.6);
    const dusts = document.querySelectorAll('.dust');
    dusts.forEach((d,i)=>{
      const baseX = [170,140,195][i];
      const ph = (t*2 + i*2.1) % 3;
      d.setAttribute('cx', baseX - ph*28);
      d.setAttribute('cy', 430 + i*7 - ph*6);
      d.setAttribute('opacity', String(0.8 - ph*0.25));
      d.setAttribute('r', String(7 - ph*1.5));
    });
  }
  frame();
})();
</script>
</body>
</html>
