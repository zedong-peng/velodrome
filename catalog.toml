# Who is who. The site lists models, harnesses and providers in this order.
#
# Providers with base URLs can be used by velodrome.py; the rest only appear in
# past runs. Keys never go here: they live in keys.env (gitignored) as
# VELODROME_KEY_<PROVIDER>, or VELODROME_KEY_<PROVIDER>_<API> when a provider
# issues one key per API format.
# API formats: anthropic (Messages), chat (Chat Completions), responses
# (OpenAI Responses), google (Gemini).

# ---------------------------------------------------------------- providers

[providers.claude-max]
name = "Claude Max"
kind = "subscription"
anthropic = "https://api.anthropic.com"
# A subscription login, not an API key, used only from Anthropic's own harness.
login = "claude-oauth"
harnesses = ["claude-code"]

[providers.openai-plus]
name = "ChatGPT Plus"
kind = "subscription"
harnesses = ["codex"]

[providers.opencode-go]
name = "OpenCode Go"
kind = "subscription"
anthropic = "https://opencode.ai/inference/go/anthropic"
openai = "https://opencode.ai/inference/go/openai/v1"
google = "https://opencode.ai/inference/go/google"
# Go serves each model in one format: chat unless listed.
default_api = "chat"
[providers.opencode-go.apis]
"claude-haiku-5-5" = "anthropic"
"minimax-m3" = "anthropic"
"qwen3.8-max" = "anthropic"
"gpt-6-luna" = "responses"
"gpt-5.6-luna" = "responses"
"grok-4.7" = "responses"
"muse-spark-1.3-contributor" = "responses"
"gemini-4-argon-contributor" = "google"

[providers.cursor]
name = "Cursor"
kind = "subscription"
harnesses = ["cursor"]

[providers.deepseek-api]
name = "DeepSeek API"
kind = "official"
anthropic = "https://api.deepseek.com/anthropic"
openai = "https://api.deepseek.com/v1"

[providers.rightapi]
name = "rightapi"
kind = "relay"
anthropic = "https://rightapi.ai"
openai = "https://rightapi.ai/v1"

[providers.xmapi]
name = "xmapi"
kind = "relay"

[providers.zlab-anycoding]
name = "zlab (anycoding)"
kind = "relay"

[providers.zlab-fengchao]
name = "zlab (fengchao)"
kind = "relay"

[providers.4router]
name = "4router (cheapclaude)"
kind = "relay"

[providers.zhinaoapi]
name = "zhinaoapi"
kind = "relay"
openai = "https://api.zhinaoapi.ai/v1"

[providers.anyrouter]
name = "anyrouter"
kind = "relay"
anthropic = "https://anyrouter.top"
openai = "https://anyrouter.top/v1"

[providers.zlab]
name = "zlab"
kind = "relay"
anthropic = "https://ttft.asia"
openai = "https://ttft.asia/v1"

# ---------------------------------------------------------------- harnesses
# The key is the Harbor agent name; apis are the formats it speaks, best first.

[harnesses.claude-code]
name = "Claude Code"
apis = ["anthropic"]

[harnesses.codex]
name = "Codex"
apis = ["responses"]

[harnesses.opencode]
name = "OpenCode"
apis = ["anthropic", "responses", "chat", "google"]

[harnesses.pi]
name = "Pi"
apis = ["anthropic", "responses", "chat"]

[harnesses.cursor]
name = "Cursor"
apis = []  # past runs only; Harbor's agent is cursor-cli and needs a Cursor login

[harnesses.dsh]
name = "dsh"
apis = []  # past runs only

[harnesses.goose]
name = "Goose"
apis = ["anthropic", "chat"]

[harnesses.aider]
name = "Aider"
apis = ["anthropic", "chat"]

[harnesses.qwen-coder]
name = "Qwen Code"
apis = ["chat"]

[harnesses.kimi-cli]
name = "Kimi CLI"
apis = ["anthropic", "chat"]

[harnesses.hermes]
name = "Hermes"
apis = ["chat"]

[harnesses.mini-swe-agent]
name = "mini-SWE-agent"
apis = ["anthropic", "chat"]

[harnesses.openhands]
name = "OpenHands"
apis = ["anthropic", "chat"]

[harnesses.openclaw]
name = "OpenClaw"
apis = ["anthropic", "chat"]

[harnesses.gemini-cli]
name = "Gemini CLI"
apis = ["google"]

